ast doughnuts）製作時，若要控制成金黃色澤產品時，在製程上應注意？", "options": ["適當的發酵", "過度的發酵", "低溫長時間之油炸", "較硬之麵糰"], "answer": 1, "note": "", "explanation": "酵母甜甜圈要金黃色澤，必須適當發酵。發酵過度表面色淺、吃油多；不足則色深。", "image": ""}, {"id": "03-92", "section": "03", "sectionName": "產品製作", "no": 92, "question": "烤焙麵糰極軟的小西餅時最好使用？", "options": ["細網狀", "粗網狀", "平板狀", "圓孔狀 烤盤（鋼帶）"], "answer": 3, "note": "", "explanation": "麵糰極軟的小西餅適用平板狀烤盤，避免麵糰流入孔洞或網眼。", "image": ""}, {"id": "03-93", "section": "03", "sectionName": "產品製作", "no": 93, "question": "為使小西餅成品帶有金黃色色澤，配方中可使用？", "options": ["澱粉", "奶粉", "防腐劑", "抗氧化劑"], "answer": 2, "note": "", "explanation": "奶粉中含乳糖，烤焙時容易上色，可使小西餅帶有金黃色澤。", "image": ""}, {"id": "03-94", "section": "03", "sectionName": "產品製作", "no": 94, "question": "硬質甜餅乾成型時為求印模圖案清晰，在配方中可加入？", "options": ["沙拉油", "玉米澱粉", "膨脹劑", "粗砂糖 改善"], "answer": 2, "note": "", "explanation": "硬質甜餅乾要印模圖案清晰，可加入玉米澱粉，降低麵糰的筋性、減少回縮。", "image": ""}, {"id": "03-95", "section": "03", "sectionName": "產品製作", "no": 95, "question": "鬆餅（起酥，puff pastry）的製作下列何者影響膨脹度最大？", "options": ["糖", "蛋", "麵粉", "裹入用油脂"], "answer": 4, "note": "", "explanation": "鬆餅的膨脹度受裹入用油脂影響最大。", "image": ""}, {"id": "03-96", "section": "03", "sectionName": "產品製作", "no": 96, "question": "酵母油炸甜圈餅（酵母道納司，yeast doughnuts）所使用的配方，大致上與甜麵包類似，然在為求成品之品質與形狀之完整性，則酵母油炸甜圈餅（酵母道納司，yeast doughnuts）配方中的糖與油脂，較甜麵包配方？", "options": ["高", "少", "相等", "視情況而定"], "answer": 2, "note": "", "explanation": "酵母甜甜圈為保持品質與形狀完整，糖與油脂的量比甜麵包少。", "image": ""}, {"id": "03-97", "section": "03", "sectionName": "產品製作", "no": 97, "question": "下列何種油炸甜圈餅（道納司，doughnuts），可採用烤焙方法製作？", "options": ["法式道納司", "蛋糕油炸甜圈餅", "酵母油炸甜圈餅", "麻花道納司"], "answer": 1, "note": "", "explanation": "法式道納司（泡芙麵糊製）可以用烤焙方式製作；蛋糕、酵母、麻花道納司通常油炸。", "image": ""}, {"id": "03-98", "section": "03", "sectionName": "產品製作", "no": 98, "question": "慕斯(mousse)西點的製作，一般由下列何種原料組合而成？", "options": ["雞蛋、玉米澱粉及果汁", "蛋黃、果膠及果汁", "鮮奶油、蛋白及果汁", "鮮奶油、吉利丁(gelatine)及果汁"], "answer": 4, "note": "", "explanation": "慕斯是由鮮奶油、吉利丁與果汁（或巧克力等）組合而成。", "image": ""}, {"id": "03-99", "section": "03", "sectionName": "產品製作", "no": 99, "question": "下列何種原料之組合不適宜製作夏季透明性涼果類產品？", "options": ["玉米澱粉、果汁", "果膠、果汁", "洋菜、果汁", "吉利丁(gelatine)、果汁"], "answer": 1, "note": "", "explanation": "夏季透明性涼果類要用凝凍力強且透明的原料。玉米澱粉糊混濁、遇熱遇水易軟化，不適合。", "image": ""}, {"id": "03-100", "section": "03", "sectionName": "產品製作", "no": 100, "question": "下列何種原料之組合及製作條件，適合製作良好品質的翻糖(fondant)？", "options": ["細粒特砂、水、熬煮終點溫度 135℃", "細粒特砂、水、熬煮終點溫度 100℃", "細粒特砂、水、葡萄糖漿、熬煮終點溫度 115℃", "細粒特砂、水、葡萄糖漿、熬煮終點溫度 135℃"], "answer": 3, "note": "", "explanation": "製作翻糖要用細粒特砂、水、葡萄糖漿，熬煮終點溫度約 115℃，才能得到細緻光滑的糖。", "image": ""}, {"id": "03-101", "section": "03", "sectionName": "產品製作", "no": 101, "question": "下列那一項非麵包滾圓的目的？", "options": ["鬆弛麵筋使麵糰易於整型", "使麵糰表面光滑不易粘手", "使麵糰易於保住二氧化碳", "使氣體均勻分佈"], "answer": 1, "note": "", "explanation": "滾圓的目的是使麵糰表面光滑、易保氣、使氣體均勻；鬆弛麵筋是中間發酵的作用。", "image": ""}, {"id": "03-102", "section": "03", "sectionName": "產品製作", "no": 102, "question": "調整配方時，下列何者材料不會使麵包麵糰較軟？", "options": ["水", "糖", "油", "麵粉"], "answer": 4, "note": "", "explanation": "水、糖、油都會使麵糰變軟，麵粉增加會使麵糰變硬。", "image": ""}, {"id": "03-103", "section": "03", "sectionName": "產品製作", "no": 103, "question": "調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？", "options": ["水", "糖", "油", "麵粉"], "answer": 1, "note": "", "explanation": "蛋含水量約 75％，增加蛋量要減少水，以維持麵糰軟硬度。", "image": ""}, {"id": "03-104", "section": "03", "sectionName": "產品製作", "no": 104, "question": "法國麵包（硬式麵包）常用之烤焙溫度為多少？", "options": ["230℃", "200℃", "170℃", "150℃"], "answer": 1, "note": "", "explanation": "法國麵包烤焙溫度約 230℃，高溫使表皮脆。", "image": ""}, {"id": "03-105", "section": "03", "sectionName": "產品製作", "no": 105, "question": "800 公克的帶蓋土司在正常的狀態下，給予 200℃烤溫，烤焙所需時間為？", "options": ["15～20 分", "35～40 分", "55～60 分", "1 小時以上"], "answer": 2, "note": "", "explanation": "800 公克帶蓋土司，以 200℃烤，約 35～40 分鐘。", "image": ""}, {"id": "03-106", "section": "03", "sectionName": "產品製作", "no": 106, "question": "下列那一種麵包，烤焙時間最短？", "options": ["800 公克的帶蓋土司", "450 公克的圓頂葡萄乾土司", "350 公克的法國麵包", "90 公克包餡的甜麵包"], "answer": 4, "note": "", "explanation": "90 公克的包餡甜麵包體積最小，烤焙時間最短。", "image": ""}, {"id": "03-107", "section": "03", "sectionName": "產品製作", "no": 107, "question": "下列那一種麵包必需使用蒸氣烤爐？", "options": ["甜麵包", "丹麥麵包", "硬式麵包", "葡萄乾麵包"], "answer": 3, "note": "", "explanation": "硬式麵包要使用蒸氣烤爐，才能使表皮薄脆且有光澤。", "image": ""}, {"id": "03-108", "section": "03", "sectionName": "產品製作", "no": 108, "question": "圓烤盤，其直徑為 22 公分、高 5 公分其容積為？", "options": ["1899.7 立方公分", "1997.7 立方公分", "7598.8 立方公分", "110 立方公分"], "answer": 1, "note": "", "explanation": "容積＝π × r² × h ＝ 3.14 × 11² × 5 ≈ 1,899.7 立方公分。", "image": ""}, {"id": "03-109", "section": "03", "sectionName": "產品製作", "no": 109, "question": "長方型烤盤，其長為 30 公分、寬為 22 公分、高為 5 公分，其容積為？", "options": ["3300 平方公分", "3300 立方公分", "660 平方公分", "660 立方公分"], "answer": 2, "note": "", "explanation": "容積＝ 30 × 22 × 5 ＝ 3,300 立方公分。", "image": ""}, {"id": "03-110", "section": "03", "sectionName": "產品製作", "no": 110, "question": "低成分重奶油蛋糕，採用何種攪拌方法為宜？", "options": ["麵粉油脂拌合法", "糖油拌合法", "兩步拌合法", "糖水拌合法"], "answer": 2, "note": "", "explanation": "低成分的重奶油蛋糕（油脂較少）以糖油拌合法為宜；高成分才用麵粉油脂拌合法。", "image": ""}, {"id": "03-111", "section": "03", "sectionName": "產品製作", "no": 111, "question": "何種攪拌方法能節省人工和縮短攪拌時間？", "options": ["糖油拌合法", "麵粉油脂拌合法", "糖水拌合法", "直接法"], "answer": 4, "note": "", "explanation": "直接法一次把材料拌合，最省人工、攪拌時間最短。", "image": ""}, {"id": "03-112", "section": "03", "sectionName": "產品製作", "no": 112, "question": "麵糊類蛋糕的麵糊溫度應該是？", "options": ["10℃", "15℃", "22℃", "30℃ 在這個溫度的麵糊所烤出來的蛋糕，體積最大，內部組織細膩"], "answer": 3, "note": "", "explanation": "麵糊類蛋糕的麵糊溫度以 22℃最佳，體積最大、組織細膩。", "image": ""}, {"id": "03-113", "section": "03", "sectionName": "產品製作", "no": 113, "question": "下列何種蛋糕在烘焙時不可擦防粘油脂？", "options": ["海綿蛋糕", "重奶油蛋糕", "輕奶油蛋糕", "天使蛋糕"], "answer": 4, "note": "", "explanation": "天使蛋糕烤盤不可擦油，否則蛋白泡沫消失；其他蛋糕可擦防粘油脂。", "image": ""}, {"id": "03-114", "section": "03", "sectionName": "產品製作", "no": 114, "question": "理想的海綿蛋糕麵糊比重為", "options": ["0.46", "0.56", "0.66", "0.76 左右"], "answer": 1, "note": "", "explanation": "理想的海綿蛋糕麵糊比重約 0.46。", "image": ""}, {"id": "03-115", "section": "03", "sectionName": "產品製作", "no": 115, "question": "利用糖油拌合法製作丹麥小西餅(Danish cookies)，材料中的麵粉應在最後加入，輕輕拌勻，其主要的原因為？", "options": ["容易吸收水分", "好控制麵粉量", "避免攪拌出筋", "防止破壞打發的氣泡"], "answer": 3, "note": "", "explanation": "糖油拌合法做丹麥小西餅，麵粉最後輕輕拌勻，目的是避免攪拌出筋。", "image": ""}, {"id": "03-116", "section": "03", "sectionName": "產品製作", "no": 116, "question": "菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其原因為？", "options": ["不需最後發酵", "需較高濕度發酵", "需較高溫度發酵", "避免高濕高溫的發酵使菠蘿皮融解而化開"], "answer": 4, "note": "", "explanation": "菠蘿甜麵包整形後放室內，是避免高濕高溫的發酵使菠蘿皮融化。", "image": ""}, {"id": "03-117", "section": "03", "sectionName": "產品製作", "no": 117, "question": "50～100 公克左右的甜麵包，其烤焙應？", "options": ["上火為主，下火為輔", "只用上火", "下火為主，上火為輔", "只用下火"], "answer": 1, "note": "", "explanation": "50～100 公克的甜麵包，烤焙以上火為主，下火為輔，使表面上色良好、底部不焦。", "image": ""}, {"id": "03-118", "section": "03", "sectionName": "產品製作", "no": 118, "question": "以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？", "options": ["硬", "粗糙", "細膩", "沒影響"], "answer": 2, "note": "", "explanation": "糖油打發過度，空氣過多，產品組織較粗糙。", "image": ""}, {"id": "03-119", "section": "03", "sectionName": "產品製作", "no": 119, "question": "戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？", "options": ["組織較軟", "拌入其他材料時易消泡", "體積較大", "不影響蛋糕品質"], "answer": 2, "note": "", "explanation": "戚風蛋糕蛋白與糖攪拌不足，蛋白泡沫不穩定，拌入其他材料時容易消泡。", "image": ""}, {"id": "03-120", "section": "03", "sectionName": "產品製作", "no": 120, "question": "可以減少海綿蛋糕出爐時收縮的程度為？", "options": ["選用麵筋較強的麵粉", "烤焙時間避免過久", "烤盤擦油", "減少配方中的用油量"], "answer": 2, "note": "", "explanation": "烤焙時間不要過久，海綿蛋糕出爐收縮的程度就會減少。", "image": ""}, {"id": "03-121", "section": "03", "sectionName": "產品製作", "no": 121, "question": "添加下列那一項材料不會增加蛋糕的柔軟度？", "options": ["糖", "油", "蛋黃", "麵粉"], "answer": 4, "note": "", "explanation": "糖、油、蛋黃都能使蛋糕柔軟；麵粉增加會使蛋糕變硬。", "image": ""}, {"id": "03-122", "section": "03", "sectionName": "產品製作", "no": 122, "question": "一般麵糊類蛋糕烤熟與否的判斷方法？", "options": ["以探針試探或以手輕拍", "以顏色判斷即可", "時間一到即可出爐", "敲烤盤邊聽聲音判斷"], "answer": 1, "note": "", "explanation": "麵糊類蛋糕烤熟與否，可用探針試探或用手輕拍表面判斷。", "image": ""}, {"id": "03-123", "section": "03", "sectionName": "產品製作", "no": 123, "question": "切割蛋糕用的刀子，下列那一種方式既可防止細菌污染又可達到切面整齊的要求？", "options": ["洗淨使用", "以布擦拭後使用", "浸在沸水中燙一次，切一次", "在沸水中燙一次用布擦一下使用"], "answer": 3, "note": "", "explanation": "切蛋糕的刀浸在沸水中燙一次、切一次，既可殺菌，又能使切面整齊。", "image": ""}, {"id": "03-124", "section": "03", "sectionName": "產品製作", "no": 124, "question": "煮製檸檬布丁餡時檸檬汁在？", "options": ["與水一道加入", "與玉米澱粉拌勻加入", "糖水部分煮沸後加入", "待餡煮好後加入拌勻"], "answer": 4, "note": "", "explanation": "檸檬汁是酸，會破壞澱粉的黏稠度，所以要等餡煮好後再加入拌勻。", "image": ""}, {"id": "03-125", "section": "03", "sectionName": "產品製作", "no": 125, "question": "製作丹麥麵包整形宜在？", "options": ["近烤爐邊", "一般的工作間", "在溫度較低的場所", "與溫度無關，在那裡整形皆可"], "answer": 3, "note": "", "explanation": "製作丹麥麵包的整形要在溫度較低的場所進行，避免裹入油脂融化。", "image": ""}, {"id": "03-126", "section": "03", "sectionName": "產品製作", "no": 126, "question": "麵粉的 pH 值變小時，小西餅的體積", "options": ["不變", "變大", "變小", "變厚"], "answer": 3, "note": "", "explanation": "麵粉的 pH 值變小（偏酸）時，小西餅的體積變小。", "image": ""}, {"id": "03-127", "section": "03", "sectionName": "產品製作", "no": 127, "question": "餅乾用麵粉，若酸度偏高時，配方中應提高？", "options": ["小蘇打", "水", "氧化劑", "油脂 的用量"], "answer": 1, "note": "", "explanation": "餅乾用麵粉酸度偏高時，可增加小蘇打用量，中和酸度。", "image": ""}, {"id": "03-128", "section": "03", "sectionName": "產品製作", "no": 128, "question": "蘇打餅乾成品的 pH 值比一般奶油小西餅為？", "options": ["高", "相同", "低", "測不出來"], "answer": 1, "note": "", "explanation": "蘇打餅乾用小蘇打，pH 值比一般奶油小西餅高。", "image": ""}, {"id": "03-129", "section": "03", "sectionName": "產品製作", "no": 129, "question": "下列那種因素不會影響麵包攪拌時間？", "options": ["攪拌速度不同", "配方不同", "攪拌機型式不同", "攪拌人員不同"], "answer": 4, "note": "", "explanation": "攪拌人員不同不會影響麵包攪拌時間；攪拌速度、配方、機型會影響。", "image": ""}, {"id": "03-130", "section": "03", "sectionName": "產品製作", "no": 130, "question": "正常情況下，甜麵包麵糰之攪拌時間，應比白土司麵包？", "options": ["長", "短", "一樣", "不受限制"], "answer": 1, "note": "", "explanation": "甜麵包糖油多，麵筋較不易形成，所以攪拌時間比白土司長。", "image": ""}, {"id": "03-131", "section": "03", "sectionName": "產品製作", "no": 131, "question": "麵糰整型時，如經過二道滾輪之整型機，正常第一道滾輪與第二道滾輪之間隙比為？", "options": ["6:1", "4:1", "2:1", "1:1"], "answer": 3, "note": "", "explanation": "二道滾輪整型機，第一道與第二道滾輪間隙比約 2：1。", "image": ""}, {"id": "03-132", "section": "03", "sectionName": "產品製作", "no": 132, "question": "下列那一項因素不會影響麵包之基本發酵時間？", "options": ["酵母量", "鹽", "麵糰溫度", "容器"], "answer": 4, "note": "", "explanation": "基本發酵時間受酵母量、鹽、麵糰溫度影響，容器不會影響。", "image": ""}, {"id": "03-133", "section": "03", "sectionName": "產品製作", "no": 133, "question": "下列何者不是影響烘焙食品烤焙條件設定之因素？", "options": ["產品種類", "產品大小", "烤爐種類", "烤焙人員"], "answer": 4, "note": "", "explanation": "烤焙條件受產品種類、大小、烤爐種類影響，與烤焙人員無關。", "image": ""}, {"id": "03-134", "section": "03", "sectionName": "產品製作", "no": 134, "question": "製作組織鬆軟體積較大的奶油蛋糕通常採用？", "options": ["糖油拌合法", "麵粉油脂拌合法", "直接拌合法", "糖水拌合法"], "answer": 1, "note": "", "explanation": "要做組織鬆軟、體積大的奶油蛋糕，通常採用糖油拌合法。", "image": ""}, {"id": "03-135", "section": "03", "sectionName": "產品製作", "no": 135, "question": "以攪拌機攪拌麵糊類蛋糕，下列那一項操作較為正確？", "options": ["自始至終一貫快速拌成", "隨時提升攪拌缸以利拌勻", "忽快忽慢促進麵筋形成", "先用慢速拌合材料，再以快速攪拌，中途停機刮勻缸底麵糊後再繼續攪拌"], "answer": 4, "note": "", "explanation": "攪拌麵糊類蛋糕：先用慢速拌合，再轉快速攪拌，中途停機刮缸底再繼續。", "image": ""}, {"id": "03-136", "section": "03", "sectionName": "產品製作", "no": 136, "question": "為促進蛋白的起泡性並改善蛋糕的風味可在配方中酌加？", "options": ["麩胺酸鈉", "檸檬汁", "酒精", "亞硝酸鉀"], "answer": 2, "note": "", "explanation": "蛋白中加檸檬汁，可促進起泡性並改善風味。", "image": ""}, {"id": "03-137", "section": "03", "sectionName": "產品製作", "no": 137, "question": "油炸甜圈餅（道納司，doughnuts）油脂宜選用？", "options": ["沙拉油", "豬油", "油炸油", "奶油"], "answer": 3, "note": "", "explanation": "炸甜甜圈宜用耐高溫的油炸油。", "image": ""}, {"id": "03-138", "section": "03", "sectionName": "產品製作", "no": 138, "question": "製作泡芙（奶油空心餅）時常添加之化學膨大劑為？", "options": ["碳酸氫銨（阿摩尼亞）", "小蘇打", "發粉", "酵母"], "answer": 1, "note": "", "explanation": "泡芙常添加碳酸氫銨（阿摩尼亞）作為化學膨大劑，受熱分解成氣體，使殼更酥鬆。", "image": ""}, {"id": "03-139", "section": "03", "sectionName": "產品製作", "no": 139, "question": "鬆餅（起酥，puff pastry）烤焙時烤爐宜選用？", "options": ["熱風爐", "普通爐", "蒸氣爐", "隧道爐"], "answer": 3, "note": "", "explanation": "鬆餅用蒸氣爐烤焙，可使表皮不過早乾硬，膨脹較佳。", "image": ""}, {"id": "03-140", "section": "03", "sectionName": "產品製作", "no": 140, "question": "派皮堅韌不酥的原因為？", "options": ["派餡裝盤時太熱", "麵糰拌合太久", "烘烤時間不夠", "油脂用量太多"], "answer": 2, "note": "", "explanation": "派皮堅韌不酥，常是麵糰拌合太久，麵筋形成過多。", "image": ""}, {"id": "03-141", "section": "03", "sectionName": "產品製作", "no": 141, "question": "派餡中牛奶布丁過於堅韌其原因為？", "options": ["烘烤時間太久", "派皮太厚", "熬煮膠凝程度不夠", "派餡溫度太低"], "answer": 1, "note": "", "explanation": "牛奶布丁派餡過於堅韌，是因為烘烤時間太久。", "image": ""}, {"id": "03-142", "section": "03", "sectionName": "產品製作", "no": 142, "question": "以直接法製作鹹餅乾，麵糰發酵的溫度以下列何者為宜？", "options": ["32℃", "42℃", "52℃", "62℃"], "answer": 1, "note": "", "explanation": "鹹餅乾直接法發酵溫度約 32℃。", "image": ""}, {"id": "03-143", "section": "03", "sectionName": "產品製作", "no": 143, "question": "麵包製作時翻麵的目的，以下何者為非？", "options": ["平均溫度", "促進發酵", "抑制發酵", "促進氣體保留"], "answer": 3, "note": "", "explanation": "翻麵是為了平均溫度、促進發酵與氣體保留，不是抑制發酵。", "image": ""}, {"id": "03-144", "section": "03", "sectionName": "產品製作", "no": 144, "question": "麵包直接法配方中，已知水用量為 360g，理想水溫為 5℃，自來水溫為 20℃，該日室溫為 28℃，冰用量為？", "options": ["40g", "54g", "80g", "100g"], "answer": 2, "note": "", "explanation": "冰用量＝ 水量 ×（自來水溫 － 理想水溫）÷（80 ＋ 自來水溫）＝ 360 ×（20－5）÷ 100 ＝ 54 g。", "image": ""}, {"id": "03-145", "section": "03", "sectionName": "產品製作", "no": 145, "question": "製作蛋糕使用未經鹼處理過的可可粉時，應以部分小蘇打代替發粉，其用量為可可粉用量之", "options": ["2％", "7％", "10％", "15％"], "answer": 2, "note": "", "explanation": "未經鹼處理的可可粉偏酸，要以部分小蘇打取代發粉，用量約為可可粉的 7％。", "image": ""}, {"id": "03-146", "section": "03", "sectionName": "產品製作", "no": 146, "question": "一般蒸烤牛奶布丁，所選用之凝凍材料為？", "options": ["雞蛋", "吉利丁", "玉米粉", "麵粉"], "answer": 1, "note": "", "explanation": "蒸烤牛奶布丁以雞蛋作為凝凍材料。", "image": ""}, {"id": "03-147", "section": "03", "sectionName": "產品製作", "no": 147, "question": "烤焙不帶蓋土司若烤焙時間相同，烤爐溫度太高會造成", "options": ["體積大", "表皮顏色深", "烘焙損耗小", "表皮顏色淺"], "answer": 2, "note": "", "explanation": "不帶蓋土司，爐溫太高，表皮顏色會較深。", "image": ""}, {"id": "03-148", "section": "03", "sectionName": "產品製作", "no": 148, "question": "烤焙甜麵包時，若烤焙時間相同烤爐溫度太低會造成", "options": ["體積不變", "底部顏色深", "表皮顏色淺", "組織細緻"], "answer": 3, "note": "", "explanation": "烤甜麵包爐溫太低，表皮顏色會較淺。", "image": ""}, {"id": "03-149", "section": "03", "sectionName": "產品製作", "no": 149, "question": "攪拌中種麵糰時為控制理想溫度為 25℃，下列何者為宜？", "options": ["攪拌時間延長", "水溫提高", "依室溫及攪拌設備，控制材料溫度及攪拌時間", "用高速攪拌"], "answer": 3, "note": "", "explanation": "要使中種麵糰溫度達 25℃，要依室溫與攪拌設備，控制材料溫度與攪拌時間。", "image": ""}, {"id": "03-150", "section": "03", "sectionName": "產品製作", "no": 150, "question": "製作天使蛋糕擬降低蛋白之韌性可增加", "options": ["蛋白量", "麵粉量", "糖量", "鹽量"], "answer": 3, "note": "", "explanation": "增加糖量可使蛋白變軟、降低韌性，使天使蛋糕更細緻。", "image": ""}, {"id": "03-151", "section": "03", "sectionName": "產品製作", "no": 151, "question": "為改善麵粉中澱粉之膠體性質及改良麵包之內部組織，一般可加入？", "options": ["纖維分解酵素", "脂肪分解酵素", "蛋白質分解酵素", "液化酵素"], "answer": 4, "note": "", "explanation": "液化酵素（α-澱粉酶）能改善澱粉膠體性質，改良麵包內部組織。", "image": ""}, {"id": "03-152", "section": "03", "sectionName": "產品製作", "no": 152, "question": "一般攪拌好之麵糰 pH 值約為 6.0，發酵後之麵糰 pH 值會？", "options": ["下降", "上升", "不改變", "先上升再下降"], "answer": 1, "note": "", "explanation": "發酵後產生有機酸，麵糰 pH 值會下降。", "image": ""}, {"id": "03-153", "section": "03", "sectionName": "產品製作", "no": 153, "question": "下列何者，不是造成發酵後之麵糰 pH 值會下降的原因？", "options": ["麵糰內之乳酸菌，於發酵時產生乳酸", "麵糰內之醋酸菌，於發酵時產生醋酸", "硫酸氨改良劑經酵母代謝作用而產生硫酸", "麵糰中加乳化劑"], "answer": 4, "note": "", "explanation": "乳化劑不會使麵糰 pH 值下降；乳酸、醋酸、硫酸等才會。", "image": ""}, {"id": "03-154", "section": "03", "sectionName": "產品製作", "no": 154, "question": "餅乾在連續式隧道爐烤焙，若將烤爐分成四區時，餅體組織的固定是在？", "options": ["第一區", "第二區", "第三區", "第四區"], "answer": 3, "note": "", "explanation": "餅乾在隧道爐中，組織固定發生在第三區。", "image": ""}, {"id": "03-155", "section": "03", "sectionName": "產品製作", "no": 155, "question": "餅乾麵糰在烤焙過程中，物性改變且遞減的是？", "options": ["水分", "顏色", "厚度", "膨脹度"], "answer": 1, "note": "", "explanation": "烤焙過程中，餅乾的水分逐漸減少（遞減）；顏色、厚度、膨脹度則先增加或變深。", "image": ""}, {"id": "03-156", "section": "03", "sectionName": "產品製作", "no": 156, "question": "餅乾麵糰在壓延成型時，打孔洞的原因，下列何者敘述錯誤？", "options": ["有表面裝飾之作用", "減少原料用量、降低成本", "切斷麵糰筋性、防止緊縮作用", "水分變成水蒸氣，有孔洞時可保持較均勻的膨脹度"], "answer": 2, "note": "", "explanation": "壓延成型時打孔，是為裝飾、切斷筋性、防止緊縮、讓水蒸氣排出；並非為了降低成本。", "image": ""}, {"id": "03-157", "section": "03", "sectionName": "產品製作", "no": 157, "question": "解決硬質餅乾或蘇打餅乾在成型時麵片收縮的方法為何？", "options": ["表面噴水", "麵片作打浪狀", "撒麵粉", "重新混合製作"], "answer": 2, "note": "", "explanation": "硬質餅乾或蘇打餅乾麵片收縮時，可將麵片作成打浪狀，減少收縮。", "image": ""}, {"id": "03-158", "section": "03", "sectionName": "產品製作", "no": 158, "question": "製造調味餅乾在表面加入調味粉最適當之時機為？", "options": ["餅片成型後、入烤爐前", "出烤爐噴油後", "在烤焙時", "進包裝機前"], "answer": 2, "note": "", "explanation": "調味餅乾要在出爐後趁熱噴油，再撒上調味粉，使調味料附著。", "image": ""}, {"id": "03-159", "section": "03", "sectionName": "產品製作", "no": 159, "question": "下列何種產品的生麵片經成型、烤焙後的收縮率最大？", "options": ["蘇打餅乾", "瑪莉餅乾", "冰箱小西餅", "乳沫類小西餅"], "answer": 1, "note": "", "explanation": "蘇打餅乾的麵筋多，烤焙後收縮率最大。", "image": ""}, {"id": "03-160", "section": "03", "sectionName": "產品製作", "no": 160, "question": "下列何種產品在攪拌過程中，麵糰的溫度最高？", "options": ["蘇打餅乾", "瑪莉餅乾", "冰箱小西餅", "乳沫類小西餅"], "answer": 2, "note": "", "explanation": "瑪琍餅乾含糖油較多，攪拌過程中麵糰溫度最高。", "image": ""}, {"id": "03-161", "section": "03", "sectionName": "產品製作", "no": 161, "question": "烤焙巧克力小西餅時，判斷烤熟程度之最佳之方式為何？", "options": ["依烤焙時間決定", "依顏色判斷", "依烤焙時間及用手觸摸", "依產品冒煙程度判斷"], "answer": 3, "note": "", "explanation": "烤巧克力小西餅不易以顏色判斷，要依烤焙時間並用手觸摸判斷熟度。", "image": ""}, {"id": "03-162", "section": "03", "sectionName": "產品製作", "no": 162, "question": "製造小西餅麵糰較為乾硬時，成品的質地是？", "options": ["酥鬆", "鬆軟", "酥脆", "硬脆"], "answer": 4, "note": "", "explanation": "麵糰較乾硬的小西餅，成品質地硬脆。", "image": ""}, {"id": "03-163", "section": "03", "sectionName": "產品製作", "no": 163, "question": "造成小西餅裂痕特性的原料是？", "options": ["葡萄糖漿", "糖粉", "砂糖", "焦糖"], "answer": 3, "note": "", "explanation": "砂糖顆粒粗，在烤焙時局部溶化，形成裂痕。", "image": ""}, {"id": "03-164", "section": "03", "sectionName": "產品製作", "no": 164, "question": "下列成品何者含水量最少?", "options": ["白土司", "重奶油蛋糕", "海綿小西餅", "椰子餅乾"], "answer": 4, "note": "", "explanation": "椰子餅乾水分最少，其次才是其他。", "image": ""}, {"id": "03-165", "section": "03", "sectionName": "產品製作", "no": 165, "question": "下列餅乾配方原料含量，何者口感最鬆酥？", "options": ["糖＞油>水", "糖≒油＞水", "油>糖>水", "水＞35%"], "answer": 3, "note": "", "explanation": "油量多於糖與水時，餅乾口感最鬆酥。", "image": ""}, {"id": "03-166", "section": "03", "sectionName": "產品製作", "no": 166, "question": "想保持丹麥小西餅有明顯花紋，下列何者不正確?", "options": ["使用高筋麵粉取代低筋麵粉", "糖油攪拌時充分打發", "可使用直接法攪拌", "使用上火大烤焙"], "answer": 2, "note": "", "explanation": "要保持丹麥小西餅明顯花紋，糖油不應打發太過，所以「糖油充分打發」是不正確的。", "image": ""}, {"id": "03-167", "section": "03", "sectionName": "產品製作", "no": 167, "question": "下列何者是造成奶油布丁餡結粒的原因？", "options": ["配方中牛奶量太多", "煮時爐火太小", "煮時攪拌太慢", "快速冷卻"], "answer": 3, "note": "", "explanation": "煮奶油布丁餡時攪拌太慢，粉類容易結粒。", "image": ""}, {"id": "03-168", "section": "03", "sectionName": "產品製作", "no": 168, "question": "下列何者不是造成蒸烤雞蛋布丁脫模崩塌的原因？", "options": ["凝膠材料不足", "下火太小", "蒸烤時間不足", "未冷卻就脫模"], "answer": 4, "note": "", "explanation": "蒸烤布丁脫模崩塌，常因凝膠材料（蛋）不足、下火太小使底部未凝固、蒸烤時間不足。題庫答案為④「未冷卻就脫模」不是原因；但實務上太熱脫模也可能使布丁變形，考試以題庫答案為準。", "image": ""}, {"id": "03-169", "section": "03", "sectionName": "產品製作", "no": 169, "question": "製作布丁餡甜麵包的布丁餡，那一項不是以零分計？", "options": ["布丁餡不凝固", "布丁餡凝固且光滑", "布丁餡有焦黑顆粒或結顆粒", "布丁餡堅硬如羊羹"], "answer": 2, "note": "", "explanation": "布丁餡凝固且光滑是良好的，不扣分；不凝固、有焦黑或結顆粒、堅硬如羊羹都以零分計。", "image": ""}, {"id": "03-170", "section": "03", "sectionName": "產品製作", "no": 170, "question": "製作布丁餡甜麵包，成品直徑 9.5 公分（含）以上，高度 5 公分（含）以上，下列何者不是「不良品」？", "options": ["高度 4 公分", "成品直徑 8 公分", "高度 4.5 公分", "成品直徑 10 公分"], "answer": 4, "note": "", "explanation": "成品直徑要 9.5 公分以上、高度 5 公分以上；直徑 10 公分符合標準，所以不是不良品。", "image": ""}, {"id": "03-171", "section": "03", "sectionName": "產品製作", "no": 171, "question": "全素業者製作布丁餡時，那一項不是選用的材料？", "options": ["豆漿", "牛奶", "馬鈴薯澱粉", "椰漿"], "answer": 2, "note": "", "explanation": "全素業者的布丁餡用豆漿、植物澱粉、椰漿，不能用牛奶。", "image": ""}, {"id": const $ = id => document.getElementById(id);
const MARK = ['①','②','③','④'];
let pool = [], idx = 0, correct = 0, wrong = [], answered = false;

const secMap = {};
DATA.forEach(q => secMap[q.section] = q.sectionName);
$('total').textContent = DATA.length;
Object.keys(secMap).forEach(k => {
  const n = DATA.filter(q => q.section === k).length;
  const l = document.createElement('label');
  l.className = 'chk';
  l.innerHTML = `<input type="checkbox" value="${k}" checked> 工作項目 ${k}：${secMap[k]}（${n} 題）`;
  $('secs').appendChild(l);
});
function selected(){
  const s = [...document.querySelectorAll('#secs input:checked')].map(i => i.value);
  return DATA.filter(q => s.includes(q.section));
}
function refreshMax(){ $('max').textContent = selected().length; }
document.querySelectorAll('#secs input').forEach(i => i.onchange = refreshMax);
refreshMax();
$('all').onclick = () => $('count').value = selected().length;

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
$('start').onclick = () => {
  const s = selected();
  if(!s.length){alert('請至少選一個範圍');return;}
  let n = Math.max(1, Math.min(parseInt($('count').value)||1, s.length));
  pool = shuffle(s).slice(0, n);
  idx = 0; correct = 0; wrong = [];
  $('setup').classList.add('hide'); $('result').classList.add('hide'); $('quiz').classList.remove('hide');
  show();
};
function show(){
  const q = pool[idx]; answered = false;
  $('bar').style.width = (idx/pool.length*100)+'%';
  $('meta').textContent = `第 ${idx+1} / ${pool.length} 題　·　題庫 ${q.section}-${q.no}（${q.sectionName}）`;
  $('qtext').textContent = q.question;
  $('fb').textContent = ''; $('fb').className = 'fb';
  $('note').textContent = q.note || '';
  $('exp').classList.add('hide'); $('exp').innerHTML = '';
  $('opts').innerHTML = '';
  q.options.forEach((o,i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = `${MARK[i]} ${o}`;
    b.onclick = () => pick(i+1, b);
    $('opts').appendChild(b);
  });
  $('next').disabled = true;
  $('next').textContent = idx === pool.length-1 ? '查看結果' : '下一題';
}
function pick(n, btn){
  if(answered) return; answered = true;
  const q = pool[idx];
  const bs = [...$('opts').children];
  bs.forEach(b => b.disabled = true);
  bs[q.answer-1].classList.add('ok');
  if(n === q.answer){ correct++; $('fb').textContent = '✔ 答對了'; $('fb').classList.add('ok'); }
  else { btn.classList.add('ng'); wrong.push(q); $('fb').textContent = `✘ 答錯了，正確答案：${MARK[q.answer-1]} ${q.options[q.answer-1]}`; $('fb').classList.add('ng'); }
  const e = $('exp');
  e.innerHTML = '<b>解析</b><br>';
  const tx = document.createElement('span');
  tx.textContent = q.explanation || '（此題尚未建立解析）';
  e.appendChild(tx);
  if(q.image){ const im = document.createElement('img'); im.src = q.image; im.alt = '解析附圖'; e.appendChild(im); }
  e.classList.remove('hide');
  $('next').disabled = false;
}
$('next').onclick = () => { if(idx < pool.length-1){idx++;show();} else finish(); };
$('quit').onclick = () => { if(confirm('確定結束並查看結果？')) { pool = pool.slice(0, idx + (answered?1:0)); if(!pool.length){reset();return;} finish(); } };
function finish(){
  $('quiz').classList.add('hide'); $('result').classList.remove('hide');
  $('score').textContent = `${correct} / ${pool.length}（${Math.round(correct/pool.length*100)}%）`;
  $('wrongs').innerHTML = wrong.length ? '<p><b>錯題檢討</b></p>' : '<p>全部答對 🎉</p>';
  wrong.forEach(q => {
    const d = document.createElement('div'); d.className = 'wrong';
    d.textContent = `${q.section}-${q.no} ${q.question}　正確：${MARK[q.answer-1]} ${q.options[q.answer-1]}`;
    $('wrongs').appendChild(d);
  });
}
function reset(){ $('quiz').classList.add('hide'); $('result').classList.add('hide'); $('setup').classList.remove('hide'); }
$('again').onclick = reset;
</script>
