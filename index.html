、蛋白及果汁", "鮮奶油、吉利丁(gelatine)及果汁"], "answer": 4, "note": "", "explanation": "慕斯是由鮮奶油、吉利丁與果汁（或巧克力等）組合而成。", "image": ""}, {"id": "03-99", "section": "03", "sectionName": "產品製作", "no": 99, "question": "下列何種原料之組合不適宜製作夏季透明性涼果類產品？", "options": ["玉米澱粉、果汁", "果膠、果汁", "洋菜、果汁", "吉利丁(gelatine)、果汁"], "answer": 1, "note": "", "explanation": "夏季透明性涼果類要用凝凍力強且透明的原料。玉米澱粉糊混濁、遇熱遇水易軟化，不適合。", "image": ""}, {"id": "03-100", "section": "03", "sectionName": "產品製作", "no": 100, "question": "下列何種原料之組合及製作條件，適合製作良好品質的翻糖(fondant)？", "options": ["細粒特砂、水、熬煮終點溫度 135℃", "細粒特砂、水、熬煮終點溫度 100℃", "細粒特砂、水、葡萄糖漿、熬煮終點溫度 115℃", "細粒特砂、水、葡萄糖漿、熬煮終點溫度 135℃"], "answer": 3, "note": "", "explanation": "製作翻糖要用細粒特砂、水、葡萄糖漿，熬煮終點溫度約 115℃，才能得到細緻光滑的糖。", "image": ""}, {"id": "03-101", "section": "03", "sectionName": "產品製作", "no": 101, "question": "下列那一項非麵包滾圓的目的？", "options": ["鬆弛麵筋使麵糰易於整型", "使麵糰表面光滑不易粘手", "使麵糰易於保住二氧化碳", "使氣體均勻分佈"], "answer": 1, "note": "", "explanation": "滾圓的目的是使麵糰表面光滑、易保氣、使氣體均勻；鬆弛麵筋是中間發酵的作用。", "image": ""}, {"id": "03-102", "section": "03", "sectionName": "產品製作", "no": 102, "question": "調整配方時，下列何者材料不會使麵包麵糰較軟？", "options": ["水", "糖", "油", "麵粉"], "answer": 4, "note": "", "explanation": "水、糖、油都會使麵糰變軟，麵粉增加會使麵糰變硬。", "image": ""}, {"id": "03-103", "section": "03", "sectionName": "產品製作", "no": 103, "question": "調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？", "options": ["水", "糖", "油", "麵粉"], "answer": 1, "note": "", "explanation": "蛋含水量約 75％，增加蛋量要減少水，以維持麵糰軟硬度。", "image": ""}, {"id": "03-104", "section": "03", "sectionName": "產品製作", "no": 104, "question": "法國麵包（硬式麵包）常用之烤焙溫度為多少？", "options": ["230℃", "200℃", "170℃", "150℃"], "answer": 1, "note": "", "explanation": "法國麵包烤焙溫度約 230℃，高溫使表皮脆。", "image": ""}, {"id": "03-105", "section": "03", "sectionName": "產品製作", "no": 105, "question": "800 公克的帶蓋土司在正常的狀態下，給予 200℃烤溫，烤焙所需時間為？", "options": ["15～20 分", "35～40 分", "55～60 分", "1 小時以上"], "answer": 2, "note": "", "explanation": "800 公克帶蓋土司，以 200℃烤，約 35～40 分鐘。", "image": ""}, {"id": "03-106", "section": "03", "sectionName": "產品製作", "no": 106, "question": "下列那一種麵包，烤焙時間最短？", "options": ["800 公克的帶蓋土司", "450 公克的圓頂葡萄乾土司", "350 公克的法國麵包", "90 公克包餡的甜麵包"], "answer": 4, "note": "", "explanation": "90 公克的包餡甜麵包體積最小，烤焙時間最短。", "image": ""}, {"id": "03-107", "section": "03", "sectionName": "產品製作", "no": 107, "question": "下列那一種麵包必需使用蒸氣烤爐？", "options": ["甜麵包", "丹麥麵包", "硬式麵包", "葡萄乾麵包"], "answer": 3, "note": "", "explanation": "硬式麵包要使用蒸氣烤爐，才能使表皮薄脆且有光澤。", "image": ""}, {"id": "03-108", "section": "03", "sectionName": "產品製作", "no": 108, "question": "圓烤盤，其直徑為 22 公分、高 5 公分其容積為？", "options": ["1899.7 立方公分", "1997.7 立方公分", "7598.8 立方公分", "110 立方公分"], "answer": 1, "note": "", "explanation": "容積＝π × r² × h ＝ 3.14 × 11² × 5 ≈ 1,899.7 立方公分。", "image": ""}, {"id": "03-109", "section": "03", "sectionName": "產品製作", "no": 109, "question": "長方型烤盤，其長為 30 公分、寬為 22 公分、高為 5 公分，其容積為？", "options": ["3300 平方公分", "3300 立方公分", "660 平方公分", "660 立方公分"], "answer": 2, "note": "", "explanation": "容積＝ 30 × 22 × 5 ＝ 3,300 立方公分。", "image": ""}, {"id": "03-110", "section": "03", "sectionName": "產品製作", "no": 110, "question": "低成分重奶油蛋糕，採用何種攪拌方法為宜？", "options": ["麵粉油脂拌合法", "糖油拌合法", "兩步拌合法", "糖水拌合法"], "answer": 2, "note": "", "explanation": "低成分的重奶油蛋糕（油脂較少）以糖油拌合法為宜；高成分才用麵粉油脂拌合法。", "image": ""}, {"id": "03-111", "section": "03", "sectionName": "產品製作", "no": 111, "question": "何種攪拌方法能節省人工和縮短攪拌時間？", "options": ["糖油拌合法", "麵粉油脂拌合法", "糖水拌合法", "直接法"], "answer": 4, "note": "", "explanation": "直接法一次把材料拌合，最省人工、攪拌時間最短。", "image": ""}, {"id": "03-112", "section": "03", "sectionName": "產品製作", "no": 112, "question": "麵糊類蛋糕的麵糊溫度應該是？", "options": ["10℃", "15℃", "22℃", "30℃ 在這個溫度的麵糊所烤出來的蛋糕，體積最大，內部組織細膩"], "answer": 3, "note": "", "explanation": "麵糊類蛋糕的麵糊溫度以 22℃最佳，體積最大、組織細膩。", "image": ""}, {"id": "03-113", "section": "03", "sectionName": "產品製作", "no": 113, "question": "下列何種蛋糕在烘焙時不可擦防粘油脂？", "options": ["海綿蛋糕", "重奶油蛋糕", "輕奶油蛋糕", "天使蛋糕"], "answer": 4, "note": "", "explanation": "天使蛋糕烤盤不可擦油，否則蛋白泡沫消失；其他蛋糕可擦防粘油脂。", "image": ""}, {"id": "03-114", "section": "03", "sectionName": "產品製作", "no": 114, "question": "理想的海綿蛋糕麵糊比重為", "options": ["0.46", "0.56", "0.66", "0.76 左右"], "answer": 1, "note": "", "explanation": "理想的海綿蛋糕麵糊比重約 0.46。", "image": ""}, {"id": "03-115", "section": "03", "sectionName": "產品製作", "no": 115, "question": "利用糖油拌合法製作丹麥小西餅(Danish cookies)，材料中的麵粉應在最後加入，輕輕拌勻，其主要的原因為？", "options": ["容易吸收水分", "好控制麵粉量", "避免攪拌出筋", "防止破壞打發的氣泡"], "answer": 3, "note": "", "explanation": "糖油拌合法做丹麥小西餅，麵粉最後輕輕拌勻，目的是避免攪拌出筋。", "image": ""}, {"id": "03-116", "section": "03", "sectionName": "產品製作", "no": 116, "question": "菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其原因為？", "options": ["不需最後發酵", "需較高濕度發酵", "需較高溫度發酵", "避免高濕高溫的發酵使菠蘿皮融解而化開"], "answer": 4, "note": "", "explanation": "菠蘿甜麵包整形後放室內，是避免高濕高溫的發酵使菠蘿皮融化。", "image": ""}, {"id": "03-117", "section": "03", "sectionName": "產品製作", "no": 117, "question": "50～100 公克左右的甜麵包，其烤焙應？", "options": ["上火為主，下火為輔", "只用上火", "下火為主，上火為輔", "只用下火"], "answer": 1, "note": "", "explanation": "50～100 公克的甜麵包，烤焙以上火為主，下火為輔，使表面上色良好、底部不焦。", "image": ""}, {"id": "03-118", "section": "03", "sectionName": "產品製作", "no": 118, "question": "以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？", "options": ["硬", "粗糙", "細膩", "沒影響"], "answer": 2, "note": "", "explanation": "糖油打發過度，空氣過多，產品組織較粗糙。", "image": ""}, {"id": "03-119", "section": "03", "sectionName": "產品製作", "no": 119, "question": "戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？", "options": ["組織較軟", "拌入其他材料時易消泡", "體積較大", "不影響蛋糕品質"], "answer": 2, "note": "", "explanation": "戚風蛋糕蛋白與糖攪拌不足，蛋白泡沫不穩定，拌入其他材料時容易消泡。", "image": ""}, {"id": "03-120", "section": "03", "sectionName": "產品製作", "no": 120, "question": "可以減少海綿蛋糕出爐時收縮的程度為？", "options": ["選用麵筋較強的麵粉", "烤焙時間避免過久", "烤盤擦油", "減少配方中的用油量"], "answer": 2, "note": "", "explanation": "烤焙時間不要過久，海綿蛋糕出爐收縮的程度就會減少。", "image": ""}, {"id": "03-121", "section": "03", "sectionName": "產品製作", "no": 121, "question": "添加下列那一項材料不會增加蛋糕的柔軟度？", "options": ["糖", "油", "蛋黃", "麵粉"], "answer": 4, "note": "", "explanation": "糖、油、蛋黃都能使蛋糕柔軟；麵粉增加會使蛋糕變硬。", "image": ""}, {"id": "03-122", "section": "03", "sectionName": "產品製作", "no": 122, "question": "一般麵糊類蛋糕烤熟與否的判斷方法？", "options": ["以探針試探或以手輕拍", "以顏色判斷即可", "時間一到即可出爐", "敲烤盤邊聽聲音判斷"], "answer": 1, "note": "", "explanation": "麵糊類蛋糕烤熟與否，可用探針試探或用手輕拍表面判斷。", "image": ""}, {"id": "03-123", "section": "03", "sectionName": "產品製作", "no": 123, "question": "切割蛋糕用的刀子，下列那一種方式既可防止細菌污染又可達到切面整齊的要求？", "options": ["洗淨使用", "以布擦拭後使用", "浸在沸水中燙一次，切一次", "在沸水中燙一次用布擦一下使用"], "answer": 3, "note": "", "explanation": "切蛋糕的刀浸在沸水中燙一次、切一次，既可殺菌，又能使切面整齊。", "image": ""}, {"id": "03-124", "section": "03", "sectionName": "產品製作", "no": 124, "question": "煮製檸檬布丁餡時檸檬汁在？", "options": ["與水一道加入", "與玉米澱粉拌勻加入", "糖水部分煮沸後加入", "待餡煮好後加入拌勻"], "answer": 4, "note": "", "explanation": "檸檬汁是酸，會破壞澱粉的黏稠度，所以要等餡煮好後再加入拌勻。", "image": ""}, {"id": "03-125", "section": "03", "sectionName": "產品製作", "no": 125, "question": "製作丹麥麵包整形宜在？", "options": ["近烤爐邊", "一般的工作間", "在溫度較低的場所", "與溫度無關，在那裡整形皆可"], "answer": 3, "note": "", "explanation": "製作丹麥麵包的整形要在溫度較低的場所進行，避免裹入油脂融化。", "image": ""}, {"id": "03-126", "section": "03", "sectionName": "產品製作", "no": 126, "question": "麵粉的 pH 值變小時，小西餅的體積", "options": ["不變", "變大", "變小", "變厚"], "answer": 3, "note": "", "explanation": "麵粉的 pH 值變小（偏酸）時，小西餅的體積變小。", "image": ""}, {"id": "03-127", "section": "03", "sectionName": "產品製作", "no": 127, "question": "餅乾用麵粉，若酸度偏高時，配方中應提高？", "options": ["小蘇打", "水", "氧化劑", "油脂 的用量"], "answer": 1, "note": "", "explanation": "餅乾用麵粉酸度偏高時，可增加小蘇打用量，中和酸度。", "image": ""}, {"id": "03-128", "section": "03", "sectionName": "產品製作", "no": 128, "question": "蘇打餅乾成品的 pH 值比一般奶油小西餅為？", "options": ["高", "相同", "低", "測不出來"], "answer": 1, "note": "", "explanation": "蘇打餅乾用小蘇打，pH 值比一般奶油小西餅高。", "image": ""}, {"id": "03-129", "section": "03", "sectionName": "產品製作", "no": 129, "question": "下列那種因素不會影響麵包攪拌時間？", "options": ["攪拌速度不同", "配方不同", "攪拌機型式不同", "攪拌人員不同"], "answer": 4, "note": "", "explanation": "攪拌人員不同不會影響麵包攪拌時間；攪拌速度、配方、機型會影響。", "image": ""}, {"id": "03-130", "section": "03", "sectionName": "產品製作", "no": 130, "question": "正常情況下，甜麵包麵糰之攪拌時間，應比白土司麵包？", "options": ["長", "短", "一樣", "不受限制"], "answer": 1, "note": "", "explanation": "甜麵包糖油多，麵筋較不易形成，所以攪拌時間比白土司長。", "image": ""}, {"id": "03-131", "section": "03", "sectionName": "產品製作", "no": 131, "question": "麵糰整型時，如經過二道滾輪之整型機，正常第一道滾輪與第二道滾輪之間隙比為？", "options": ["6:1", "4:1", "2:1", "1:1"], "answer": 3, "note": "", "explanation": "二道滾輪整型機，第一道與第二道滾輪間隙比約 2：1。", "image": ""}, {"id": "03-132", "section": "03", "sectionName": "產品製作", "no": 132, "question": "下列那一項因素不會影響麵包之基本發酵時間？", "options": ["酵母量", "鹽", "麵糰溫度", "容器"], "answer": 4, "note": "", "explanation": "基本發酵時間受酵母量、鹽、麵糰溫度影響，容器不會影響。", "image": ""}, {"id": "03-133", "section": "03", "sectionName": "產品製作", "no": 133, "question": "下列何者不是影響烘焙食品烤焙條件設定之因素？", "options": ["產品種類", "產品大小", "烤爐種類", "烤焙人員"], "answer": 4, "note": "", "explanation": "烤焙條件受產品種類、大小、烤爐種類影響，與烤焙人員無關。", "image": ""}, {"id": "03-134", "section": "03", "sectionName": "產品製作", "no": 134, "question": "製作組織鬆軟體積較大的奶油蛋糕通常採用？", "options": ["糖油拌合法", "麵粉油脂拌合法", "直接拌合法", "糖水拌合法"], "answer": 1, "note": "", "explanation": "要做組織鬆軟、體積大的奶油蛋糕，通常採用糖油拌合法。", "image": ""}, {"id": "03-135", "section": "03", "sectionName": "產品製作", "no": 135, "question": "以攪拌機攪拌麵糊類蛋糕，下列那一項操作較為正確？", "options": ["自始至終一貫快速拌成", "隨時提升攪拌缸以利拌勻", "忽快忽慢促進麵筋形成", "先用慢速拌合材料，再以快速攪拌，中途停機刮勻缸底麵糊後再繼續攪拌"], "answer": 4, "note": "", "explanation": "攪拌麵糊類蛋糕：先用慢速拌合，再轉快速攪拌，中途停機刮缸底再繼續。", "image": ""}, {"id": "03-136", "section": "03", "sectionName": "產品製作", "no": 136, "question": "為促進蛋白的起泡性並改善蛋糕的風味可在配方中酌加？", "options": ["麩胺酸鈉", "檸檬汁", "酒精", "亞硝酸鉀"], "answer": 2, "note": "", "explanation": "蛋白中加檸檬汁，可促進起泡性並改善風味。", "image": ""}, {"id": "03-137", "section": "03", "sectionName": "產品製作", "no": 137, "question": "油炸甜圈餅（道納司，doughnuts）油脂宜選用？", "options": ["沙拉油", "豬油", "油炸油", "奶油"], "answer": 3, "note": "", "explanation": "炸甜甜圈宜用耐高溫的油炸油。", "image": ""}, {"id": "03-138", "section": "03", "sectionName": "產品製作", "no": 138, "question": "製作泡芙（奶油空心餅）時常添加之化學膨大劑為？", "options": ["碳酸氫銨（阿摩尼亞）", "小蘇打", "發粉", "酵母"], "answer": 1, "note": "", "explanation": "泡芙常添加碳酸氫銨（阿摩尼亞）作為化學膨大劑，受熱分解成氣體，使殼更酥鬆。", "image": ""}, {"id": "03-139", "section": "03", "sectionName": "產品製作", "no": 139, "question": "鬆餅（起酥，puff pastry）烤焙時烤爐宜選用？", "options": ["熱風爐", "普通爐", "蒸氣爐", "隧道爐"], "answer": 3, "note": "", "explanation": "鬆餅用蒸氣爐烤焙，可使表皮不過早乾硬，膨脹較佳。", "image": ""}, {"id": "03-140", "section": "03", "sectionName": "產品製作", "no": 140, "question": "派皮堅韌不酥的原因為？", "options": ["派餡裝盤時太熱", "麵糰拌合太久", "烘烤時間不夠", "油脂用量太多"], "answer": 2, "note": "", "explanation": "派皮堅韌不酥，常是麵糰拌合太久，麵筋形成過多。", "image": ""}, {"id": "03-141", "section": "03", "sectionName": "產品製作", "no": 141, "question": "派餡中牛奶布丁過於堅韌其原因為？", "options": ["烘烤時間太久", "派皮太厚", "熬煮膠凝程度不夠", "派餡溫度太低"], "answer": 1, "note": "", "explanation": "牛奶布丁派餡過於堅韌，是因為烘烤時間太久。", "image": ""}, {"id": "03-142", "section": "03", "sectionName": "產品製作", "no": 142, "question": "以直接法製作鹹餅乾，麵糰發酵的溫度以下列何者為宜？", "options": ["32℃", "42℃", "52℃", "62℃"], "answer": 1, "note": "", "explanation": "鹹餅乾直接法發酵溫度約 32℃。", "image": ""}, {"id": "03-143", "section": "03", "sectionName": "產品製作", "no": 143, "question": "麵包製作時翻麵的目的，以下何者為非？", "options": ["平均溫度", "促進發酵", "抑制發酵", "促進氣體保留"], "answer": 3, "note": "", "explanation": "翻麵是為了平均溫度、促進發酵與氣體保留，不是抑制發酵。", "image": ""}, {"id": "03-144", "section": "03", "sectionName": "產品製作", "no": 144, "question": "麵包直接法配方中，已知水用量為 360g，理想水溫為 5℃，自來水溫為 20℃，該日室溫為 28℃，冰用量為？", "options": ["40g", "54g", "80g", "100g"], "answer": 2, "note": "", "explanation": "冰用量＝ 水量 ×（自來水溫 － 理想水溫）÷（80 ＋ 自來水溫）＝ 360 ×（20－5）÷ 100 ＝ 54 g。", "image": ""}, {"id": "03-145", "section": "03", "sectionName": "產品製作", "no": 145, "question": "製作蛋糕使用未經鹼處理過的可可粉時，應以部分小蘇打代替發粉，其用量為可可粉用量之", "options": ["2％", "7％", "10％", "15％"], "answer": 2, "note": "", "explanation": "未經鹼處理的可可粉偏酸，要以部分小蘇打取代發粉，用量約為可可粉的 7％。", "image": ""}, {"id": "03-146", "section": "03", "sectionName": "產品製作", "no": 146, "question": "一般蒸烤牛奶布丁，所選用之凝凍材料為？", "options": ["雞蛋", "吉利丁", "玉米粉", "麵粉"], "answer": 1, "note": "", "explanation": "蒸烤牛奶布丁以雞蛋作為凝凍材料。", "image": ""}, {"id": "03-147", "section": "03", "sectionName": "產品製作", "no": 147, "question": "烤焙不帶蓋土司若烤焙時間相同，烤爐溫度太高會造成", "options": ["體積大", "表皮顏色深", "烘焙損耗小", "表皮顏色淺"], "answer": 2, "note": "", "explanation": "不帶蓋土司，爐溫太高，表皮顏色會較深。", "image": ""}, {"id": "03-148", "section": "03", "sectionName": "產品製作", "no": 148, "question": "烤焙甜麵包時，若烤焙時間相同烤爐溫度太低會造成", "options": ["體積不變", "底部顏色深", "表皮顏色淺", "組織細緻"], "answer": 3, "note": "", "explanation": "烤甜麵包爐溫太低，表皮顏色會較淺。", "image": ""}, {"id": "03-149", "section": "03", "sectionName": "產品製作", "no": 149, "question": "攪拌中種麵糰時為控制理想溫度為 25℃，下列何者為宜？", "options": ["攪拌時間延長", "水溫提高", "依室溫及攪拌設備，控制材料溫度及攪拌時間", "用高速攪拌"], "answer": 3, "note": "", "explanation": "要使中種麵糰溫度達 25℃，要依室溫與攪拌設備，控制材料溫度與攪拌時間。", "image": ""}, {"id": "03-150", "section": "03", "sectionName": "產品製作", "no": 150, "question": "製作天使蛋糕擬降低蛋白之韌性可增加", "options": ["蛋白量", "麵粉量", "糖量", "鹽量"], "answer": 3, "note": "", "explanation": "增加糖量可使蛋白變軟、降低韌性，使天使蛋糕更細緻。", "image": ""}, {"id": "03-151", "section": "03", "sectionName": "產品製作", "no": 151, "question": "為改善麵粉中澱粉之膠體性質及改良麵包之內部組織，一般可加入？", "options": ["纖維分解酵素", "脂肪分解酵素", "蛋白質分解酵素", "液化酵素"], "answer": 4, "note": "", "explanation": "液化酵素（α-澱粉酶）能改善澱粉膠體性質，改良麵包內部組織。", "image": ""}, {"id": "03-152", "section": "03", "sectionName": "產品製作", "no": 152, "question": "一般攪拌好之麵糰 pH 值約為 6.0，發酵後之麵糰 pH 值會？", "options": ["下降", "上升", "不改變", "先上升再下降"], "answer": 1, "note": "", "explanation": "發酵後產生有機酸，麵糰 pH 值會下降。", "image": ""}, {"id": "03-153", "section": "03", "sectionName": "產品製作", "no": 153, "question": "下列何者，不是造成發酵後之麵糰 pH 值會下降的原因？", "options": ["麵糰內之乳酸菌，於發酵時產生乳酸", "麵糰內之醋酸菌，於發酵時產生醋酸", "硫酸氨改良劑經酵母代謝作用而產生硫酸", "麵糰中加乳化劑"], "answer": 4, "note": "", "explanation": "乳化劑不會使麵糰 pH 值下降；乳酸、醋酸、硫酸等才會。", "image": ""}, {"id": "03-154", "section": "03", "sectionName": "產品製作", "no": 154, "question": "餅乾在連續式隧道爐烤焙，若將烤爐分成四區時，餅體組織的固定是在？", "options": ["第一區", "第二區", "第三區", "第四區"], "answer": 3, "note": "", "explanation": "餅乾在隧道爐中，組織固定發生在第三區。", "image": ""}, {"id": "03-155", "section": "03", "sectionName": "產品製作", "no": 155, "question": "餅乾麵糰在烤焙過程中，物性改變且遞減的是？", "options": ["水分", "顏色", "厚度", "膨脹度"], "answer": 1, "note": "", "explanation": "烤焙過程中，餅乾的水分逐漸減少（遞減）；顏色、厚度、膨脹度則先增加或變深。", "image": ""}, {"id": "03-156", "section": "03", "sectionName": "產品製作", "no": 156, "question": "餅乾麵糰在壓延成型時，打孔洞的原因，下列何者敘述錯誤？", "options": ["有表面裝飾之作用", "減少原料用量、降低成本", "切斷麵糰筋性、防止緊縮作用", "水分變成水蒸氣，有孔洞時可保持較均勻的膨脹度"], "answer": 2, "note": "", "explanation": "壓延成型時打孔，是為裝飾、切斷筋性、防止緊縮、讓水蒸氣排出；並非為了降低成本。", "image": ""}, {"id": "03-157", "section": "03", "sectionName": "產品製作", "no": 157, "question": "解決硬質餅乾或蘇打餅乾在成型時麵片收縮的方法為何？", "options": ["表面噴水", "麵片作打浪狀", "撒麵粉", "重新混合製作"], "answer": 2, "note": "", "explanation": "硬質餅乾或蘇打餅乾麵片收縮時，可將麵片作成打浪狀，減少收縮。", "image": ""}, {"id": "03-158", "section": "03", "sectionName": "產品製作", "no": 158, "question": "製造調味餅乾在表面加入調味粉最適當之時機為？", "options": ["餅片成型後、入烤爐前", "出烤爐噴油後", "在烤焙時", "進包裝機前"], "answer": 2, "note": "", "explanation": "調味餅乾要在出爐後趁熱噴油，再撒上調味粉，使調味料附著。", "image": ""}, {"id": "03-159", "section": "03", "sectionName": "產品製作", "no": 159, "question": "下列何種產品的生麵片經成型、烤焙後的收縮率最大？", "options": ["蘇打餅乾", "瑪莉餅乾", "冰箱小西餅", "乳沫類小西餅"], "answer": 1, "note": "", "explanation": "蘇打餅乾的麵筋多，烤焙後收縮率最大。", "image": ""}, {"id": "03-160", "section": "03", "sectionName": "產品製作", "no": 160, "question": "下列何種產品在攪拌過程中，麵糰的溫度最高？", "options": ["蘇打餅乾", "瑪莉餅乾", "冰箱小西餅", "乳沫類小西餅"], "answer": 2, "note": "", "explanation": "瑪琍餅乾含糖油較多，攪拌過程中麵糰溫度最高。", "image": ""}, {"id": "03-161", "section": "03", "sectionName": "產品製作", "no": 161, "question": "烤焙巧克力小西餅時，判斷烤熟程度之最佳之方式為何？", "options": ["依烤焙時間決定", "依顏色判斷", "依烤焙時間及用手觸摸", "依產品冒煙程度判斷"], "answer": 3, "note": "", "explanation": "烤巧克力小西餅不易以顏色判斷，要依烤焙時間並用手觸摸判斷熟度。", "image": ""}, {"id": "03-162", "section": "03", "sectionName": "產品製作", "no": 162, "question": "製造小西餅麵糰較為乾硬時，成品的質地是？", "options": ["酥鬆", "鬆軟", "酥脆", "硬脆"], "answer": 4, "note": "", "explanation": "麵糰較乾硬的小西餅，成品質地硬脆。", "image": ""}, {"id": "03-163", "section": "03", "sectionName": "產品製作", "no": 163, "question": "造成小西餅裂痕特性的原料是？", "options": ["葡萄糖漿", "糖粉", "砂糖", "焦糖"], "answer": 3, "note": "", "explanation": "砂糖顆粒粗，在烤焙時局部溶化，形成裂痕。", "image": ""}, {"id": "03-164", "section": "03", "sectionName": "產品製作", "no": 164, "question": "下列成品何者含水量最少?", "options": ["白土司", "重奶油蛋糕", "海綿小西餅", "椰子餅乾"], "answer": 4, "note": "", "explanation": "椰子餅乾水分最少，其次才是其他。", "image": ""}, {"id": "03-165", "section": "03", "sectionName": "產品製作", "no": 165, "question": "下列餅乾配方原料含量，何者口感最鬆酥？", "options": ["糖＞油>水", "糖≒油＞水", "油>糖>水", "水＞35%"], "answer": 3, "note": "", "explanation": "油量多於糖與水時，餅乾口感最鬆酥。", "image": ""}, {"id": "03-166", "section": "03", "sectionName": "產品製作", "no": 166, "question": "想保持丹麥小西餅有明顯花紋，下列何者不正確?", "options": ["使用高筋麵粉取代低筋麵粉", "糖油攪拌時充分打發", "可使用直接法攪拌", "使用上火大烤焙"], "answer": 2, "note": "", "explanation": "要保持丹麥小西餅明顯花紋，糖油不應打發太過，所以「糖油充分打發」是不正確的。", "image": ""}, {"id": "03-167", "section": "03", "sectionName": "產品製作", "no": 167, "question": "下列何者是造成奶油布丁餡結粒的原因？", "options": ["配方中牛奶量太多", "煮時爐火太小", "煮時攪拌太慢", "快速冷卻"], "answer": 3, "note": "", "explanation": "煮奶油布丁餡時攪拌太慢，粉類容易結粒。", "image": ""}, {"id": "03-168", "section": "03", "sectionName": "產品製作", "no": 168, "question": "下列何者不是造成蒸烤雞蛋布丁脫模崩塌的原因？", "options": ["凝膠材料不足", "下火太小", "蒸烤時間不足", "未冷卻就脫模"], "answer": 4, "note": "", "explanation": "蒸烤布丁脫模崩塌，常因凝膠材料（蛋）不足、下火太小使底部未凝固、蒸烤時間不足。題庫答案為④「未冷卻就脫模」不是原因；但實務上太熱脫模也可能使布丁變形，考試以題庫答案為準。", "image": ""}, {"id": "03-169", "section": "03", "sectionName": "產品製作", "no": 169, "question": "製作布丁餡甜麵包的布丁餡，那一項不是以零分計？", "options": ["布丁餡不凝固", "布丁餡凝固且光滑", "布丁餡有焦黑顆粒或結顆粒", "布丁餡堅硬如羊羹"], "answer": 2, "note": "", "explanation": "布丁餡凝固且光滑是良好的，不扣分；不凝固、有焦黑或結顆粒、堅硬如羊羹都以零分計。", "image": ""}, {"id": "03-170", "section": "03", "sectionName": "產品製作", "no": 170, "question": "製作布丁餡甜麵包，成品直徑 9.5 公分（含）以上，高度 5 公分（含）以上，下列何者不是「不良品」？", "options": ["高度 4 公分", "成品直徑 8 公分", "高度 4.5 公分", "成品直徑 10 公分"], "answer": 4, "note": "", "explanation": "成品直徑要 9.5 公分以上、高度 5 公分以上；直徑 10 公分符合標準，所以不是不良品。", "image": ""}, {"id": "03-171", "section": "03", "sectionName": "產品製作", "no": 171, "question": "全素業者製作布丁餡時，那一項不是選用的材料？", "options": ["豆漿", "牛奶", "馬鈴薯澱粉", "椰漿"], "answer": 2, "note": "", "explanation": "全素業者的布丁餡用豆漿、植物澱粉、椰漿，不能用牛奶。", "image": ""}, {"id": "03-172", "section": "03", "sectionName": "產品製作", "no": 172, "question": "全素業者製作布丁餡甜麵包時，添加油脂會選用", "options": ["奶油", "人造奶油", "全素用烤酥油", "烤酥油"], "answer": 3, "note": "", "explanation": "全素業者製作布丁餡甜麵包要用全素用烤酥油（植物性）。", "image": ""}, {"id": "03-173", "section": "03", "sectionName": "產品製作", "no": 173, "question": "全素業者製作圓形貓舌小西餅時，那一項不是選用的材料？", "options": ["糖", "油脂", "鷹嘴豆汁液", "蛋白"], "answer": 4, "note": "", "explanation": "全素貓舌小西餅不能使用蛋白，改用鷹嘴豆汁液代替。", "image": ""}, {"id": "03-174", "section": "03", "sectionName": "產品製作", "no": 174, "question": "製作圓形貓舌小西餅時，那一項不是以不良品計？", "options": ["成品不呈平整", "成品不呈圓片狀", "成品質地硬脆", "成品週邊無擴展成尖薄狀"], "answer": 3, "note": "", "explanation": "貓舌小西餅應平整、圓片狀、邊緣擴展成尖薄狀；質地硬脆是正常的，不算不良品。", "image": ""}, {"id": "03-175", "section": "03", "sectionName": "產品製作", "no": 175, "question": "全素業者製作圓形貓舌小西餅時，那一項材料選用來代替蛋白？", "options": ["乳清", "鷹嘴豆汁液", "乳化劑", "全脂牛奶"], "answer": 2, "note": "", "explanation": "全素貓舌小西餅用鷹嘴豆汁液取代蛋白。", "image": ""}, {"id": "03-176", "section": "03", "sectionName": "產品製作", "no": 176, "question": "全素業者製作葡萄乾燕麥紅糖小西餅時，那一項不是選用的材料？", "options": ["燕麥片", "豆漿粉", "奶粉", "鷹嘴豆汁液"], "answer": 3, "note": "", "explanation": "全素的葡萄乾燕麥紅糖小西餅不能用奶粉。", "image": ""}, {"id": "03-177", "section": "03", "sectionName": "產品製作", "no": 177, "question": "全素業者製作擠注成型小西餅時，那一項是錯誤？", "options": ["使用鷹嘴豆汁液代替雞蛋", "使用豆漿粉代替奶粉", "成品紋路可以不清晰", "成品質地不可以堅硬"], "answer": 3, "note": "", "explanation": "全素擠注小西餅要紋路清晰，質地可適度，但「成品紋路可以不清晰」是錯誤的。", "image": ""}, {"id": "03-178", "section": "03", "sectionName": "產品製作", "no": 178, "question": "選用那一項材料打發起泡效果最差？", "options": ["鷹嘴豆汁液", "椰子鮮奶油(Coconut Cream)", "乳清", "沙拉油"], "answer": 4, "note": "", "explanation": "沙拉油不具起泡性，打發起泡效果最差；鷹嘴豆汁、椰子鮮奶油、乳清都可打發。", "image": ""}, {"id": "04-1", "section": "04", "sectionName": "品質鑑定", "no": 1, "question": "煮牛奶布丁餡產生結粒原因為", "options": ["爐火太大", "爐火太小", "粉與水拌不均勻", "粉類太少"], "answer": 3, "note  "06-58", "section": "06", "sectionName": "食品之貯存", "no": 58, "question": "對於一般食品工廠作業區之清潔度區分，下列敘述何者正確？", "options": ["即食性成品之內包裝室屬於準清潔作業區", "加工調理場屬於清潔作業區", "即食性成品之冷卻場所屬於準清潔作業區", "外包裝室屬於一般作業區"], "answer": 4, "note": "", "explanation": "", "image": ""}, {"id": "06-59", "section": "06", "sectionName": "食品之貯存", "no": 59, "question": "食物不可暴露在危險溫度帶超過 4 小時，此溫度帶是", "options": ["18~40℃", "60℃以上", "60℃以下", "5~60℃"], "answer": 4, "note": "", "explanation": "", "image": ""}]}, "textbook": {"name": "課本學習評量", "subtitle": "食品微生物學（上）第二章 學習評量選擇題（完整版 · 含 76 題互動圖解）", "secPrefix": "", "marks": ["A", "B", "C", "D", "E"], "data": [{"id": "2-1 學習評量-1", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 1, "question": "下列何者非微生物的生長特徵？", "options": ["菌落顏色", "抗原抗體反應", "生長狀況", "菌體的大小"], "answer": 4, "note": "", "explanation": "菌體的大小屬於「形態特徵」，而非「生長特徵」（生長特徵包括菌落顏色、形狀、生長狀況及抗原抗體反應等）。", "image": ""}, {"id": "2-1 學習評量-2", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 2, "question": "何者為「屬」以下分類的組別？", "options": ["亞屬", "種", "變種", "以上皆是"], "answer": 4, "note": "", "explanation": "生物分類階層由大至小依序為界、門、綱、目、科、屬、種，「屬」以下可再細分為亞屬、種、亞種、變種及菌株等組別。", "image": ""}, {"id": "2-1 學習評量-3", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 3, "question": "伯吉氏細菌分類手冊是屬於何種分類方法？", "options": ["數值分析法", "直覺法", "遺傳統計法", "平均數值法"], "answer": 2, "note": "", "explanation": "《伯吉氏細菌分類手冊》主要依據細菌的形態、染色特性及生理生化反應進行分類，屬於傳統的直覺法（人工分類法）。", "image": ""}, {"id": "2-1 學習評量-4", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 4, "question": "若菌體只知其屬名而不知其種名，則屬名之後以何者表示之？", "options": ["PS.", "sp.", "PP.", "Sb."], "answer": 2, "note": "", "explanation": "sp.（species 的縮寫）用於未知種名時接在屬名之後（若指多個未定種則寫作 spp.）。", "image": ""}, {"id": "2-1 學習評量-5", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 5, "question": "下列關於二名法之表示何者有誤？", "options": ["Saccharomyces cerevisiae（斜體）", "Saccharomyces cerevisiae（加底線）", "Saccharomyces cerevisiae Hansen（斜體加命名者）", "Saccharomyces cerevisiae（正體無底線）"], "answer": 4, "note": "", "explanation": "二名法學名由屬名（首字大寫）與種小名（全小寫）組成，書寫時必須使用「斜體字」或在正體字下方「畫底線」以示區別，(D) 既無斜體也無底線，故有誤。", "image": ""}, {"id": "2-1 學習評量-6", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 6, "question": "革蘭氏陰性菌與陽性菌的分類是屬於何種分類法？", "options": ["數值分析法", "直覺法", "遺傳統計法", "平均數值法"], "answer": 2, "note": "", "explanation": "依據革蘭氏染色反應等少數顯著性狀進行區分的分類方法屬於直覺法。", "image": ""}, {"id": "2-1 學習評量-7", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 7, "question": "下列何者是以鳥糞嘌呤與胞嘧啶的莫耳百分比為分類依據？", "options": ["數值分析法", "直覺法", "遺傳統計法", "平均數值法"], "answer": 3, "note": "", "explanation": "計算 DNA 中鳥糞嘌呤（G）與胞嘧啶（C）所占的莫耳百分比（G+C mol%），是利用遺傳物質組成進行分類的遺傳統計法（分子分類法）。", "image": ""}, {"id": "2-1 學習評量-8", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 8, "question": "何者是分類學的基本類別？", "options": ["屬", "種", "亞種", "株"], "answer": 2, "note": "", "explanation": "「種」（Species）是生物分類學中最基本的分類單位。", "image": ""}, {"id": "2-1 學習評量-9", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 9, "question": "不同來源，但同種的純培養的微生物稱為？", "options": ["屬", "變種", "亞種", "菌株"], "answer": 4, "note": "", "explanation": "同一「種」內，來自不同分離來源或具有細微生理生化差異的純培養微生物稱為「菌株」（Strain）。", "image": ""}, {"id": "2-1 學習評量-10", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 10, "question": "微生物的分類中，每一菌種皆有下列何者作為鑑定相同菌種的標準？", "options": ["典型菌種", "典型菌株", "典型菌屬", "典型菌科"], "answer": 2, "note": "", "explanation": "每一正式發表的細菌新種都必須指定一株「典型菌株」（Type strain）保存於菌種中心，作為命名與鑑定相同菌種的標準。", "image": ""}, {"id": "2-1 學習評量-11", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 11, "question": "下列何種微生物，具有葉綠素，可行光合作用？", "options": ["細菌", "原蟲", "病毒", "藻類"], "answer": 4, "note": "", "explanation": "藻類為真核微生物，細胞內含有葉綠素，可進行光合作用製造養分。", "image": ""}, {"id": "2-1 學習評量-12", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 12, "question": "下列何者不屬於真菌？", "options": ["細菌", "酵母", "黴菌", "蕈類"], "answer": 1, "note": "", "explanation": "細菌屬於原核生物界（不具核膜）；酵母菌、黴菌與蕈類皆屬於真核生物界的真菌。", "image": ""}, {"id": "2-1 學習評量-13", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 13, "question": "何種微生物的形態最小？", "options": ["細菌", "原蟲", "病毒", "藻類"], "answer": 3, "note": "", "explanation": "病毒體積最小（通常以奈米 nm 計量，約 20～300 nm），須借助電子顯微鏡才能觀察。", "image": ""}, {"id": "2-1 學習評量-14", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 14, "question": "與食品工業有關的病毒是？", "options": ["肝炎病毒", "小兒麻痺病毒", "植物病毒", "細菌病毒"], "answer": 4, "note": "", "explanation": "細菌病毒即「噬菌體」（Bacteriophage），在發酵食品工業中若污染發酵菌種（如乳酸菌），會使菌體裂解而導致發酵失敗。", "image": ""}, {"id": "2-1 學習評量-15", "section": "2-1 學習評量", "sectionName": "2-1 學習評量（p.43）", "no": 15, "question": "下列何者不屬於單細胞真核生物？", "options": ["原生動物", "酵母", "黴菌", "單胞藻"], "answer": 3, "note": "", "explanation": "黴菌是由多細胞組成的絲狀真菌，不屬於單細胞生物；原生動物、酵母菌及單胞藻皆為單細胞真核生物。（註：原卷手寫作答為 D，正確學理答案應為 C）", "image": ""}, {"id": "2-2 學習評量-1", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 1, "question": "何種菌屬於革蘭氏陰性好氣性桿菌？", "options": ["大腸桿菌", "沙門氏菌", "乳酸桿菌", "醋酸桿菌"], "answer": 4, "note": "", "explanation": "醋酸桿菌（Acetobacter）屬於革蘭氏陰性好氣性桿菌；大腸桿菌與沙門氏菌屬於革蘭氏陰性兼性厭氣桿菌；乳酸桿菌則為革蘭氏陽性菌。（註：原卷手寫作答為 A，依細菌分類學標準答案為 D）", "image": ""}, {"id": "2-2 學習評量-2", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 2, "question": "何種細菌具有菌絲，外形類似黴菌？", "options": ["沙雷氏菌", "變形菌", "放線菌", "雙叉桿菌"], "answer": 3, "note": "", "explanation": "放線菌（Actinomycetes）為革蘭氏陽性細菌，菌體呈分枝狀菌絲體，外形與黴菌極為相似。", "image": ""}, {"id": "2-2 學習評量-3", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 3, "question": "可直接作為醋酸桿菌發酵產生醋酸的是？", "options": ["澱粉", "糖質", "酒精", "脂肪原料"], "answer": 3, "note": "", "explanation": "醋酸桿菌在好氣條件下能直接將酒精（乙醇）氧化發酵生成醋酸。", "image": ""}, {"id": "2-2 學習評量-4", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 4, "question": "下列何種菌不屬於乳酸菌？", "options": ["Lactobacillus", "Pediococcus", "Leuconostoc", "Salmonella"], "answer": 4, "note": "", "explanation": "Lactobacillus（乳酸桿菌屬）、Pediococcus（片球菌屬）與 Leuconostoc（明串珠菌屬）皆為乳酸菌；Salmonella 為沙門氏菌屬，屬於腸內菌科病原菌。", "image": ""}, {"id": "2-2 學習評量-5", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 5, "question": "何種類的乳酸菌產生的乳酸量較多，屬於同型乳酸發酵菌？", "options": ["L. brevis", "L. mesenteroides", "L. plantarum", "E. coli"], "answer": 3, "note": "", "explanation": "植物乳酸桿菌（Lactobacillus plantarum）屬於同型乳酸發酵菌，發酵糖類主要產生乳酸，產酸量較多；L. brevis 與 Leuconostoc mesenteroides 為異型乳酸發酵菌；E. coli 為大腸桿菌。", "image": ""}, {"id": "2-2 學習評量-6", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 6, "question": "屬於大腸菌群的細菌是？", "options": ["大腸桿菌屬", "腸內桿菌屬", "克雷白氏菌屬", "以上皆是"], "answer": 4, "note": "", "explanation": "大腸菌群（Coliforms）包含大腸桿菌屬（Escherichia）、腸內桿菌屬（Enterobacter）、克雷白氏菌屬（Klebsiella）及檸檬酸桿菌屬（Citrobacter）等。", "image": ""}, {"id": "2-2 學習評量-7", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 7, "question": "何者為食品衛生上重要的指標菌？", "options": ["肉毒桿菌", "金黃色葡萄球菌", "沙門氏菌", "大腸桿菌"], "answer": 4, "note": "", "explanation": "大腸桿菌及大腸桿菌群常作為評估食品是否受到糞便污染及衛生品質良窳的重要指標菌；其餘三者為常見食品中毒病原菌。", "image": ""}, {"id": "2-2 學習評量-8", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 8, "question": "用來製造納豆的主要菌種為？", "options": ["Bacillus cereus", "Bacillus subtilis natto", "Lactobacillus brevis", "Escherichia coli"], "answer": 2, "note": "", "explanation": "納豆是利用納豆菌（枯草桿菌納豆亞種，Bacillus subtilis natto）發酵蒸煮黃豆製成。", "image": ""}, {"id": "2-2 學習評量-9", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 9, "question": "細菌通常以 μ 為大小表示單位，1 μ 等於多少 mm？", "options": ["1/100", "1/1000", "1/10000", "1/10"], "answer": 2, "note": "", "explanation": "1 微米（1 μm，舊稱 1 μ）為 10⁻⁶ 公尺，等於 1/1000 毫米（mm）。", "image": ""}, {"id": "2-2 學習評量-10", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 10, "question": "細菌中以何者最易產生孢子？", "options": ["球菌", "螺旋菌", "弧菌", "桿菌"], "answer": 4, "note": "", "explanation": "能產生內生孢子（Endospore）的細菌主要集中在桿菌，如好氣性的芽孢桿菌屬（Bacillus）與厭氣性的梭狀芽孢桿菌屬（Clostridium）。", "image": ""}, {"id": "2-2 學習評量-11", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 11, "question": "革蘭氏陽性菌與革蘭氏陰性菌其最大的結構差異在於？", "options": ["細胞質", "細胞壁", "細胞核", "細胞膜"], "answer": 2, "note": "", "explanation": "革蘭氏陽性菌細胞壁肽聚醣層厚且含胞壁酸；革蘭氏陰性菌細胞壁肽聚醣層薄且外層具有脂多醣外膜，兩者最大差異在於細胞壁構造。", "image": ""}, {"id": "2-2 學習評量-12", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 12, "question": "何者為細胞壁外的構造？", "options": ["羧基體", "核糖體", "包涵體", "黏質包被物"], "answer": 4, "note": "", "explanation": "黏質包被物（Glycocalyx，包括莢膜與黏液層）覆蓋於細胞壁最外層；羧基體、核糖體與包涵體皆位於細胞質內部。", "image": ""}, {"id": "2-2 學習評量-13", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 13, "question": "何種構造不具有保護作用？", "options": ["細胞壁", "顆粒體", "莢膜", "內孢子外皮"], "answer": 2, "note": "", "explanation": "顆粒體（如異染粒、肝醣粒等細胞內儲藏顆粒）主要功能是儲存養分或代謝產物，不具保護菌體的作用。", "image": ""}, {"id": "2-2 學習評量-14", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 14, "question": "能參與細菌有性生殖的纖毛為？", "options": ["體纖毛", "周毛", "F-纖毛", "叢毛"], "answer": 3, "note": "", "explanation": "F-纖毛（性纖毛，Sex pili / F-pili）能連接兩細菌並作為接合作用（Conjugation）傳遞遺傳物質（如質體）的通道。", "image": ""}, {"id": "2-2 學習評量-15", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 15, "question": "當環境改變，於細菌體內所形成的休眠個體稱為？", "options": ["內生孢子", "節孢子", "囊孢子", "分生孢子"], "answer": 1, "note": "", "explanation": "細菌在營養缺乏或環境惡劣時，於細胞內部形成抗逆性極強的休眠體，稱為內生孢子（Endospore）。", "image": ""}, {"id": "2-2 學習評量-16", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 16, "question": "細菌內生孢子組成份中，與其耐熱性有關者為？", "options": ["蛋白質", "吡啶二羧酸", "丙烯二羧酸", "核苷酸"], "answer": 2, "note": "", "explanation": "內生孢子含有大量吡啶二羧酸（Dipicolinic acid, DPA），其與鈣離子結合形成吡啶二羧酸鈣，可穩定核酸與蛋白質結構，賦予孢子極高的耐熱性。", "image": ""}, {"id": "2-2 學習評量-17", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 17, "question": "何者非細菌的基本形態？", "options": ["球狀", "圓柱狀", "螺旋狀", "三角狀"], "answer": 4, "note": "", "explanation": "細菌的三種基本形態為球狀（球菌）、圓柱狀/桿狀（桿菌）及螺旋狀（螺旋菌）。", "image": ""}, {"id": "2-2 學習評量-18", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 18, "question": "當細菌進行雙向分裂後，常排列形成？", "options": ["雙球菌", "鏈球菌", "四聯球菌", "八聯球菌"], "answer": 3, "note": "", "explanation": "球菌沿兩個互相垂直的平面進行分裂（雙向分裂），分裂後四個細胞相連排列成四聯球菌（Tetrad）。", "image": ""}, {"id": "2-2 學習評量-19", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 19, "question": "行三向分裂的球菌，若以不規則的形式排列，聚集成簇，常形成？", "options": ["四聯球菌", "鏈球菌", "葡萄球菌", "雙球菌"], "answer": 3, "note": "", "explanation": "球菌沿三個平面不規則分裂並聚集成葡萄串狀，稱為葡萄球菌（Staphylococcus）；若規則分裂成立方體則為八聯球菌。", "image": ""}, {"id": "2-2 學習評量-20", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 20, "question": "桿菌中長度與寬度相似者稱為？", "options": ["長桿菌", "短桿菌", "中桿菌", "圓桿菌"], "answer": 2, "note": "", "explanation": "短桿菌（又稱球桿菌）的菌體長度與寬度相近，外觀介於球菌與典型桿菌之間。", "image": ""}, {"id": "2-2 學習評量-21", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 21, "question": "螺旋菌中，外型呈現彎曲形的細胞，形如逗點狀者稱為？", "options": ["螺旋菌", "螺旋體", "弧菌", "旋菌"], "answer": 3, "note": "", "explanation": "弧菌（Vibrio）菌體僅微彎成弧形或逗點狀（彎曲度不滿一圈螺旋）。", "image": ""}, {"id": "2-2 學習評量-22", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 22, "question": "續上題，螺旋菌中，具有堅硬的個體，菌體長而不易彎曲者稱為？", "options": ["螺旋菌", "螺旋體", "弧菌", "旋菌"], "answer": 1, "note": "", "explanation": "螺旋菌（Spirillum）菌體呈螺旋狀、細胞壁較堅硬而不易彎曲，且多具外部鞭毛。", "image": ""}, {"id": "2-2 學習評量-23", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 23, "question": "續上題，螺旋菌中菌體柔軟易彎不具有鞭毛者為？", "options": ["螺旋菌", "螺旋體", "弧菌", "旋菌"], "answer": 2, "note": "", "explanation": "螺旋體（Spirochete）菌體細長柔軟可彎曲，無外部鞭毛，依靠細胞壁與細胞膜之間的軸絲（內鞭毛）旋轉運動。", "image": ""}, {"id": "2-2 學習評量-24", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 24, "question": "細菌的異常形態，最不易於下列何種情況下出現？", "options": ["環境變異", "菌體老化", "營養豐富", "極度生長條件"], "answer": 3, "note": "", "explanation": "在營養豐富且條件適宜的環境下，細菌能維持正常形態；當環境變異、菌體老化或處於極端條件時才易出現異常形態（退化型）。", "image": ""}, {"id": "2-2 學習評量-25", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 25, "question": "關於細菌大小的敘述，何者有誤？", "options": ["計量以微米為單位", "球菌以直徑表示", "桿菌以寬度 × 長度表示", "螺旋菌的長度以真正長度計量"], "answer": 4, "note": "", "explanation": "螺旋菌菌體呈螺旋彎曲，測量時通常不計其展開的實際總長（真正長度），而是測量螺旋兩端之間的直線距離。", "image": ""}, {"id": "2-2 學習評量-26", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 26, "question": "何者非細菌細胞壁功能？", "options": ["維持細胞形態", "避免細胞膨脹、破裂", "完成分裂生殖", "產生能量場所"], "answer": 4, "note": "", "explanation": "細菌產生能量（ATP）的場所是「細胞膜」（呼吸鏈酵素所在），而非細胞壁。", "image": ""}, {"id": "2-2 學習評量-27", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 27, "question": "細菌細胞壁的主要成份？", "options": ["葡萄聚糖", "去氧核糖", "戊聚糖", "胜肽聚醣"], "answer": 4, "note": "", "explanation": "真細菌細胞壁的主要結構成分為胜肽聚醣（Peptidoglycan，又稱肽聚醣）。", "image": ""}, {"id": "2-2 學習評量-28", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 28, "question": "下列敘述何者為非？", "options": ["革蘭氏陽性菌細胞壁脂質含量極少，陰性菌則含大量脂質", "陽性菌細胞壁構造較簡單，陰性菌則較複雜", "胞壁酸為陰性菌特有的構造", "陽性菌細胞壁較陰性菌厚"], "answer": 3, "note": "", "explanation": "胞壁酸（Teichoic acid，又稱磷壁酸）為「革蘭氏陽性菌」細胞壁特有的構造，陰性菌不含胞壁酸。", "image": ""}, {"id": "2-2 學習評量-29", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 29, "question": "控制養分及廢棄物進出細胞的雙層膜構造為？", "options": ["粒線體", "核糖體", "細胞膜", "細胞壁"], "answer": 3, "note": "", "explanation": "細胞膜為磷脂質雙層膜構造，具有選擇通透性，負責控制養分與代謝廢物進出細胞。", "image": ""}, {"id": "2-2 學習評量-30", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 30, "question": "細菌製造 ATP 產生能量的場所為？", "options": ["粒線體", "細胞質", "細胞膜", "細胞壁"], "answer": 3, "note": "", "explanation": "細菌為原核生物，細胞內無粒線體，其電子傳遞鏈與 ATP 合成酵素位於細胞膜上，故細胞膜為製造 ATP 產生能量的場所。", "image": ""}, {"id": "2-2 學習評量-31", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 31, "question": "為黏稠液體，許多化學反應所在的場所是？", "options": ["粒線體", "細胞質", "細胞膜", "細胞壁"], "answer": 2, "note": "", "explanation": "細胞質為膠狀黏稠液體，內含各種酵素、核糖體與代謝物，是細胞內進行許多生物化學反應的主要場所。", "image": ""}, {"id": "2-2 學習評量-32", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 32, "question": "下列敘述何者為非？", "options": ["核糖體為蛋白質合成場所", "老細胞的包涵體較幼小細胞為少", "肝醣粒為細胞儲藏食物場所", "異染粒參與細胞代謝反應"], "answer": 2, "note": "", "explanation": "包涵體是細菌累積儲藏物質或代謝產物的顆粒，隨著菌體生長老化，老細胞累積的包涵體通常較幼小細胞為多。", "image": ""}, {"id": "2-2 學習評量-33", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 33, "question": "細菌因缺乏何種構造，因而稱之為原核生物？", "options": ["核糖體", "RNA", "DNA", "細胞核"], "answer": 4, "note": "", "explanation": "原核生物不具有核膜包圍的成形「細胞核」，其遺傳物質（環狀 DNA）直接位於細胞質的擬核區。", "image": ""}, {"id": "2-2 學習評量-34", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 34, "question": "細胞內何種物質常帶有抗生素基因，可自我複製？", "options": ["核糖體", "質體", "粒線體", "細胞核"], "answer": 2, "note": "", "explanation": "質體（Plasmid）是細菌染色體以外的小型環狀雙股 DNA，能獨立進行自我複製，且常帶有抗生素抗性基因。", "image": ""}, {"id": "2-2 學習評量-35", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 35, "question": "何者非莢膜的功能？", "options": ["吸附", "解毒", "保護", "提供水分", "營養來源"], "answer": 2, "note": "", "explanation": "莢膜具有保護菌體免受白血球吞噬、儲存水分防止乾燥、協助吸附於物體表面，以及在飢餓時作為營養來源等功能，但不具解毒功能。", "image": ""}, {"id": "2-2 學習評量-36", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 36, "question": "鞭毛著生於細胞的何種構造？", "options": ["粒線體", "細胞質", "細胞膜", "細胞壁"], "answer": 2, "note": "", "explanation": "鞭毛的基體（Basal body）貫穿細胞壁與細胞膜，向內著生於細胞質中（題庫標準答案為細胞質）。", "image": ""}, {"id": "2-2 學習評量-37", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 37, "question": "何種細菌最不常見鞭毛構造？", "options": ["球菌", "短桿菌", "螺旋菌", "長桿菌"], "answer": 1, "note": "", "explanation": "大多數球菌不具鞭毛（無運動性），而桿菌與螺旋菌則常具有鞭毛以利運動。", "image": ""}, {"id": "2-2 學習評量-38", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 38, "question": "關於鞭毛與纖毛之敘述何者有誤？", "options": ["鞭毛直徑大於纖毛", "鞭毛的數目較纖毛為多", "纖毛不具運動性", "兩者成份皆為蛋白質"], "answer": 2, "note": "", "explanation": "纖毛（菌毛）短而細，常密布於菌體表面（可達數百根），數目遠多於鞭毛（通常僅 1 至數十根）。", "image": ""}, {"id": "2-2 學習評量-39", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 39, "question": "關於細菌孢子敘述何者有誤？", "options": ["為營養細胞休眠體", "細菌主要的休眠體為分生孢子", "球菌與螺旋菌不會形成孢子", "每個菌體只產生一個孢子"], "answer": 2, "note": "", "explanation": "細菌主要的休眠體為「內生孢子」（Endospore），而「分生孢子」是真菌（如黴菌）產生的無性繁殖孢子。", "image": ""}, {"id": "2-2 學習評量-40", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 40, "question": "何者與孢子的耐熱性有關？", "options": ["吡啶二羧酸", "蛋白質凝固點提高", "形成孢子過程大量脫水", "以上皆是"], "answer": 4, "note": "", "explanation": "內生孢子含有大量吡啶二羧酸鈣、核心高度脫水以及含特殊小分子酸溶性孢子蛋白使蛋白質穩定性與凝固點提高，三者皆使其具備極強耐熱性。", "image": ""}, {"id": "2-2 學習評量-41", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 41, "question": "細菌分類方法很多，目前較為國際廣泛應用者為？", "options": ["伯吉氏系統細菌分類手冊", "克氏細菌分類法", "懷特克氏細菌分類系統", "國際細菌學分類手冊"], "answer": 1, "note": "", "explanation": "《伯吉氏系統細菌分類手冊》（Bergey's Manual of Systematic Bacteriology）是目前國際上細菌分類與鑑定的最權威參考標準。", "image": ""}, {"id": "2-2 學習評量-42", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 42, "question": "下列哪種菌可將酒精氧化，於液體培養時，表面會形成一層被膜？", "options": ["乳酸菌", "大腸菌", "醋酸菌", "酵母菌"], "answer": 3, "note": "", "explanation": "醋酸菌為絕對好氣菌，能將酒精氧化成醋酸，在液體靜置培養時會浮於液面生長並形成一層菌膜（被膜）。", "image": ""}, {"id": "2-2 學習評量-43", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 43, "question": "下列何種乳酸菌產生的乳酸量最多？", "options": ["嗜酸性乳酸菌", "保加利亞乳酸桿菌", "白念珠球菌", "糞鏈球菌"], "answer": 2, "note": "", "explanation": "保加利亞乳酸桿菌（Lactobacillus bulgaricus）為同型乳酸發酵菌，產酸能力極強，產生的乳酸量最多（可達 2% 以上）。", "image": ""}, {"id": "2-2 學習評量-44", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 44, "question": "下列何種乳酸菌為醃漬物後段發酵的主要菌種？", "options": ["植物乳酸菌", "德氏乳酸桿菌", "白念珠球菌", "糞鏈球菌"], "answer": 1, "note": "", "explanation": "植物乳酸桿菌（Lactobacillus plantarum）耐酸性強，是泡菜、酸黃瓜等蔬菜醃漬物後段發酵的主要菌種。", "image": ""}, {"id": "2-2 學習評量-45", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 45, "question": "下列何種乳酸菌能將蔗糖轉變為葡萄糖聚糖，可作為血漿的代用品，常出現於蔬菜發酵初期，屬於異型乳酸發酵乳酸菌？", "options": ["植物乳酸菌", "德氏乳酸桿菌", "白念珠球菌", "糞鏈球菌"], "answer": 3, "note": "", "explanation": "白念珠球菌（即腸膜明串珠菌，Leuconostoc mesenteroides）為異型乳酸發酵菌，常啟動蔬菜發酵初期，並能利用蔗糖合成右旋糖酐（Dextran，一種葡萄糖聚糖），可作為血漿代用品。", "image": ""}, {"id": "2-2 學習評量-46", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 46, "question": "何種乳酸菌於發酵乳中會產生香味物質－雙乙醯？", "options": ["植物乳酸菌", "德氏乳酸桿菌", "嗜熱鏈球菌", "糞鏈球菌"], "answer": 3, "note": "", "explanation": "嗜熱鏈球菌（Streptococcus thermophilus）在發酵乳製品中可代謝產生奶油風味物質「雙乙醯」（Diacetyl）。", "image": ""}, {"id": "2-2 學習評量-47", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 47, "question": "何者為醬油、味噌熟成上重要的菌種？", "options": ["啤酒小球菌", "嗜鹽小球菌", "嗜熱鏈球菌", "糞鏈球菌"], "answer": 2, "note": "", "explanation": "嗜鹽小球菌（Pediococcus halophilus，現分類為 Tetragenococcus halophilus）耐高鹽環境（可耐 15～20% 食鹽），是醬油與味噌發酵熟成過程中產酸與形成風味的關鍵乳酸菌。", "image": ""}, {"id": "2-2 學習評量-48", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 48, "question": "可產生抗生素 subtilin，可用於蛋白酶、澱粉酶、納豆的製造？", "options": ["Bacillus cereus", "Bacillus subtilis natto", "Lactobacillus brevis", "Escherichia coli"], "answer": 2, "note": "", "explanation": "枯草桿菌納豆亞種（Bacillus subtilis natto）具有極強的蛋白酶與澱粉酶分泌能力，用於製造納豆及酵素生產，並能產生抗生素枯草菌素（Subtilin）。", "image": ""}, {"id": "2-2 學習評量-49", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 49, "question": "引起腸胃炎、傷寒、副傷寒或敗血症的微生物？", "options": ["沙門氏桿菌", "葡萄球菌", "枯草桿菌", "肺炎鏈球菌"], "answer": 1, "note": "", "explanation": "沙門氏桿菌（Salmonella）為革蘭氏陰性腸內病原菌，可引起人類腸胃炎（食物中毒）、傷寒、副傷寒及敗血症。", "image": ""}, {"id": "2-2 學習評量-50", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 50, "question": "下列何種微生物不會產生色素？", "options": ["螢光假單胞桿菌", "金黃色葡萄球菌", "枯草桿菌", "黑腐假單胞桿菌"], "answer": 3, "note": "", "explanation": "螢光假單胞桿菌會產生黃綠色螢光色素，金黃色葡萄球菌產生金黃色色素，黑腐假單胞桿菌產生黑色素；枯草桿菌菌落呈灰白或微黃褐色，一般不產生特徵性色素。", "image": ""}, {"id": "2-2 學習評量-51", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 51, "question": "下列何者不是革蘭氏陰性桿菌？", "options": ["螢光假單胞桿菌", "變形桿菌", "芽孢桿菌", "大腸桿菌"], "answer": 3, "note": "", "explanation": "芽孢桿菌（Bacillus）為革蘭氏陽性桿菌；螢光假單胞桿菌、變形桿菌與大腸桿菌皆為革蘭氏陰性桿菌。", "image": ""}, {"id": "2-2 學習評量-52", "section": "2-2 學習評量", "sectionName": "2-2 學習評量（p.66-70）", "no": 52, "question": "下列何種菌屬於絕對厭氧性菌，為耐熱性最強的食物中毒菌，能分泌神經毒？", "options": ["金黃色葡萄球菌", "肉毒桿菌", "枯草桿菌", "釀膿鏈球菌"], "answer": 2, "note": "", "explanation": "肉毒桿菌（Clostridium botulinum）為絕對厭氧性革蘭氏陽性產孢桿菌，其內生孢子耐熱性極強，且在厭氧環境下生長會分泌劇毒的神經毒素（肉毒桿菌毒素）。", "image": ""}, {"id": "2-3 學習評量-1", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 1, "question": "酵母欲完全氧化糖類產生能量應行何種作用？", "options": ["發酵", "呼吸作用", "接合作用", "同化作用"], "answer": 2, "note": "", "explanation": "在好氣條件下，酵母菌透過有氧呼吸作用可將糖類徹底氧化為二氧化碳與水，釋放出大量能量（ATP）；發酵則為不完全氧化。", "image": ""}, {"id": "2-3 學習評量-2", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 2, "question": "何者為學術上的分類？", "options": ["上層酵母", "麵包酵母", "野生酵母", "不完全酵母菌"], "answer": 4, "note": "", "explanation": "學術上依據有性世代（子囊孢子形成與否）將酵母分為產孢子酵母（子囊菌綱）與無孢子酵母（不完全酵母菌，半知菌綱）；其餘三者為應用或來源上的實用分類。", "image": ""}, {"id": "2-3 學習評量-3", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 3, "question": "何者非酵母菌的應用？", "options": ["製作麵包", "產生抗生素", "酒類釀造", "菌體利用"], "answer": 2, "note": "", "explanation": "抗生素主要由黴菌（如青黴菌）或放線菌產生，酵母菌主要應用於麵包膨發、酒類釀造及作為單細胞蛋白質（食用/飼料酵母）的菌體利用。", "image": ""}, {"id": "2-3 學習評量-4", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 4, "question": "液面培養時，若酵母與其子代細胞連結成鏈狀，則其外形常呈現何種形態？", "options": ["圓筒型", "卵形", "似三角錐", "絲狀形"], "answer": 4, "note": "", "explanation": "某些酵母菌行出芽生殖時，芽體不與母細胞分離而相互連接成鏈狀，形成假菌絲（Pseudomycelium），外觀呈現絲狀形。", "image": ""}, {"id": "2-3 學習評量-5", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 5, "question": "啤酒酵母菌外形一般呈現？", "options": ["卵形", "球形", "檸檬形", "絲狀形"], "answer": 1, "note": "", "explanation": "啤酒酵母菌（Saccharomyces cerevisiae）的典型細胞形態為卵形（橢圓形）。", "image": ""}, {"id": "2-3 學習評量-6", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 6, "question": "何者為以菌種來源分類的酵母菌？", "options": ["上層酵母", "麵包酵母", "野生酵母", "不完全酵母菌"], "answer": 3, "note": "", "explanation": "依菌種來源可將酵母分為經過人工篩選馴化的「馴養酵母」（培養酵母）與自然界天然存在的「野生酵母」。", "image": ""}, {"id": "2-3 學習評量-7", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 7, "question": "關於酵母的敘述，何者錯誤？", "options": ["為單細胞真核生物", "主要行出芽生殖", "野生酵母通常較馴化酵母為大", "酵母屬於真菌"], "answer": 3, "note": "", "explanation": "經過人工選育培養的馴化酵母（培養酵母）細胞體積通常較野生酵母為大且發酵力較強。", "image": ""}, {"id": "2-3 學習評量-8", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 8, "question": "酵母細胞構造中與能量合成有關的是？", "options": ["細胞壁", "細胞膜", "粒線體", "核糖體"], "answer": 3, "note": "", "explanation": "酵母為真核生物，細胞內具有粒線體（Mitochondria），是進行三羧酸循環與氧化磷酸化合成能量（ATP）的主要場所。", "image": ""}, {"id": "2-3 學習評量-9", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 9, "question": "下列有關酵母細胞構造敘述何者有誤？", "options": ["細胞壁主要成份為甘露聚糖與葡萄聚糖", "光粒為儲藏食物場所，常見於衰老細胞", "酵母細胞內含數個粒線體", "內質網與蛋白質、肝醣及類固醇合成有關"], "answer": 2, "note": "", "explanation": "光粒（折光性顆粒，Refractile granules）並非儲藏食物的場所（儲藏物質為脂肪粒、肝醣粒與異染粒等）。", "image": ""}, {"id": "2-3 學習評量-10", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 10, "question": "有關酵母的分類，下列何者是以發酵目的命名？", "options": ["紅色酵母", "馴養酵母", "產孢子酵母", "酒精酵母", "底部酵母"], "answer": 4, "note": "", "explanation": "依用途或發酵目的可分為麵包酵母、酒精酵母、啤酒酵母、葡萄酒酵母等；紅色酵母依色素、馴養酵母依來源、產孢子酵母依學術分類、底部酵母依發酵位置。", "image": ""}, {"id": "2-3 學習評量-11", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 11, "question": "下列敘述何者錯誤？", "options": ["上層酵母發酵迅速", "底部酵母發酵緩慢", "上層酵母產生乳狀氣泡，底部成混濁", "底部酵母，集中於液體下半層生長，泡沫呈現透明"], "answer": 3, "note": "", "explanation": "上層酵母發酵劇烈迅速，產生大量二氧化碳氣泡將菌體帶至液面形成濃厚乳狀泡沫層，而液體底部則相對澄清（底部混濁是底部酵母發酵的特徵）。", "image": ""}, {"id": "2-3 學習評量-12", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 12, "question": "酵母的分類中，何種酵母菌因繁殖速度快，常大量培養作為食用或飼料酵母菌體來源？", "options": ["產孢子酵母", "馴養酵母", "野生酵母", "無孢子酵母"], "answer": 4, "note": "", "explanation": "無孢子酵母（如產朊假絲酵母 Candida utilis、熱帶假絲酵母 Candida tropicalis 等）繁殖速度極快且能利用多種碳源，常大量培養作為食用或飼料單細胞蛋白質（SCP）來源。", "image": ""}, {"id": "2-3 學習評量-13", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 13, "question": "從德國啤酒中分離得到的酵母菌，屬於底層發酵酵母菌？", "options": ["啤酒酵母菌", "卡爾酵母菌", "橢圓酵母菌", "路德酵母菌"], "answer": 2, "note": "", "explanation": "卡爾酵母菌（Saccharomyces carlsbergensis，現學名歸入 Saccharomyces pastorianus）最早自丹麥/德國低溫釀造啤酒中分離，是典型的底層（底部）發酵酵母。", "image": ""}, {"id": "2-3 學習評量-14", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 14, "question": "何者非酵母細胞內儲藏食物的場所？", "options": ["光粒", "脂肪粒", "肝醣粒", "蛋白粒"], "answer": 1, "note": "", "explanation": "脂肪粒、肝醣粒與蛋白粒（異染粒）皆為酵母菌細胞內的儲藏物質顆粒，光粒不具儲藏食物功能。", "image": ""}, {"id": "2-3 學習評量-15", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 15, "question": "下列何者非為產膜酵母菌？", "options": ["畢赤酵母菌屬", "漢生氏酵母菌", "杜巴利氏酵母菌屬", "假絲酵母菌屬", "紅色酵母菌"], "answer": 5, "note": "", "explanation": "畢赤酵母屬（Pichia）、漢生氏酵母屬（Hansenula）、杜巴利氏酵母屬（Debaryomyces）與假絲酵母屬（Candida）在液體培養時易於液面形成菌膜（產膜酵母）；紅色酵母菌（Rhodotorula）為好氣性產類胡蘿蔔素酵母，一般歸類於產色酵母而非典型產膜酵母。", "image": ""}, {"id": "2-3 學習評量-16", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 16, "question": "何種酵母菌外形為平滑光澤的黃色菌落，為生產油脂的重要酵母菌？", "options": ["Saccharomyces carlsbergensis", "Candida tropicalis", "Candida utilis", "Rhodotorula glutinis"], "answer": 4, "note": "", "explanation": "黏紅酵母（Rhodotorula glutinis）菌落呈平滑有光澤的黃紅色至橙紅色（含類胡蘿蔔素），細胞內可累積高達乾重 50% 以上的脂質，是生產微生物油脂的重要菌種。", "image": ""}, {"id": "2-3 學習評量-17", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 17, "question": "麵包酵母菌種為？", "options": ["Saccharomyces peka", "Saccharomyces cerevisiae", "Saccharomyces carlsbergensis", "Saccharomyces pasteurianus"], "answer": 2, "note": "", "explanation": "製作麵包所使用的商業酵母菌種為釀酒酵母（Saccharomyces cerevisiae）。", "image": ""}, {"id": "2-3 學習評量-18", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 18, "question": "何種酵母菌能消耗醃漬液中的有機酸，使漬物腐敗？", "options": ["Saccharomyces carlsbergensis", "Saccharomyces cerevisiae", "Pichia membranaefaciens", "Rhodotorula glutinis"], "answer": 3, "note": "", "explanation": "膜醭畢赤酵母（Pichia membranaefaciens）為常見產膜酵母，會在泡菜、醬油等醃漬液表面形成白色菌膜並氧化消耗乳酸等有機酸，導致酸度下降而引起腐敗。", "image": ""}, {"id": "2-3 學習評量-19", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 19, "question": "發酵工業最重要的酵母菌屬？", "options": ["Saccharomyces", "Pichia", "Hanseniaspora", "Saccharomycoides"], "answer": 1, "note": "", "explanation": "酵母菌屬（Saccharomyces，特別是 S. cerevisiae）具有極強的酒精發酵能力，是釀酒、烘焙及生質酒精等發酵工業中最重要的菌屬。", "image": ""}, {"id": "2-3 學習評量-20", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 20, "question": "下列何種酵母菌主要行無性分裂生殖？", "options": ["Saccharomyces", "Schizosaccharomyces", "Pichia", "Rhodotorula"], "answer": 2, "note": "", "explanation": "裂殖酵母屬（Schizosaccharomyces，如粟酒裂殖酵母 S. pombe）不同於一般出芽生殖的酵母，而是像細菌一樣行橫向二分裂（無性分裂生殖）。", "image": ""}, {"id": "2-3 學習評量-21", "section": "2-3 學習評量", "sectionName": "2-3 學習評量（p.86-87）", "no": 21, "question": "馬乳酒中重要的酵母菌？", "options": ["Kluyveromyces marxianus", "Kluyveromyces lactis", "Saccharomyces carlsbergensis", "Saccharomyces pasteurianus"], "answer": 1, "note": "", "explanation": "馬克斯克魯維酵母（Kluyveromyces marxianus，無性世代為 Candida kefyr）具有乳糖酶能發酵乳糖產生酒精與二氧化碳，是傳統發酵乳酒（如馬乳酒 Koumiss、克菲爾 Kefir）中的重要酵母菌。", "image": ""}, {"id": "2-4 學習評量-1", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 1, "question": "暴露於空氣中的菌絲稱為？", "options": ["授胎菌絲", "氣生菌絲", "生殖菌絲", "以上皆是"], "answer": 4, "note": "", "explanation": "向上伸展暴露於空氣中的菌絲統稱為氣生菌絲（Aerial hyphae），其主要負責產生孢子進行繁殖，故又稱為生殖菌絲或授胎菌絲（Fertile hyphae）。", "image": ""}, {"id": "2-4 學習評量-2", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 2, "question": "黴菌的生殖器官是？", "options": ["菌絲體", "子實體", "菌絲束", "分生體"], "answer": 2, "note": "", "explanation": "黴菌形態主要由營養器官「菌絲體」與生殖器官「子實體」（Fruiting body，可產生各種孢子）所構成。", "image": ""}, {"id": "2-4 學習評量-3", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 3, "question": "菌蕈的何種菌絲可發育為子實體？", "options": ["單核菌絲", "一次菌絲", "二次菌絲", "初生菌絲"], "answer": 3, "note": "", "explanation": "擔子菌（菌蕈）的單核初生菌絲（一次菌絲）經質配結合形成雙核的「二次菌絲」（次生菌絲），再由二次菌絲組織化發育為菇體（子實體）。", "image": ""}, {"id": "2-4 學習評量-4", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 4, "question": "菌蕈子實體的何種部位帶有孢子組織？", "options": ["菌傘", "菌柄", "子實層體", "菌環"], "answer": 3, "note": "", "explanation": "菌傘下方的菌褶或菌管等構造統稱為「子實層體」（Hymenophore），其表面覆蓋著產生擔孢子的子實層組織。", "image": ""}, {"id": "2-4 學習評量-5", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 5, "question": "下列何種真菌具有無隔膜的菌絲？", "options": ["水黴菌", "毛黴", "根黴", "以上皆是"], "answer": 4, "note": "", "explanation": "低等真菌（如卵菌綱的水黴菌、接合菌綱的毛黴與根黴）菌絲內無橫隔膜分隔，呈多核管狀，稱為無隔膜菌絲（多核菌絲）。", "image": ""}, {"id": "2-4 學習評量-6", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 6, "question": "有孢子的酵母屬於？", "options": ["擔子菌", "半子囊菌", "真正子囊菌", "接合菌"], "answer": 2, "note": "", "explanation": "能形成子囊孢子的酵母菌（如 Saccharomyces）因不形成大型子囊果，在傳統真菌分類中歸屬於子囊菌綱下的「半子囊菌亞綱」（Hemiascomycetes）。", "image": ""}, {"id": "2-4 學習評量-7", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 7, "question": "真菌中完全不具有性世代或尚未發現有性世代者歸類為？", "options": ["半子囊菌", "異擔子菌", "同擔子菌", "不完全菌"], "answer": 4, "note": "", "explanation": "僅發現無性繁殖世代而尚未發現有性世代的真菌，在分類學上統一歸類為「不完全菌」（Deuteromycetes / Fungi Imperfecti）。", "image": ""}, {"id": "2-4 學習評量-8", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 8, "question": "洋菇形成子實體的最佳溫度為？", "options": ["30～37", "37～45", "25～30", "13～18℃"], "answer": 4, "note": "", "explanation": "洋菇（Agaricus bisporus）菌絲生長適溫約 22～25℃，但誘導與形成子實體（出菇）需要較低溫度，最佳溫度為 13～18℃。", "image": ""}, {"id": "2-4 學習評量-9", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 9, "question": "根黴能於培養基上蔓延產生一種細長、分歧而有明顯細胞壁的氣生菌絲稱為？", "options": ["匍匐枝", "假根", "節細胞", "孢子囊柄"], "answer": 1, "note": "", "explanation": "根黴（Rhizopus）在培養基表面橫向延伸的弓形氣生菌絲稱為「匍匐枝」（Stolon），在接觸培養基處向下長出假根、向上長出孢子囊柄。", "image": ""}, {"id": "2-4 學習評量-10", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 10, "question": "廣應用於醬油、味噌、豆豉的麴菌（Aspergillus）為？", "options": ["A. niger", "A. oryzae", "A. flavus", "A. glaucus"], "answer": 2, "note": "", "explanation": "米麴菌（Aspergillus oryzae）能分泌豐富的蛋白酶與澱粉酶且不產黃麴毒素，廣泛應用於醬油、味噌、清酒及豆豉等傳統發酵食品製造。", "image": ""}, {"id": "2-4 學習評量-11", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 11, "question": "關於黴菌絲之敘述何者有誤？", "options": ["有隔膜之菌絲，演化上較無隔膜為高", "每個隔膜內，有一個細胞核", "擔子菌屬於有隔膜菌絲", "黴菌菌絲可分為有隔膜及無隔膜菌絲兩種"], "answer": 2, "note": "", "explanation": "有隔膜菌絲的每個細胞區間內可能含有「一個、兩個或多個」細胞核（如擔子菌的二次菌絲為雙核），並非一律只有一個細胞核。", "image": ""}, {"id": "2-4 學習評量-12", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 12, "question": "黴菌細胞構造敘述何者有誤？", "options": ["細胞壁主要成份為胜肽聚醣", "粒線體為能量發電廠", "衰老細胞，液泡較多", "質膜外泡為黴菌特有構造"], "answer": 1, "note": "", "explanation": "胜肽聚醣是「細菌」細胞壁的主要成分；黴菌（真菌）細胞壁的主要成分為幾丁質（Chitin，甲殼素）與葡萄聚糖。", "image": ""}, {"id": "2-4 學習評量-13", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 13, "question": "下列何種黴菌，多數為水生，無性生殖時產生單端鞭毛的游動孢子，有性生殖則形成休眠孢子囊？", "options": ["壺菌", "接合菌", "子囊菌", "擔子菌"], "answer": 1, "note": "", "explanation": "壺菌綱（Chytridiomycetes）為最低等的真菌，多數為水生，最大特徵是無性生殖會產生具單根後生鞭毛的游動孢子（Zoospore）。", "image": ""}, {"id": "2-4 學習評量-14", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 14, "question": "毛黴與根黴是屬於？", "options": ["壺菌", "接合菌", "子囊菌", "擔子菌"], "answer": 2, "note": "", "explanation": "毛黴屬（Mucor）與根黴屬（Rhizopus）無性生殖產生孢子囊孢子，有性生殖形成接合孢子，皆屬於接合菌綱（Zygomycetes）。", "image": ""}, {"id": "2-4 學習評量-15", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 15, "question": "下列何者屬於半子囊菌？", "options": ["麵包黴", "青黴", "有孢子酵母", "麴菌"], "answer": 3, "note": "", "explanation": "有孢子酵母菌直接由營養細胞轉化為裸露子囊並產生子囊孢子，屬於半子囊菌；麵包黴（脈孢菌）、青黴與麴菌的有性世代則屬於真正子囊菌。", "image": ""}, {"id": "2-4 學習評量-16", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 16, "question": "子囊菌中，若子囊果開口狹小者稱為？", "options": ["散囊果", "閉囊果", "瓶狀子囊果", "盤狀子囊果"], "answer": 3, "note": "", "explanation": "瓶狀子囊果（子囊殼，Perithecium）外型呈燒瓶狀，頂端具有一個狹小的孔口（孔口孔）供子囊孢子釋出。", "image": ""}, {"id": "2-4 學習評量-17", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 17, "question": "子囊菌中，若子囊果裸露於菌絲細胞間隙者稱為？", "options": ["散囊果", "閉囊果", "瓶狀子囊果", "盤狀子囊果"], "answer": 1, "note": "", "explanation": "散囊果（裸囊果，Gymnothecium）外圍僅由疏鬆交織的菌絲包繞或裸露於菌絲間隙中，無緻密的外壁。", "image": ""}, {"id": "2-4 學習評量-18", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 18, "question": "真菌中產生扣子體的是？", "options": ["壺菌", "接合菌", "子囊菌", "擔子菌"], "answer": 4, "note": "", "explanation": "扣子體（鎖狀聯合，Clamp connection）是擔子菌雙核二次菌絲進行細胞分裂時，為確保兩個子細胞均能獲得一對異質細胞核而形成的特有鉤狀構造。", "image": ""}, {"id": "2-4 學習評量-19", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 19, "question": "擔子菌之擔子器上，一般形成幾枝擔子柄？", "options": ["3", "4", "6", "8"], "answer": 2, "note": "", "explanation": "典型的擔子器（Basidium）頂端一般長出 4 枝擔子柄（小梗，Sterigmata），每枝擔子柄頂端各著生 1 個擔孢子（共 4 個外生擔孢子）。", "image": ""}, {"id": "2-4 學習評量-20", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 20, "question": "下列何者屬於異擔子菌？", "options": ["木耳", "洋菇", "香菇", "竹蓀"], "answer": 1, "note": "", "explanation": "木耳的擔子器具有隔膜分隔（多細胞擔子器），屬於異擔子菌亞綱（Heterobasidiomycetes）；洋菇、香菇與竹蓀的擔子器無隔膜，屬於同擔子菌亞綱。", "image": ""}, {"id": "2-4 學習評量-21", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 21, "question": "下列何種黴菌具有孢子囊孢子？", "options": ["麴黴", "青黴", "根黴", "木黴"], "answer": 3, "note": "", "explanation": "根黴（Rhizopus）屬於接合菌，無性繁殖時在孢子囊內形成孢子囊孢子；麴黴、青黴與木黴皆產生外生的分生孢子。", "image": ""}, {"id": "2-4 學習評量-22", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 22, "question": "有關毛黴之敘述，何者有誤？", "options": ["孢子囊外圍覆蓋毛狀氯化鈣結晶", "可進行有性接合生殖", "中軸為孢子囊柄伸入孢子囊內的部份", "具有強蛋白質分解能力"], "answer": 1, "note": "", "explanation": "毛黴（Mucor）成熟孢子囊外壁覆蓋的是毛狀「草酸鈣」（Calcium oxalate）結晶，而非氯化鈣結晶。", "image": ""}, {"id": "2-4 學習評量-23", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 23, "question": "根黴菌絲與培養基接觸部份形成節，深入培養基，長出分枝狀的構造稱為？", "options": ["匍匐枝", "假根", "中軸", "囊托"], "answer": 2, "note": "", "explanation": "根黴匍匐枝接觸培養基處會向下伸入基質並分枝成根狀構造，稱為「假根」（Rhizoid）。", "image": ""}, {"id": "2-4 學習評量-24", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 24, "question": "根黴用以固定與吸收養分的構造？", "options": ["匍匐枝", "假根", "中軸", "囊托"], "answer": 2, "note": "", "explanation": "假根深入培養基中，主要功能是固定菌體並分泌酵素分解吸收基質中的養分。", "image": ""}, {"id": "2-4 學習評量-25", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 25, "question": "下列何者非麴黴的構造？", "options": ["匍匐枝", "頂囊", "足細胞", "假根"], "answer": 4, "note": "", "explanation": "麴黴（Aspergillus）的特徵構造包含足細胞（Foot cell）、分生孢子柄、頂囊（Vesicle）、瓶梗（小梗）與分生孢子（部分種類具匍匐枝）；「假根」則是根黴（Rhizopus）的特徵構造。（註：食品微生物題庫中「假根」為標準非麴黴構造）", "image": ""}, {"id": "2-4 學習評量-26", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 26, "question": "主要應用於味噌、醬油、豆豉、味淋等製品的黴菌為？", "options": ["麴黴", "青黴", "根黴", "木黴"], "answer": 1, "note": "", "explanation": "麴黴（Aspergillus，特別是米麴菌 A. oryzae 與醬油麴菌 A. sojae）是製作醬油、味噌、豆豉、清酒與味淋的核心製麴菌種。", "image": ""}, {"id": "2-4 學習評量-27", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 27, "question": "何種黴菌的分生孢子，多為綠色，與分生子柄外形呈掃把狀？", "options": ["麴黴", "青黴", "毛黴", "根黴"], "answer": 2, "note": "", "explanation": "青黴（Penicillium）的分生孢子梗頂端呈對稱或不對稱分枝並著生串狀分生孢子，整體形似掃把或毛刷（Penicillus 拉丁文即為畫筆/刷子之意），菌落多呈藍綠色。", "image": ""}, {"id": "2-4 學習評量-28", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 28, "question": "常寄生於大型真菌的子實體上，藉著養分競爭與抗生素的作用，產生拮抗作用，為菇類栽培的勁敵？", "options": ["麴黴", "青黴", "根黴", "木黴"], "answer": 4, "note": "", "explanation": "木黴（Trichoderma，俗稱綠黴菌）生長極為迅速，會分泌抗生素及幾丁質酶抑制並寄生於食用菇菌絲與子實體上，是香菇、洋菇等菇類栽培中最嚴重的雜菌病害。", "image": ""}, {"id": "2-4 學習評量-29", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 29, "question": "可用於分解木材、動物排泄物作為單細胞蛋白質的生產原料的黴菌？", "options": ["麴黴", "青黴", "根黴", "木黴"], "answer": 4, "note": "", "explanation": "木黴（Trichoderma，如里氏木黴 T. reesei）具有極強的纖維素酶（Cellulase）活性，能有效分解木材與農業廢棄物中的纖維素，進而培養生產單細胞蛋白質（SCP）。", "image": ""}, {"id": "2-4 學習評量-30", "section": "2-4 學習評量", "sectionName": "2-4 學習評量（p.108-110）", "no": 30, "question": "菌體含豐富的胡蘿蔔素，可用於製造維生素 A 的黴菌？", "options": ["麴黴", "青黴", "紅麴黴", "紅麵包黴"], "answer": 4, "note": "", "explanation": "紅麵包黴（Neurospora crassa，粗糙脈孢菌）菌絲與分生孢子呈橘紅色，富含 β-胡蘿蔔素（維生素 A 前驅物），可用於生產胡蘿蔔素與維生素 A。", "image": ""}]}, "chem_1127": {"name": "課後評量 11/27", "subtitle": "化學 B 全一冊（第 4 回）＆課後習題（共 50 題 · 含互動圖解）", "secPrefix": "", "marks": ["A", "B", "C", "D"], "data": [{"id": "chem1127-p1-1", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 1, "question": "下列物質中，何者為分子化合物？", "options": ["氯化鎂 (MgCl₂)", "硝酸 (HNO₃)", "碳酸鈉 (Na₂CO₃)", "二氧化矽 (SiO₂)"], "answer": 2, "note": "", "image": "", "explanation": "分子化合物通常由非金屬元素之間以共價鍵結合而成。(A)、(C) 含金屬元素，屬於離子化合物；(D) 為共價網狀固體；(B) 硝酸由非金屬元素（H、N、O）組成，屬於分子化合物。"}, {"id": "chem1127-p1-2", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 2, "question": "下列何者具有最高的熔點？", "options": ["SiO₂", "MgCl₂", "Fe", "N₂O"], "answer": 1, "note": "", "image": "", "explanation": "熔點高低一般順序為：共價網狀固體 > 離子晶體、金屬晶體 > 分子晶體。(A) SiO₂ 為共價網狀固體，熔點高達 1700℃ 以上，為四者中最高。"}, {"id": "chem1127-p1-3", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 3, "question": "金屬晶體中，是以以下列何種作用力將原子聚集在一起？", "options": ["金屬鍵", "共價鍵", "離子鍵", "氫鍵"], "answer": 1, "note": "", "image": "", "explanation": "金屬陽離子與自由移動的價電子（電子海）之間的靜電吸引力稱為金屬鍵。"}, {"id": "chem1127-p1-4", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 4, "question": "下列有關離子固體及金屬晶體的敘述，何者正確？", "options": ["兩者在固態時均可導電", "金屬晶體延展性佳而離子固體質硬易碎", "金屬晶體加入其他金屬形成合金，導電性增大", "兩者均藉著陰陽離子間的靜電引力結合而成"], "answer": 2, "note": "", "image": "", "explanation": "(A) 離子固體在固態時離子無法自由移動，不能導電；(C) 形成合金後原子排列受干擾，導電性通常會下降；(D) 金屬晶體是金屬陽離子與自由電子間的吸引力。"}, {"id": "chem1127-p1-5", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 5, "question": "常溫下有種黃綠色氣態物質，沸點為 -34.4℃，熔點 -101.5℃，溶於水中無法導電，具有強烈刺激性，會傷害呼吸道，嚴重則導致死亡。根據性質判斷，屬於下列哪一類的物質？", "options": ["共價分子", "離子化合物", "金屬", "共價網狀固體"], "answer": 1, "note": "", "image": "", "explanation": "該物質為氯氣（Cl₂），常溫為氣態且熔沸點極低，屬於由共價鍵結合的共價分子（分子晶體）。"}, {"id": "chem1127-p1-6", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 6, "question": "下列物質中，何者延展性最佳？", "options": ["氯化鈉", "乾冰", "純金", "石墨"], "answer": 3, "note": "", "image": "", "explanation": "金屬鍵不具方向性，受外力敲擊時原子層滑動不會破壞鍵結，因此純金（金屬晶體）具有極佳的延展性。"}, {"id": "chem1127-p1-7", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 7, "question": "在常溫常壓下，下列哪個物質以分子形態存在？", "options": ["水 (H₂O)", "氫氧化鈉 (NaOH)", "水銀 (Hg)", "小蘇打 (NaHCO₃)"], "answer": 1, "note": "", "image": "", "explanation": "(B)、(D) 為離子化合物；(C) 為金屬元素；(A) 水為非金屬組成的分子化合物，以分子形態存在。"}, {"id": "chem1127-p1-8", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 8, "question": "下列四種元素中，何者之化學鍵特性與其他三者有顯著的差異？", "options": ["Cu", "Zn", "Na", "Si"], "answer": 4, "note": "", "image": "", "explanation": "(A)、(B)、(C) 皆為金屬元素，形成金屬鍵；(D) 矽（Si）為類金屬（非金屬性質），原子間以共價鍵形成共價網狀結構。"}, {"id": "chem1127-p1-9", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 9, "question": "根據下表的四種物質之物理性質，判斷食鹽、鋁、氯化氫、石墨，按順序編號為何？\n（表：甲熔點 660℃、固液均導電、非電解質；乙熔點 801℃、固不導液導、是電解質；丙熔點 3350℃、固態能導電、非電解質；丁熔點 -83℃、固液均不導、是電解質）", "options": ["乙甲丁丙", "丙甲丁乙", "丙乙甲丁", "甲乙丙丁"], "answer": 1, "note": "", "image": "", "explanation": "食鹽（離子晶體，固不導液導）為乙；鋁（金屬，固液均導電）為甲；氯化氫（分子化合物，熔點極低，溶於水為電解質）為丁；石墨（共價網狀固體，熔點極高且固態可導電）為丙。故順序為乙甲丁丙。"}, {"id": "chem1127-p1-10", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 10, "question": "離子鍵的形成，是由於原子間發生了何種現象？", "options": ["電子轉移", "電子共用", "質子轉移", "電子海"], "answer": 1, "note": "", "image": "", "explanation": "金屬原子失去價電子轉移給非金屬原子，分別形成陽離子與陰離子，再以靜電引力結合。"}, {"id": "chem1127-p1-11", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 11, "question": "有四種元素 A、D、E 及 J，其原子序各為 7、9、10 及 12，則下列化學式何者為離子晶體？", "options": ["A₂", "AD₃", "JD₂", "E"], "answer": 3, "note": "", "image": "", "explanation": "原子序 7 為 N（非金屬）、9 為 F（非金屬）、10 為 Ne（鈍氣）、12 為 Mg（金屬）。金屬 J (Mg) 與非金屬 D (F) 結合而成的 JD₂ (MgF₂) 為離子晶體。"}, {"id": "chem1127-p1-12", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 12, "question": "附圖為甘油的結構式（含 3 個碳、8 個氫、3 個氧），則甘油的分子式應如何表示？", "options": ["C₂H₈O₃", "C₃H₆O₃", "C₃H₈O₃", "C₄H₈O₂"], "answer": 3, "note": "", "image": "", "explanation": "計算結構式中各原子總數：碳有 3 個、氫有 8 個、氧有 3 個，故分子式為 C₃H₈O₃。"}, {"id": "chem1127-p1-13", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 13, "question": "下列物質括號中標示的化學式，既為分子式也是實驗式？", "options": ["氨氣 (NH₃)", "食鹽 (NaCl)", "葡萄糖 (C₆H₁₂O₆)", "小蘇打 (NaHCO₃)"], "answer": 1, "note": "", "image": "", "explanation": "(B)、(D) 為離子化合物，無分子式；(C) 葡萄糖分子式為 C₆H₁₂O₆，實驗式為 CH₂O；(A) NH₃ 為分子化合物，且原子個數比 1:3 已為最簡整數比，故同時為分子式與實驗式。"}, {"id": "chem1127-p1-14", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 14, "question": "發生於 2014 年震驚臺灣的高雄氣爆事件，是由於運輸丙烯的管線因壓力過大無法負荷所導致。丙烯是由碳和氫所構成的分子，其分子量為 42，下列何者為丙烯的分子式？", "options": ["C₂H₄", "C₂H₆", "C₃H₆", "C₃H₈"], "answer": 3, "note": "", "image": "", "explanation": "丙烯通式為 CₙH₂ₙ，分子量 12n + 2n = 14n = 42 ⇒ n = 3，故分子式為 C₃H₆。"}, {"id": "chem1127-p1-15", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 15, "question": "下列何化合物的實驗式與 C₆H₁₂O₆ 相同？", "options": ["CH₃CHO", "C₂H₅OH", "CH₃COCH₃", "CH₃COOH"], "answer": 4, "note": "", "image": "", "explanation": "C₆H₁₂O₆ 的實驗式為 CH₂O。(D) CH₃COOH 的分子式為 C₂H₄O₂，化為最簡整數比亦為 CH₂O。"}, {"id": "chem1127-p1-16", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 16, "question": "下列有關化學式的敘述，何者錯誤？", "options": ["實驗式表明分子內的原子種類和原子個數比", "分子式表明分子內的原子種類和原子個數", "結構式表示分子內的原子排列方式和分子三度空間形狀", "示性式表示分子的特性，是由結構式簡化而得"], "answer": 3, "note": "", "image": "", "explanation": "結構式僅能表示平面上的原子排列與鍵結方式，無法直接表示分子的真實三度空間立體形狀。"}, {"id": "chem1127-p1-17", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 17, "question": "酒精為一常見的有機化合物，化學式寫成 C₂H₅OH，請問這是哪一種化學式？", "options": ["實驗式", "分子式", "結構式", "示性式"], "answer": 4, "note": "", "image": "", "explanation": "將官能基 -OH 特別標示出來以顯示其化學性質的化學式稱為示性式。"}, {"id": "chem1127-p1-18", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 18, "question": "承上題，酒精化學式中的 -OH，表示具有下列何種官能基？", "options": ["羥基", "羧基", "羰基", "胺基"], "answer": 1, "note": "", "image": "", "explanation": "-OH 稱為羥基（醇類的官能基）；-COOH 為羧基。"}, {"id": "chem1127-p1-19", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 19, "question": "下列物質中，何者具有參鍵的結構？", "options": ["H-O-H", "N≡N", "O-N=O", "O=C=O"], "answer": 2, "note": "", "image": "", "explanation": "氮氣分子（N₂）中兩個氮原子共用 3 對電子，形成共價參鍵（N≡N）。"}, {"id": "chem1127-p1-20", "section": "分回測驗卷第4回", "sectionName": "第一部分：分回測驗卷－化學 B 全一冊（第 4 回）", "no": 20, "question": "一氧化氮的路易斯電子點式表示為「:Ṅ=Ö:」，則在 N 原子與 O 原子之間，共用多少個價電子？", "options": ["2", "3", "4", "6"], "answer": 3, "note": "", "image": "", "explanation": "N 與 O 之間為雙鍵（=），每一條共價鍵代表共用 2 個價電子，雙鍵共用了 2 × 2 = 4 個價電子。"}, {"id": "chem1127-p2a-1", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 1, "question": "石油是混合物，若經過分餾，收集沸點在 70～120℃ 範圍之物質即是汽油，則此汽油可歸類為哪一種物質？", "options": ["混合物", "純物質", "元素", "以上皆非"], "answer": 1, "note": "", "image": "", "explanation": "分餾是收集特定沸點「範圍」內的餾分，汽油仍由多種碳氫化合物組成，因此屬於混合物。"}, {"id": "chem1127-p2a-2", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 2, "question": "下列何者為化合物？", "options": ["水銀", "石墨", "水", "硫"], "answer": 3, "note": "", "image": "", "explanation": "水（H₂O）由氫和氧兩種不同元素化合而成，屬於化合物；其餘三者皆為單一元素構成的元素物質。"}, {"id": "chem1127-p2a-3", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 3, "question": "以下分離物質的方法，何者不適用？", "options": ["分離食鹽水中的食鹽可用過濾法", "分離酒裡面的酒精可用蒸餾法", "分離樹葉中的葉綠素可用萃取法", "分離粗鹽中的食鹽可使用結晶法"], "answer": 1, "note": "", "image": "", "explanation": "食鹽完全溶解於水中形成真溶液，顆粒極小可通過濾紙，無法用過濾法分離，應改用蒸發結晶法。"}, {"id": "chem1127-p2a-4", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 4, "question": "下列四種氣體的收集方式配對，何者不適當？", "options": ["氧氣-排水集氣法", "氯化氫-向上排空氣法", "氨氣-向下排空氣法", "二氧化硫-排水集氣法"], "answer": 4, "note": "", "image": "", "explanation": "二氧化硫（SO₂）極易溶於水且會與水反應生成亞硫酸，不可用排水集氣法，因其密度大於空氣，應使用向上排空氣法。"}, {"id": "chem1127-p2a-5", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 5, "question": "甲、乙、丙、丁四杯液體，甲與乙呈無色透明，丙帶紅色，丁呈混濁白色。甲置於蒸發皿蒸乾後，無任何殘餘物；乙置於蒸發皿蒸乾後，皿上留有白色固體；丙置於蒸發皿蒸乾後，皿上殘留有紅色固體。則哪一杯液體可能是純物質？", "options": ["甲", "乙", "丙", "丁"], "answer": 1, "note": "", "image": "", "explanation": "乙、丙蒸乾後有固體殘留，丁為混濁液，皆為混合物；甲無色透明且蒸乾無殘留物，可能是純水等純物質。"}, {"id": "chem1127-p2a-6", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 6, "question": "有關汽化現象的敘述何者有誤？", "options": ["汽化是吸熱反應", "達到沸點時的汽化現象稱為沸騰", "只發生在液體內部的汽化現象稱為蒸發", "同一種物質的沸點高低與外部壓力大小有關"], "answer": 3, "note": "", "image": "", "explanation": "蒸發是發生在液體表面且在任何溫度下皆可進行的汽化現象；沸騰則是液體內部與表面同時劇烈汽化。"}, {"id": "chem1127-p2a-7", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 7, "question": "下面哪個是吸熱反應？", "options": ["凝結", "凝固", "凝華", "昇華"], "answer": 4, "note": "", "image": "", "explanation": "昇華是固態直接變為氣態的過程，分子間距離大幅增加，需要吸收熱量。"}, {"id": "chem1127-p2a-8", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 8, "question": "水受熱變成水蒸氣時發生什麼變化？", "options": ["分子體積變大", "分子結構改變", "分子質量變重", "分子間距離變大"], "answer": 4, "note": "", "image": "", "explanation": "水受熱汽化為物理變化，水分子本身的大小、質量與結構皆不變，僅分子間的距離變大。"}, {"id": "chem1127-p2a-9", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 9, "question": "在高山上，水的沸點低於 100℃，這是因為什麼？", "options": ["高山上氣壓不到 1 atm，水的沸點隨著氣壓下降而下降", "高山上受到的地心引力比較小，水比較容易沸騰", "高山上比較接近太陽，受到太陽輻射較劇烈，水的沸點降低", "高山上磁場比較強，水的沸點降低"], "answer": 1, "note": "", "image": "", "explanation": "液體沸點受外界大氣壓力影響，氣壓越低，液體越容易氣化沸騰，故沸點降低。"}, {"id": "chem1127-p2a-10", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 10, "question": "從二氧化碳的三相圖來判斷，若是希望二氧化碳也能在加熱時從固態熔化成液態再汽化變成氣態，環境壓力應該要如何改變？\n（圖示三相點壓力為 5.11 atm、溫度為 -56.6℃）", "options": ["大於 5.11 atm", "小於 1 atm", "與壓力無關，是加熱速度不夠快", "只調整壓力無法辦到"], "answer": 1, "note": "", "image": "", "explanation": "由三相圖可知，唯有當環境壓力高於三相點壓力（5.11 atm）時，加熱固態二氧化碳才會經過液態區再變成氣態。"}, {"id": "chem1127-p2a-11", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 11, "question": "關於離子鍵的形成，下列何者有誤？", "options": ["是種在金屬原子和非金屬原子之間的化學鍵", "金屬原子將價電子轉移到非金屬原子上", "兩者利用萬有引力結合", "形成的離子化合物熔、沸點較高"], "answer": 3, "note": "", "image": "", "explanation": "陰、陽離子之間是利用靜電引力（庫侖靜電力）結合，而非萬有引力。"}, {"id": "chem1127-p2a-12", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 12, "question": "關於共價鍵的形成，下列何者有誤？", "options": ["是種在非金屬原子和非金屬原子之間的化學鍵", "金屬原子將價電子轉移到非金屬原子上", "兩者利用共用電子對結合", "形成的多半是分子化合物"], "answer": 2, "note": "", "image": "", "explanation": "電子轉移發生在離子鍵形成時；共價鍵是由非金屬原子之間彼此「共用價電子對」而形成。"}, {"id": "chem1127-p2a-13", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 13, "question": "金屬鍵的形成，下列何者有誤？", "options": ["是種在非金屬原子和非金屬原子之間的化學鍵", "金屬原子的價電子脫離原子的束縛形成電子海", "電子海和金屬陽離子利用靜電力結合", "沒有方向性，因此金屬有延展性"], "answer": 1, "note": "", "image": "", "explanation": "金屬鍵存在於金屬原子之間，非金屬原子之間形成的是共價鍵。"}, {"id": "chem1127-p2a-14", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 14, "question": "下列何種化合物屬於離子化合物？", "options": ["NaCl", "CO₂", "CH₄", "H₂O"], "answer": 1, "note": "", "image": "", "explanation": "NaCl 由金屬（Na）與非金屬（Cl）組成，為離子化合物；其餘三者皆為非金屬組成的分子化合物。"}, {"id": "chem1127-p2a-15", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 15, "question": "(甲) 銅金屬 Cu-Cu 鍵　(乙) 氫分子的 H-H 鍵　(丙) 氯化鈉的 Na-Cl 鍵　(丁) 一氧化碳的 C-O 鍵　(戊) 氯化鉀的 K-Cl 鍵。上述項目中屬於共價鍵的是哪幾個？", "options": ["甲乙", "甲丁", "丙戊", "乙丁"], "answer": 4, "note": "", "image": "", "explanation": "(甲) 為金屬鍵；(乙)、(丁) 皆為非金屬原子間的結合，屬於共價鍵；(丙)、(戊) 為金屬與非金屬間的離子鍵。"}, {"id": "chem1127-p2a-16", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 16, "question": "乙醇最適合用哪一種化學式來表示？", "options": ["C₂H₆O", "CH₃OCH₃", "CH₃CHO", "C₂H₅OH"], "answer": 4, "note": "", "image": "", "explanation": "為區分同分異構物甲醚（CH₃OCH₃），乙醇最適合使用示性式 C₂H₅OH 表示。"}, {"id": "chem1127-p2a-17", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 17, "question": "食鹽的化學式寫作 NaCl 時，用的是哪一種化學式？", "options": ["分子式", "實驗式", "示性式", "結構式"], "answer": 2, "note": "", "image": "", "explanation": "離子化合物由大量陰陽離子堆積而成，沒有獨立分子，僅能以最簡整數比（實驗式）NaCl 表示。"}, {"id": "chem1127-p2a-18", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 18, "question": "能夠將各原子間的鍵結方式都表現出來的化學式是那一種？", "options": ["實驗式", "示性式", "分子式", "結構式"], "answer": 4, "note": "", "image": "", "explanation": "結構式會用短線（如單鍵、雙鍵）將分子內所有原子的排列與鍵結方式畫出。"}, {"id": "chem1127-p2a-19", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 19, "question": "哪一種化學式是用小點或 × 來代表價電子及鍵結關係？", "options": ["示性式", "結構式", "電子點式", "實驗式"], "answer": 3, "note": "", "image": "", "explanation": "路易斯電子點式（Electron dot formula）以圓點或叉號標示原子的價電子及共用電子對。"}, {"id": "chem1127-p2a-20", "section": "課後習題－課內題", "sectionName": "第二部分：課後習題（一、課內題）", "no": 20, "question": "(甲) Cu　(乙) KCl　(丙) H₂　(丁) CO　(戊) NaCl。上述化學式中屬於實驗式的是哪幾個？", "options": ["甲乙戊", "乙丁戊", "甲丙丁", "甲乙丁戊"], "answer": 1, "note": "", "image": "", "explanation": "(甲) 金屬晶體、(乙) 及 (戊) 離子晶體皆以實驗式表示；(丙)、(丁) 為分子化合物，寫的是分子式。"}, {"id": "chem1127-p2b-21", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 21, "question": "大理石和稀鹽酸作用可產生二氧化碳氣體，故大理石中含有哪些物質？", "options": ["二氧化碳", "碳和氫", "氧和二氧化碳", "碳和氧"], "answer": 4, "note": "", "image": "", "explanation": "依據化學反應前後「原子種類不變（質量守恆）」，生成物 CO₂ 含有碳和氧，而鹽酸（HCl）不含碳和氧，可知大理石（CaCO₃）中必含有碳和氧元素。"}, {"id": "chem1127-p2b-22", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 22, "question": "在定壓下加熱某液體至沸騰，再繼續加熱時，液體的溫度緩慢上升，可判斷該液體屬於哪一種分類？", "options": ["元素", "化合物", "純物質", "混合物"], "answer": 4, "note": "", "image": "", "explanation": "純物質在定壓下沸騰時溫度會保持固定；若沸騰時溫度仍持續上升，代表沒有固定沸點，屬於混合物。"}, {"id": "chem1127-p2b-23", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 23, "question": "二氧化碳可溶於水，但在實驗室製備二氧化碳時仍用排水集氣法收集二氧化碳，下列何者不是考量因素？", "options": ["二氧化碳在水中的溶解度低", "用向上排空氣法收集到的二氧化碳較不純", "二氧化碳會和空氣發生化學反應", "以上皆非"], "answer": 3, "note": "", "image": "", "explanation": "二氧化碳在常溫常壓下對水溶解度不大（約 1:1 體積比），且排水集氣法收集的氣體純度較高；二氧化碳性質穩定，不會與空氣發生化學反應。"}, {"id": "chem1127-p2b-24", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 24, "question": "下列何者屬於放熱反應？", "options": ["熔化", "凝結", "沸騰", "昇華"], "answer": 2, "note": "", "image": "", "explanation": "凝結是氣態變為液態，粒子動能降低，會將多餘熱量釋放出來，屬於放熱變化。"}, {"id": "chem1127-p2b-25", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 25, "question": "下列現象，哪個與相變化無關？", "options": ["雨後天空出現彩虹", "冷飲容器壁上冒出水珠", "冬天呼出白色霧氣", "濕衣服晾乾"], "answer": 1, "note": "", "image": "", "explanation": "(A) 彩虹是太陽光經過空氣中水滴發生折射與反射的光學現象，未涉及物質三態（相）的轉變；(B)、(C) 為凝結，(D) 為蒸發。"}, {"id": "chem1127-p2b-26", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 26, "question": "典型元素在形成化學鍵時一般會滿足八隅體，有關八隅體的敘述何者有誤？", "options": ["參與鍵結的原子間會互相轉移電子", "金屬原子會失去所有價殼層的電子", "非金屬原子會得到電子以填滿價殼層", "鈍氣原子價殼層不滿足八隅體，故活性低"], "answer": 4, "note": "", "image": "", "explanation": "鈍氣（如 Ne、Ar 等）的價殼層本身就已達 8 個價電子（氦為 2 個）的穩定全滿狀態，因此化學活性極低。"}, {"id": "chem1127-p2b-27", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 27, "question": "共價網狀晶體的例子有金剛石和石墨，其特點下列何者不正確？", "options": ["兩物質都是由碳原子構成", "兩物質都是立體共價網狀晶體結構", "金剛石因共價網狀晶體結構而成為硬度最高的物質", "石墨中的每個碳原子都跟另外 3 個碳原子形成共價鍵"], "answer": 2, "note": "", "image": "", "explanation": "金剛石為三度空間「立體」網狀結構；石墨則是由碳原子形成六角形環狀的「平面層狀」共價網狀結構，層與層之間以微弱凡得瓦力相吸。"}, {"id": "chem1127-p2b-28", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 28, "question": "冰的分子晶體結構何者正確？", "options": ["形成分子晶體使水結冰時體積縮小", "除了 H₂O 之外沒有其他物質能形成分子晶體", "甲烷水合物即甲烷儲存在冰晶體的孔洞中形成的物質", "水分子間以共價鍵構成分子晶體"], "answer": 3, "note": "", "image": "", "explanation": "(A) 水結冰時因氫鍵形成六角形中空結構，體積會「膨脹」；(B) 乾冰、碘等許多分子物質皆可形成分子晶體；(D) 水分子之間是以「氫鍵（分子間作用力）」結合，而非共價鍵。"}, {"id": "chem1127-p2b-29", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 29, "question": "為什麼離子化合物會用實驗式表示？", "options": ["是由陰陽離子以固定比例大量堆積而成，用簡單整數比就能表示物質", "只有一種原子組成", "無論組成原子的比例關係，都是同種物質", "原子堆疊的型態沒有差異，不必特別標註"], "answer": 1, "note": "", "image": "", "explanation": "離子化合物是由無數個陰離子與陽離子以固定比例連續堆積而成的巨大晶體，沒有單獨存在的分子，故以最簡整數比（實驗式）代表其組成。"}, {"id": "chem1127-p2b-30", "section": "課後習題－課外題", "sectionName": "第二部分：課後習題（二、課外題）", "no": 30, "question": "乙酸乙酯和丁酸的分子式都是 C₄H₈O₂，請問下列哪一個化學式能夠特定表示丁酸？", "options": ["C₃H₇COOH", "CH₃COHCH₃COH", "CH₃COOC₂H₅", "以上皆非"], "answer": 1, "note": "", "image": "", "explanation": "丁酸屬於羧酸類，含有羧基（-COOH），其示性式寫作 C₃H₇COOH；(C) 為乙酸乙酯的示性式。"}]}};

function renderDiagram(q, container) {
  const spec = QUESTION_DIAGRAMS[q.id];
  if (!spec) return;
  const [diagKey, defaultTabId] = spec;
  const diag = DIAGRAMS[diagKey];
  if (!diag) return;

  const box = document.createElement('div');
  box.className = 'diag-box';

  const head = document.createElement('div');
  head.className = 'diag-head';
  head.innerHTML = `<span class="diag-title">📊 ${diag.title}</span><span class="diag-badge">純 HTML/CSS/JS 互動圖解</span>`;
  box.appendChild(head);

  const stage = document.createElement('div');
  stage.className = 'diag-stage';
  const cap = document.createElement('div');
  cap.className = 'diag-cap';

  const activateTab = (tabId) => {
    const tab = diag.tabs.find(t => t.id === tabId) || diag.tabs[0];
    if (tabsBar) {
      [...tabsBar.children].forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab.id);
      });
    }
    stage.innerHTML = tab.svg;
    cap.innerHTML = tab.cap;
  };

  let tabsBar = null;
  if (diag.tabs.length > 1) {
    tabsBar = document.createElement('div');
    tabsBar.className = 'diag-tabs';
    diag.tabs.forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'diag-tab';
      btn.dataset.tab = t.id;
      btn.textContent = t.label;
      btn.onclick = () => activateTab(t.id);
      tabsBar.appendChild(btn);
    });
    box.appendChild(tabsBar);
  }

  box.appendChild(stage);
  box.appendChild(cap);
  container.appendChild(box);
  activateTab(defaultTabId);
}

const $ = id => document.getElementById(id);
let currentBankKey = 'baking';
let pool = [], idx = 0, correct = 0, wrong = [], answered = false;

function currentBank() {
  return BANKS[currentBankKey];
}

function renderBankSetup(key) {
  currentBankKey = key;
  const bank = currentBank();
  document.querySelectorAll('#bankTabs .hub-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.bank === key);
  });
  $('subtitle').textContent = `${bank.name} — ${bank.subtitle}`;

  const secMap = new Map();
  bank.data.forEach(q => {
    if (!secMap.has(q.section)) secMap.set(q.section, q.sectionName);
  });

  const secsEl = $('secs');
  secsEl.innerHTML = '';
  secMap.forEach((secName, k) => {
    const n = bank.data.filter(q => q.section === k).length;
    const labelText = bank.secPrefix
      ? `${bank.secPrefix}${k}：${secName}（${n} 題）`
      : `${secName}（${n} 題）`;
    const l = document.createElement('label');
    l.className = 'chk';
    l.innerHTML = `<input type="checkbox" value="${k}" checked> <span>${labelText}</span>`;
    secsEl.appendChild(l);
  });

  secsEl.querySelectorAll('input').forEach(i => i.onchange = refreshMax);
  refreshMax();
  const maxVal = selected().length;
  $('count').value = Math.min(20, maxVal || 20);
}

function selected() {
  const bank = currentBank();
  const s = [...document.querySelectorAll('#secs input:checked')].map(i => i.value);
  return bank.data.filter(q => s.includes(q.section));
}

function refreshMax() {
  const len = selected().length;
  $('max').textContent = len;
  if (len > 0 && parseInt($('count').value) > len) {
    $('count').value = len;
  }
}

document.querySelectorAll('#bankTabs .hub-btn').forEach(btn => {
  btn.onclick = () => renderBankSetup(btn.dataset.bank);
});

$('all').onclick = () => {
  const len = selected().length;
  if (len > 0) $('count').value = len;
};

$('chkAll').onclick = () => {
  document.querySelectorAll('#secs input').forEach(i => i.checked = true);
  refreshMax();
};

$('chkNone').onclick = () => {
  document.querySelectorAll('#secs input').forEach(i => i.checked = false);
  refreshMax();
};

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

$('start').onclick = () => {
  const s = selected();
  if (!s.length) { alert('請至少勾選一個單元範圍'); return; }
  let n = Math.max(1, Math.min(parseInt($('count').value) || 1, s.length));
  pool = shuffle(s).slice(0, n);
  idx = 0; correct = 0; wrong = [];
  $('setup').classList.add('hide');
  $('result').classList.add('hide');
  $('quiz').classList.remove('hide');
  show();
};

function show() {
  const bank = currentBank();
  const q = pool[idx];
  answered = false;
  $('bar').style.width = (idx / pool.length * 100) + '%';
  const codeLabel = bank.secPrefix ? `題庫 ${q.section}-${q.no}` : `第 ${q.no} 題`;
  $('meta').innerHTML = `第 ${idx + 1} / ${pool.length} 題　·　${codeLabel}（${q.sectionName}）` + (QUESTION_DIAGRAMS[q.id] ? '<span class="meta-badge">含互動圖解</span>' : '');
  $('qtext').textContent = q.question;
  $('fb').textContent = '';
  $('fb').className = 'fb';
  $('note').textContent = q.note || '';
  $('exp').classList.add('hide');
  $('exp').innerHTML = '';
  $('opts').innerHTML = '';

  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = `${bank.marks[i]} ${o}`;
    b.onclick = () => pick(i + 1, b);
    $('opts').appendChild(b);
  });
  $('next').disabled = true;
  $('next').textContent = idx === pool.length - 1 ? '查看結果' : '下一題';
}

function pick(n, btn) {
  if (answered) return;
  answered = true;
  const bank = currentBank();
  const q = pool[idx];
  const bs = [...$('opts').children];
  bs.forEach(b => b.disabled = true);
  bs[q.answer - 1].classList.add('ok');

  if (n === q.answer) {
    correct++;
    $('fb').textContent = '✔ 答對了';
    $('fb').classList.add('ok');
  } else {
    btn.classList.add('ng');
    wrong.push(q);
    $('fb').textContent = `✘ 答錯了，正確答案：${bank.marks[q.answer - 1]} ${q.options[q.answer - 1]}`;
    $('fb').classList.add('ng');
  }

  const e = $('exp');
  e.innerHTML = '<b>解析</b><br>';
  const tx = document.createElement('span');
  tx.textContent = q.explanation || '（此題尚未建立解析）';
  e.appendChild(tx);
  renderDiagram(q, e);
  if (q.image) {
    const im = document.createElement('img');
    im.src = q.image;
    im.alt = '解析附圖';
    e.appendChild(im);
  }
  e.classList.remove('hide');
  $('next').disabled = false;
}

$('next').onclick = () => {
  if (idx < pool.length - 1) { idx++; show(); }
  else finish();
};

$('quit').onclick = () => {
  if (confirm('確定結束並查看結果？')) {
    pool = pool.slice(0, idx + (answered ? 1 : 0));
    if (!pool.length) { reset(); return; }
    finish();
  }
};

function finish() {
  const bank = currentBank();
  $('quiz').classList.add('hide');
  $('result').classList.remove('hide');
  $('resTitle').textContent = `${bank.name} — 測驗結果`;
  $('score').textContent = `${correct} / ${pool.length}（${Math.round(correct / pool.length * 100)}%）`;
  $('wrongs').innerHTML = wrong.length ? '<p><b>錯題檢討</b></p>' : '<p>全部答對 🎉</p>';
  wrong.forEach(q => {
    const d = document.createElement('div');
    d.className = 'wrong';
    const prefix = bank.secPrefix ? `${q.section}-${q.no}` : `[${q.section}] 第${q.no}題`;
    d.textContent = `${prefix} ${q.question}　正確：${bank.marks[q.answer - 1]} ${q.options[q.answer - 1]}`;
    $('wrongs').appendChild(d);
  });
}

function reset() {
  $('quiz').classList.add('hide');
  $('result').classList.add('hide');
  $('setup').classList.remove('hide');
  renderBankSetup(currentBankKey);
}

$('again').onclick = reset;
renderBankSetup('baking');
</script>
</body>
</html>
