<style>
:root{--bg:#faf6f0;--card:#fff;--fg:#2b2622;--mute:#7a6f66;--accent:#b4622d;--ok:#2e7d4f;--okbg:#e5f4ea;--ng:#c0392b;--ngbg:#fbe9e6;--bd:#e4dacd}
@media(prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#2a2622;--fg:#f0e9e0;--mute:#a89d92;--accent:#e08a50;--ok:#6fcf97;--okbg:#1f3a2a;--ng:#ff8a7a;--ngbg:#432622;--bd:#443d36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=number]{width:110px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:1rem}
.chk{display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:400}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font-size:1rem;background:var(--accent);color:#fff}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.4;cursor:default}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog>div{height:100%;background:var(--accent);width:0}
.meta{color:var(--mute);font-size:.85rem;margin-bottom:6px}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--fg);border:1.5px solid var(--bd);margin-bottom:8px;padding:11px 14px;border-radius:10px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ng{background:var(--ngbg);border-color:var(--ng)}
.opt:disabled{opacity:1;cursor:default}
.fb{margin-top:10px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.note{color:var(--mute);font-size:.85rem;margin-top:6px}
.score{font-size:2.2rem;font-weight:700;color:var(--accent)}
.wrong{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
.hide{display:none}
.exp{margin-top:14px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--bg);border-radius:6px;font-size:.95rem}
.exp b{color:var(--accent)}
.exp img{display:block;max-width:100%;border-radius:8px;margin-top:10px}
</style>

<script>
const DATA = [{"id": "01-1", "section": "01", "sectionName": "產品分類", "no": 1, "question": "歐美流行之比薩─義大利發麵餅屬於？", "options": ["麵包項", "餅乾項", "中點項", "西點項"], "answer": 4, "note": "", "explanation": "題庫把歐美流行的比薩（義大利發麵餅）歸在「西點項」。雖然比薩餅皮是用酵母發酵的麵糰，但本題庫的產品分類以此為準，考試請依題庫答案記憶。另外要記得：比薩餅皮一般使用高筋麵粉（見第 10 題）。", "image": ""}, {"id": "01-2", "section": "01", "sectionName": "產品分類", "no": 2, "question": "下列何種產品不需經過油炸而成？", "options": ["開口笑", "沙其瑪", "道納司", "鬆餅"], "answer": 4, "note": "", "explanation": "開口笑、沙其瑪、道納司（甜甜圈）都是「油炸」製品；只有鬆餅（起酥）是以烤焙方式完成，靠麵糰與裹入油脂形成的層次，加熱後水蒸氣撐開膨脹。", "image": ""}, {"id": "01-3", "section": "01", "sectionName": "產品分類", "no": 3, "question": "最適合製作鮮奶油蛋糕及冰淇淋蛋糕是？", "options": ["麵糊類蛋糕", "乳沫類蛋糕", "戚風類蛋糕", "磅蛋糕"], "answer": 3, "note": "", "explanation": "戚風類蛋糕組織柔軟、濕潤，冷藏或冷凍後也不易乾硬變粗，所以最適合做成鮮奶油蛋糕與冰淇淋蛋糕。磅蛋糕（麵糊類）冷藏後會變硬；海綿蛋糕（乳沫類）也容易變乾。", "image": ""}, {"id": "01-4", "section": "01", "sectionName": "產品分類", "no": 4, "question": "那一種蛋糕之烤溫最低？", "options": ["輕奶油", "海綿蛋糕", "水果蛋糕", "天使蛋糕"], "answer": 3, "note": "", "explanation": "水果蛋糕含有大量果乾、蜜餞，體積大且配料重，必須用「低溫長時間」烤焙（約 150℃上下），才能烤透又不焦。輕奶油、海綿、天使蛋糕的烤溫都比它高。", "image": ""}, {"id": "01-5", "section": "01", "sectionName": "產品分類", "no": 5, "question": "同種蛋糕那一種麵糊的著色最深？", "options": ["低酸性", "中性", "鹼性", "強酸性"], "answer": 3, "note": "", "explanation": "麵糊的酸鹼值影響顏色：越偏鹼性，梅納反應與焦糖化越明顯，成品顏色越深；偏酸則顏色越淺。所以「鹼性」麵糊著色最深。魔鬼蛋糕加小蘇打呈深褐色就是這個原理。", "image": ""}, {"id": "01-6", "section": "01", "sectionName": "產品分類", "no": 6, "question": "那一種蛋糕麵糊理想比重最輕？", "options": ["海綿類", "戚風類", "麵糊類", "天使類"], "answer": 4, "note": "", "explanation": "天使蛋糕只用蛋白打發、不含蛋黃與油脂，麵糊含氣最多，所以比重最輕（約 0.35～0.40）。戚風約 0.45 左右，海綿約 0.46 左右，麵糊類（磅蛋糕）最重。", "image": ""}, {"id": "01-7", "section": "01", "sectionName": "產品分類", "no": 7, "question": "下列何種為硬式麵包？", "options": ["全麥麵包", "甜麵包", "可鬆麵包", "法國麵包"], "answer": 4, "note": "", "explanation": "硬式麵包的特徵是低糖、低油、外皮脆硬，法國麵包就是代表。全麥麵包、甜麵包、可鬆（吐司類柔軟）麵包都屬於軟式麵包。", "image": ""}, {"id": "01-8", "section": "01", "sectionName": "產品分類", "no": 8, "question": "何種蛋糕在攪拌前，蛋先予加溫到 40～43℃，使容易起泡及膨脹？", "options": ["輕奶油蛋糕", "重奶油蛋糕", "海綿蛋糕", "水果蛋糕"], "answer": 3, "note": "", "explanation": "海綿蛋糕的「熱拌法」是把全蛋與糖先隔水加溫到約 40～43℃，蛋液黏度降低，空氣容易打入、起泡快、體積大。輕奶油、重奶油、水果蛋糕屬麵糊類，不需要這樣加溫。", "image": ""}, {"id": "01-9", "section": "01", "sectionName": "產品分類", "no": 9, "question": "下列蛋糕配方中何者宜使用高筋麵粉？", "options": ["魔鬼蛋糕", "水果蛋糕", "果醬捲", "戚風蛋糕"], "answer": 2, "note": "", "explanation": "水果蛋糕裡有大量果乾、蜜餞，需要筋度較強的高筋麵粉來撐住這些重配料、避免果料下沉。魔鬼蛋糕、果醬捲、戚風蛋糕都要求柔軟，使用低筋麵粉。", "image": ""}, {"id": "01-10", "section": "01", "sectionName": "產品分類", "no": 10, "question": "下列何種產品一定要使用高筋麵粉？", "options": ["海綿蛋糕", "比薩餅", "白土司麵包", "天使蛋糕"], "answer": 3, "note": "", "explanation": "白土司要有大體積與細緻的組織，必須靠高筋麵粉形成的麵筋網狀結構包住發酵產生的氣體，所以一定要用高筋麵粉。海綿蛋糕、天使蛋糕用低筋麵粉；比薩餅皮雖常用高筋，但並非「一定」。", "image": ""}, {"id": "01-11", "section": "01", "sectionName": "產品分類", "no": 11, "question": "蛋糕依麵糊性質和膨大方法的不同可分為？", "options": ["二大類", "三大類", "四大類", "五大類"], "answer": 2, "note": "", "explanation": "蛋糕依麵糊性質與膨大方法分為三大類：麵糊類（靠油脂打入空氣加發粉）、乳沫類（靠蛋打發，如海綿蛋糕、天使蛋糕）、戚風類（蛋白打發加蛋黃麵糊）。", "image": ""}, {"id": "01-12", "section": "01", "sectionName": "產品分類", "no": 12, "question": "長崎蛋糕屬於？", "options": ["麵糊類蛋糕", "乳沫類蛋糕", "戚風類蛋糕", "重奶油蛋糕"], "answer": 2, "note": "", "explanation": "長崎蛋糕（卡斯提拉）以全蛋加糖打發為主，成分與作法類似海綿蛋糕，屬於乳沫類蛋糕。", "image": ""}, {"id": "01-13", "section": "01", "sectionName": "產品分類", "no": 13, "question": "配方中採用液體油脂可製作下列何種蛋糕？", "options": ["水果蛋糕", "重奶油蛋糕", "海綿蛋糕", "輕奶油蛋糕"], "answer": 3, "note": "", "explanation": "海綿蛋糕屬乳沫類，配方中的油脂可以用液體油（沙拉油）或融化奶油，在最後拌入麵糊。水果蛋糕、重奶油蛋糕、輕奶油蛋糕屬麵糊類，需用固態油脂打發。", "image": ""}, {"id": "01-14", "section": "01", "sectionName": "產品分類", "no": 14, "question": "下列何種產品配方中使用酵母，以利產品之膨脹？", "options": ["鬆餅", "酥鬆性小西餅", "綠豆椪", "丹麥式甜麵包"], "answer": 4, "note": "", "explanation": "丹麥式甜麵包是發酵麵糰，配方中用酵母發酵產生二氧化碳，再裹入油脂製作層次。鬆餅靠水蒸氣膨脹；酥鬆性小西餅靠油脂與發粉；綠豆椪的皮為油皮油酥，不使用酵母。", "image": ""}, {"id": "01-15", "section": "01", "sectionName": "產品分類", "no": 15, "question": "配方中採用高筋麵粉，比較適合製作下列何種產品？", "options": ["擠出小西餅", "魔鬼蛋糕", "法國麵包", "天使蛋糕"], "answer": 3, "note": "", "explanation": "法國麵包低糖低油，要靠麵筋支撐體積與咬勁，所以使用高筋麵粉。擠出小西餅、魔鬼蛋糕、天使蛋糕都要求鬆軟，用低筋麵粉。", "image": ""}, {"id": "01-16", "section": "01", "sectionName": "產品分類", "no": 16, "question": "歐美俗稱的磅蛋糕(pound cake)是屬於？", "options": ["戚風類蛋糕", "麵糊類蛋糕", "乳沫類蛋糕", "天使蛋糕"], "answer": 2, "note": "", "explanation": "磅蛋糕（pound cake）傳統上是麵粉、糖、油脂、蛋各一磅，是靠油脂與糖攪打進空氣的麵糊類蛋糕，屬重奶油蛋糕。", "image": ""}, {"id": "01-17", "section": "01", "sectionName": "產品分類", "no": 17, "question": "下列何種產品之麵糰是屬於發酵性麵糰？", "options": ["奶油小西餅", "蛋黃酥", "廣式月餅", "美式甜麵包"], "answer": 4, "note": "", "explanation": "發酵性麵糰是用酵母發酵的麵糰，美式甜麵包符合。奶油小西餅、蛋黃酥、廣式月餅的麵糰都不使用酵母發酵。", "image": ""}, {"id": "01-18", "section": "01", "sectionName": "產品分類", "no": 18, "question": "下列何種產品之麵糰，其配方中糖油含量最低？", "options": ["蘇打餅乾", "口糧餅乾", "戚風蛋糕", "海綿蛋糕"], "answer": 1, "note": "", "explanation": "蘇打餅乾是低糖低油的發酵餅乾，糖與油的比例在所有選項中最低，口感酥脆。戚風與海綿蛋糕的糖量都很高（糖約佔麵粉的 100%上下）。", "image": ""}, {"id": "01-19", "section": "01", "sectionName": "產品分類", "no": 19, "question": "下列何種產品，其麵糊須經加熱熬煮？", "options": ["廣式月餅", "太陽餅", "天使蛋糕", "奶油空心餅"], "answer": 4, "note": "", "explanation": "奶油空心餅（泡芙）的作法是先把水與油脂煮沸，再加入麵粉繼續加熱使澱粉糊化，之後再加蛋拌勻，所以麵糊須經加熱熬煮。月餅、太陽餅、天使蛋糕都不需這個步驟。", "image": ""}, {"id": "01-20", "section": "01", "sectionName": "產品分類", "no": 20, "question": "下列何種產品，以烘焙百分比而言，其配方中用蛋量超過 100％？", "options": ["麵包", "鬆餅", "中點", "蛋糕"], "answer": 4, "note": "", "explanation": "烘焙百分比是以麵粉為 100%。蛋糕（尤其海綿、戚風類）用蛋量常常等於或超過麵粉量，會超過 100%；麵包、鬆餅、中點的用蛋量都遠低於 100%。", "image": ""}, {"id": "01-21", "section": "01", "sectionName": "產品分類", "no": 21, "question": "下列何種產品，不需經烤焙過程？", "options": ["法國麵包", "戚風蛋糕", "奶油空心餅", "開口笑"], "answer": 4, "note": "", "explanation": "開口笑是油炸製品，不經烤焙。法國麵包、戚風蛋糕、奶油空心餅都需要進烤爐烘烤。", "image": ""}, {"id": "01-22", "section": "01", "sectionName": "產品分類", "no": 22, "question": "奶油雞蛋布丁派是屬於", "options": ["生派皮生派餡", "熟派皮熟派餡", "雙皮派", "油炸派"], "answer": 1, "note": "", "explanation": "奶油雞蛋布丁派是把生的派皮填入生的液態布丁餡，一起進烤爐烤熟，屬於「生派皮生派餡」。熟派皮熟派餡則是先烤好派皮、再填入煮熟的餡料（如檸檬派）。", "image": ""}, {"id": "01-23", "section": "01", "sectionName": "產品分類", "no": 23, "question": "牛肉派是屬於？", "options": ["生派皮生派餡", "熟派皮熟派餡", "雙皮派", "油炸派"], "answer": 3, "note": "", "explanation": "牛肉派上下各有一層派皮，把餡料包在中間，屬於雙皮派。", "image": ""}, {"id": "01-24", "section": "01", "sectionName": "產品分類", "no": 24, "question": "餅乾麵糰在攪拌終了階段不須產生麵筋的產品是？", "options": ["輥輪推壓小西餅", "硬質餅乾", "蘇打餅乾", "瑪莉餅乾"], "answer": 1, "note": "", "explanation": "輥輪推壓小西餅屬於酥性麵糰，糖油量高，攪拌時要避免出筋，才能保持酥鬆；蘇打、瑪莉、硬質餅乾則需要適度形成麵筋以便壓延成型。", "image": ""}, {"id": "01-25", "section": "01", "sectionName": "產品分類", "no": 25, "question": "餅乾麵糰在壓延成型時須考慮收縮比的產品為？", "options": ["煎餅", "蘇打餅乾", "乳沫類小西餅", "線切成型小西餅"], "answer": 2, "note": "", "explanation": "蘇打餅乾的麵糰有麵筋，壓延成麵片後會回縮，所以成型時要考慮收縮比（可打孔、作成波浪狀來減少收縮）。煎餅、乳沫類小西餅、線切小西餅都沒有這個問題。", "image": ""}, {"id": "01-26", "section": "01", "sectionName": "產品分類", "no": 26, "question": "依照製作方法，乳沫類小西餅是以下列何者方式成型？", "options": ["塊狀成型", "擠出成型", "線切成型", "推壓成型"], "answer": 2, "note": "", "explanation": "乳沫類小西餅（如貓舌餅）的麵糊較稀軟，要用擠花袋擠出成型。塊狀成型、線切、推壓成型則適用於較硬的麵糰。", "image": ""}, {"id": "01-27", "section": "01", "sectionName": "產品分類", "no": 27, "question": "以麵粉與油脂調製烘焙層次分明之鬆酥性產品是？", "options": ["小西餅", "脆餅", "煎餅", "鬆餅、派、起酥"], "answer": 4, "note": "", "explanation": "鬆餅、派、起酥是把麵粉與油脂調製成層次分明的鬆酥製品，靠油脂隔開麵糰形成層次，烤焙時膨脹、酥鬆。小西餅、脆餅、煎餅都沒有明顯層次。", "image": ""}, {"id": "01-28", "section": "01", "sectionName": "產品分類", "no": 28, "question": "小西餅配方中糖的用量比油多、油的用量比水多，麵糰較乾硬，須擀平或用模型壓出的產品是？", "options": ["軟性小西餅", "酥硬性小西餅", "鬆酥性小西餅", "脆硬性小西餅"], "answer": 4, "note": "", "explanation": "小西餅配方的比例為糖＞油＞水，麵糰乾硬、需擀平壓模，是「脆硬性小西餅」的特徵；糖越多越硬脆，油越多越酥鬆。", "image": ""}, {"id": "01-29", "section": "01", "sectionName": "產品分類", "no": 29, "question": "下列何者不適合用直接法攪拌？", "options": ["海綿小西餅", "奶油小西餅", "瑪琍餅乾", "調味餅乾"], "answer": 1, "note": "", "explanation": "海綿小西餅屬於乳沫類，必須先把蛋與糖打發，再拌入麵粉，不適合把材料一次倒入的直接法。奶油小西餅、瑪琍餅乾、調味餅乾都可用直接法。", "image": ""}, {"id": "01-30", "section": "01", "sectionName": "產品分類", "no": 30, "question": "台灣素食分類分為五大類下列哪一類不是在素食分類？", "options": ["奶素", "蛋奶素", "五辛素", "鍋邊素"], "answer": 4, "note": "", "explanation": "台灣素食分為五大類：全素（純素）、蛋素、奶素、蛋奶素、植物五辛素。「鍋邊素」是指用葷食的鍋具烹煮的素食，不屬於正式的素食分類。", "image": ""}, {"id": "02-1", "section": "02", "sectionName": "原料之選用", "no": 1, "question": "下列材料中，甜度最低的是？", "options": ["果糖", "砂糖", "麥芽糖", "乳糖"], "answer": 4, "note": "", "explanation": "各種糖的甜度（以蔗糖＝100）：果糖約 173、轉化糖漿約 120～130、砂糖 100、葡萄糖約 70～75、麥芽糖約 40～50、乳糖約 16～30。乳糖甜度最低，也不易被酵母發酵。", "image": ""}, {"id": "02-2", "section": "02", "sectionName": "原料之選用", "no": 2, "question": "台灣目前使用的白油，每桶重量約為", "options": ["5 公斤", "10 公斤", "16 公斤", "30 公斤"], "answer": 3, "note": "", "explanation": "台灣市售白油（烤酥油）一桶約 16 公斤，另有 4.5 公斤等小包裝，題庫以 16 公斤為準。", "image": ""}, {"id": "02-3", "section": "02", "sectionName": "原料之選用", "no": 3, "question": "奶粉的重量 2.2 磅相當於公制單位的？", "options": ["半公斤", "1 公斤", "1.5 公斤", "4.4 公斤"], "answer": 2, "note": "", "explanation": "1 公斤約等於 2.2 磅，所以 2.2 磅的奶粉就是 1 公斤。", "image": ""}, {"id": "02-4", "section": "02", "sectionName": "原料之選用", "no": 4, "question": "一般天使蛋糕的主要原料為？", "options": ["太白粉", "蛋白", "乳酪", "鮮奶油"], "answer": 2, "note": "", "explanation": "天使蛋糕不用蛋黃與油脂，主要靠大量蛋白打發起泡膨大，所以主原料是蛋白。", "image": ""}, {"id": "02-5", "section": "02", "sectionName": "原料之選用", "no": 5, "question": "派皮用的麵粉應以那種麵粉為宜？", "options": ["低筋粉", "中筋粉", "高筋粉", "太白粉"], "answer": 2, "note": "", "explanation": "派皮要有適度的筋度才擀得開，又要保持酥脆，所以使用中筋麵粉。低筋太軟易碎，高筋太韌。", "image": ""}, {"id": "02-6", "section": "02", "sectionName": "原料之選用", "no": 6, "question": "塔塔粉是屬？", "options": ["中性鹽", "酸性鹽", "鹼性鹽", "低鹼性鹽"], "answer": 2, "note": "", "explanation": "塔塔粉（酒石酸氫鉀）是酸性鹽，加入蛋白中能調整酸鹼度、增加蛋白泡沫的安定性，並使蛋糕色澤潔白。", "image": ""}, {"id": "02-7", "section": "02", "sectionName": "原料之選用", "no": 7, "question": "不需要使用酵母的烘焙產品是？", "options": ["包子", "饅頭", "麵包", "重奶油蛋糕"], "answer": 4, "note": "", "explanation": "重奶油蛋糕靠油脂與糖打入空氣，再加上蛋與發粉膨大，不需要酵母；包子、饅頭、麵包都使用酵母發酵。", "image": ""}, {"id": "02-8", "section": "02", "sectionName": "原料之選用", "no": 8, "question": "蛋黃中含量最多的成分？", "options": ["水", "油脂", "蛋白質", "灰分"], "answer": 1, "note": "", "explanation": "蛋黃約含 50％的水分、約 30％的油脂、約 16％蛋白質，水是含量最多的成分。", "image": ""}, {"id": "02-9", "section": "02", "sectionName": "原料之選用", "no": 9, "question": "蛋白成分除了水以外含量最多的是？", "options": ["油脂", "葡萄糖", "灰分", "蛋白質"], "answer": 4, "note": "", "explanation": "蛋白約 88％是水，其餘固形物絕大部分是蛋白質（約 10～11％），油脂幾乎為零，所以除水以外最多的是蛋白質。", "image": ""}, {"id": "02-10", "section": "02", "sectionName": "原料之選用", "no": 10, "question": "一般最適合於麵包製作的水是？", "options": ["軟水", "蒸餾水", "鹼水", "中硬度水"], "answer": 4, "note": "", "explanation": "麵包製作最適合中硬度的水（約 50～100 ppm）。太軟的水使麵糰發黏，太硬的水使麵筋過韌、發酵延緩。", "image": ""}, {"id": "02-11", "section": "02", "sectionName": "原料之選用", "no": 11, "question": "麵包配方中糖含量（依烘焙百分比）佔 20％以上的是？", "options": ["土司麵包", "法國麵包", "甜麵包", "全麥麵包"], "answer": 3, "note": "", "explanation": "甜麵包的糖量通常在 20％以上；吐司約 5～6％，法國麵包極低甚至為 0，全麥麵包也較低。", "image": ""}, {"id": "02-12", "section": "02", "sectionName": "原料之選用", "no": 12, "question": "一般以中種法製作麵包，中種麵糰的原料不含？", "options": ["鹽", "酵母", "麵粉", "水"], "answer": 1, "note": "", "explanation": "中種法的中種麵糰由部分麵粉、水、酵母（與改良劑）組成，鹽不放在中種，要在主麵糰才加入，避免抑制發酵。", "image": ""}, {"id": "02-13", "section": "02", "sectionName": "原料之選用", "no": 13, "question": "以下那一種原料不屬於化學膨大劑？", "options": ["發粉", "小蘇打", "酵母", "阿摩尼亞（碳酸氫銨）"], "answer": 3, "note": "", "explanation": "化學膨大劑包括發粉、小蘇打、阿摩尼亞（碳酸氫銨）；酵母是生物膨大劑（靠發酵產生二氧化碳）。", "image": ""}, {"id": "02-14", "section": "02", "sectionName": "原料之選用", "no": 14, "question": "無水奶油是來自於下列那種原料？", "options": ["牛肉", "豬肉", "牛奶", "植物油"], "answer": 3, "note": "", "explanation": "無水奶油（酥油）是由牛奶提煉出的乳脂肪，再去除水分製成。", "image": ""}, {"id": "02-15", "section": "02", "sectionName": "原料之選用", "no": 15, "question": "油脂麵粉與水先煮沸糊化之產品是？", "options": ["油條", "奶油空心餅", "甜麵包", "小西餅"], "answer": 2, "note": "", "explanation": "奶油空心餅（泡芙）是把油脂與水煮沸後加入麵粉，使麵粉澱粉糊化，再加蛋製成。", "image": ""}, {"id": "02-16", "section": "02", "sectionName": "原料之選用", "no": 16, "question": "下列烘焙用原料較不常使用的是？", "options": ["新鮮奶油", "全脂奶粉", "脫脂奶粉", "煉乳"], "answer": 4, "note": "", "explanation": "烘焙中新鮮奶油（動物性鮮奶油）、全脂奶粉、脫脂奶粉較常用；煉乳因甜度高、成本與用途有限，較不常用。", "image": ""}, {"id": "02-17", "section": "02", "sectionName": "原料之選用", "no": 17, "question": "下列那種油脂約含有 10％的氣體（氮氣）？", "options": ["清香油", "瑪琪琳", "雪白乳化油", "奶油"], "answer": 3, "note": "", "explanation": "雪白乳化油（白油）在製造時打入約 10％的氮氣，因此具有良好的打發性與乳化性。", "image": ""}, {"id": "02-18", "section": "02", "sectionName": "原料之選用", "no": 18, "question": "沒有分析檢驗的情況下，下列何者不是由外觀判斷油炸油的劣化？", "options": ["顏色加深", "黏度增加", "有蟹泡並提前冒煙", "酸價為 1.0"], "answer": 4, "note": "", "explanation": "油炸油劣化的外觀特徵為顏色加深、黏度增加、起蟹泡、提前冒煙。酸價 1.0 並不是外觀，需要分析檢驗才知道。", "image": ""}, {"id": "02-19", "section": "02", "sectionName": "原料之選用", "no": 19, "question": "麵包配方中何種材料添加愈多發酵愈快？", "options": ["油脂", "蛋黃", "酵母", "細砂糖"], "answer": 3, "note": "", "explanation": "酵母是發酵的主角，添加越多，產氣越快，發酵越快。糖在一定範圍內會促進發酵，但過量反而抑制；油脂與蛋黃無直接促進作用。", "image": ""}, {"id": "02-20", "section": "02", "sectionName": "原料之選用", "no": 20, "question": "國產麵粉每袋的重量以何種最多？", "options": ["22 磅", "30 磅", "22 公斤", "30 公斤"], "answer": 3, "note": "", "explanation": "國產麵粉每袋以 22 公斤為最多（另有 1 公斤、5 公斤等小包裝）。", "image": ""}, {"id": "02-21", "section": "02", "sectionName": "原料之選用", "no": 21, "question": "海綿蛋糕配方主要原料為？", "options": ["細砂糖、麵粉、鹽、牛奶", "麵粉、沙拉油、水", "麵粉、細砂糖、發粉", "麵粉、細砂糖、蛋"], "answer": 4, "note": "", "explanation": "海綿蛋糕是乳沫類蛋糕，基本配方只有麵粉、細砂糖與蛋三種主原料。", "image": ""}, {"id": "02-22", "section": "02", "sectionName": "原料之選用", "no": 22, "question": "下列何種材料可提高小西餅產品的脆性？", "options": ["鹽", "水", "糖", "蛋"], "answer": 3, "note": "", "explanation": "糖在烤焙中結晶、乾燥後使餅乾變得硬脆，是提高小西餅脆性的主要原料。", "image": ""}, {"id": "02-23", "section": "02", "sectionName": "原料之選用", "no": 23, "question": "若用快速酵母粉取代新鮮酵母時，快速酵母粉的用量應為新鮮酵母的？", "options": ["等量", "1/3", "1/2", "2 倍"], "answer": 2, "note": "", "explanation": "快速（即發）酵母粉活力較強，用量約為新鮮酵母的 1/3。", "image": ""}, {"id": "02-24", "section": "02", "sectionName": "原料之選用", "no": 24, "question": "製作某種麵包，使用新鮮酵母 4％，今因某種原因需改用快速即發酵母粉，用量應為？", "options": ["4％", "2％", "1.6％", "1.33％"], "answer": 4, "note": "", "explanation": "即發酵母粉用量約為新鮮酵母的 1/3：4％ × 1/3 ≈ 1.33％。", "image": ""}, {"id": "02-25", "section": "02", "sectionName": "原料之選用", "no": 25, "question": "配方內使用 60％鮮奶製作麵包，比用 4％的脫脂奶粉作麵包，其實際奶粉固形量？", "options": ["較少", "相同", "較多", "大同小異"], "answer": 3, "note": "", "explanation": "鮮奶約含 12％固形物，60％鮮奶中的奶粉固形物約為 60％ × 12％＝ 7.2％，比 4％的脫脂奶粉多。", "image": ""}, {"id": "02-26", "section": "02", "sectionName": "原料之選用", "no": 26, "question": "下列何種原料不是製作奶油布丁派餡之凝凍原料？", "options": ["蛋", "動物膠", "玉米澱粉", "奶油水"], "answer": 4, "note": "", "explanation": "奶油布丁派餡的凝凍靠蛋、動物膠（吉利丁）與玉米澱粉；「奶油水」不是凝凍原料。", "image": ""}, {"id": "02-27", "section": "02", "sectionName": "原料之選用", "no": 27, "question": "蛋白在烘焙原料中屬於那一種性質？", "options": ["柔性原料", "韌性原料", "酸性原料", "中性原料"], "answer": 2, "note": "", "explanation": "蛋白含有大量蛋白質，能增加結構、使產品較有韌性，屬於「韌性原料」。", "image": ""}, {"id": "02-28", "section": "02", "sectionName": "原料之選用", "no": 28, "question": "蛋白的含水量為？", "options": ["50％", "75％", "88％", "95％"], "answer": 3, "note": "", "explanation": "蛋白含水量約 88％。", "image": ""}, {"id": "02-29", "section": "02", "sectionName": "原料之選用", "no": 29, "question": "巧克力融化加熱方式，最好使用？", "options": ["直火加熱", "隔水加熱", "烤爐加熱", "自然融化"], "answer": 2, "note": "", "explanation": "巧克力怕高溫與焦化，應「隔水加熱」，溫度控制在約 40～50℃，直火或烤爐加熱容易燒焦、油水分離。", "image": ""}, {"id": "02-30", "section": "02", "sectionName": "原料之選用", "no": 30, "question": "蛋黃成分中所含的油脂具有", "options": ["乳化作用", "起泡作用", "安定作用", "膨大作用"], "answer": 1, "note": "", "explanation": "蛋黃中含有卵磷脂，是天然乳化劑，所以蛋黃的油脂具有乳化作用。", "image": ""}, {"id": "02-31", "section": "02", "sectionName": "原料之選用", "no": 31, "question": "製作蛋糕時，奶粉應屬於？", "options": ["柔性材料", "鹼性材料", "韌性材料", "芳香材料"], "answer": 3, "note": "", "explanation": "奶粉含蛋白質，能增加組織結構與強度，屬於韌性原料。", "image": ""}, {"id": "02-32", "section": "02", "sectionName": "原料之選用", "no": 32, "question": "奶水中含固形物（奶粉）量為？", "options": ["4％", "8％", "12％", "16％"], "answer": 3, "note": "", "explanation": "奶水（鮮乳）固形物約 12％，其餘約 88％是水。", "image": ""}, {"id": "02-33", "section": "02", "sectionName": "原料之選用", "no": 33, "question": "做蘇打餅乾應注意油脂的？", "options": ["安定性好、不易酸敗", "打發性好", "乳化效果好", "可塑性好"], "answer": 1, "note": "", "explanation": "蘇打餅乾要貯存較久，所以油脂的安定性要好、不易酸敗。", "image": ""}, {"id": "02-34", "section": "02", "sectionName": "原料之選用", "no": 34, "question": "蒸發奶水含固形物為？", "options": ["40％", "35％", "30％", "26％"], "answer": 4, "note": "", "explanation": "蒸發奶水（奶水）濃縮約為鮮奶的一半，固形物約 26％。", "image": ""}, {"id": "02-35", "section": "02", "sectionName": "原料之選用", "no": 35, "question": "麵包配方使用 2％的細砂糖如將糖量增加至 4％，則發酵時間會？", "options": ["縮短很多", "縮短很少", "延長", "不變"], "answer": 4, "note": "", "explanation": "糖在麵包中 2％～4％的差別很小，酵母可利用的糖已足夠，發酵時間幾乎不變。糖量超過約 5％才會明顯影響。", "image": ""}, {"id": "02-36", "section": "02", "sectionName": "原料之選用", "no": 36, "question": "麵包配方中正常用糖量如從 5％增加為 10％，則烤好後的麵包最明顯的不同是？", "options": ["表皮顏色變淺", "表皮變薄而軟", "表皮顏色加深", "表皮變粗糙"], "answer": 3, "note": "", "explanation": "糖越多，烤焙時越容易焦糖化與梅納反應，表皮顏色越深。", "image": ""}, {"id": "02-37", "section": "02", "sectionName": "原料之選用", "no": 37, "question": "做麵包時配方中油脂量高，可使麵包表皮？", "options": ["顏色深", "厚", "柔軟", "硬"], "answer": 3, "note": "", "explanation": "油脂能潤滑麵筋，使表皮與內部組織較柔軟。", "image": ""}, {"id": "02-38", "section": "02", "sectionName": "原料之選用", "no": 38, "question": "蛋黃之水分含量為", "options": ["30～34％", "35～39％", "40～44％", "50～55％"], "answer": 4, "note": "", "explanation": "蛋黃含水量約 50～55％。", "image": ""}, {"id": "02-39", "section": "02", "sectionName": "原料之選用", "no": 39, "question": "一般奶油或瑪琪琳含水量約為", "options": ["6～10％", "11～13％", "14～22％", "24～30％"], "answer": 3, "note": "", "explanation": "奶油與瑪琪琳含水量約 14～22％（一般約 16％左右）。", "image": ""}, {"id": "02-40", "section": "02", "sectionName": "原料之選用", "no": 40, "question": "乳化劑在蛋糕中的功能是？", "options": ["使蛋糕風味佳", "使蛋糕顏色加深", "融和配方內水和油使組織細膩", "縮短攪拌時間減少人工"], "answer": 3, "note": "", "explanation": "乳化劑能讓水與油融合，使蛋糕組織更細膩、體積更大，也有延緩老化的效果。", "image": ""}, {"id": "02-41", "section": "02", "sectionName": "原料之選用", "no": 41, "question": "麵粉中添加活性麵筋粉每增加 1％時，則麵粉之吸水量約可提高？", "options": ["1％", "1.5％", "2％", "2.5％"], "answer": 2, "note": "", "explanation": "活性麵筋粉增加 1％，麵粉吸水量約提高 1.5％。", "image": ""}, {"id": "02-42", "section": "02", "sectionName": "原料之選用", "no": 42, "question": "新鮮酵母(compressed yeast)水分含量約為？", "options": ["45～50％", "55～60％", "65～70％", "80～85％"], "answer": 3, "note": "", "explanation": "新鮮酵母（壓縮酵母）含水量約 65～70％。", "image": ""}, {"id": "02-43", "section": "02", "sectionName": "原料之選用", "no": 43, "question": "一般烘焙人員所稱的「重曹」(baking soda)是指？", "options": ["發粉", "蘇打粉", "酵母", "酵素"], "answer": 2, "note": "", "explanation": "「重曹」是日本俗稱，即碳酸氫鈉（小蘇打、蘇打粉）。", "image": ""}, {"id": "02-44", "section": "02", "sectionName": "原料之選用", "no": 44, "question": "沙拉油必須密封保存，是因為？", "options": ["遇空氣易於變色", "含不飽和脂肪酸易受氧化酸敗", "易揮發", "易感染其他不良味道"], "answer": 2, "note": "", "explanation": "沙拉油含不飽和脂肪酸，容易與氧氣作用而氧化酸敗，所以要密封保存。", "image": ""}, {"id": "02-45", "section": "02", "sectionName": "原料之選用", "no": 45, "question": "雞蛋中水分含量？", "options": ["70％", "75％", "80％", "85％"], "answer": 2, "note": "", "explanation": "全蛋含水量約 75％。", "image": ""}, {"id": "02-46", "section": "02", "sectionName": "原料之選用", "no": 46, "question": "乳化劑在麵包中的功能？", "options": ["增加麵包風味", "使麵包柔軟不易老化", "防止麵包發黴", "促進酵母活力"], "answer": 2, "note": "", "explanation": "乳化劑能與澱粉結合，使麵包組織柔軟、延緩老化。", "image": ""}, {"id": "02-47", "section": "02", "sectionName": "原料之選用", "no": 47, "question": "全蛋的固形物為？", "options": ["10％", "15％", "25％", "35％"], "answer": 3, "note": "", "explanation": "全蛋固形物約 25％，水分約 75％。", "image": ""}, {"id": "02-48", "section": "02", "sectionName": "原料之選用", "no": 48, "question": "麵包的組織鬆軟好吃，主要是在製作的過程中加入了？", "options": ["酵母", "發粉", "小蘇打", "阿摩尼亞（碳酸氫銨等）"], "answer": 1, "note": "", "explanation": "麵包鬆軟是靠酵母發酵產生二氧化碳，使麵糰膨脹。發粉、小蘇打、阿摩尼亞則用於蛋糕、餅乾等。", "image": ""}, {"id": "02-49", "section": "02", "sectionName": "原料之選用", "no": 49, "question": "要使麵包長時間保持柔軟，可在配方內添加", "options": ["膨大劑", "麥芽酵素", "乳化劑", "丙酸鈣"], "answer": 3, "note": "", "explanation": "乳化劑可使麵包柔軟並延緩老化。膨大劑、麥芽酵素效果有限；丙酸鈣是防腐劑，主要抑制黴菌。", "image": ""}, {"id": "02-50", "section": "02", "sectionName": "原料之選用", "no": 50, "question": "控制發酵最有效的原料是？", "options": ["食鹽", "糖", "改良劑", "奶粉"], "answer": 1, "note": "", "explanation": "鹽能抑制酵母的活性，是控制發酵速度最有效的原料。", "image": ""}, {"id": "02-51", "section": "02", "sectionName": "原料之選用", "no": 51, "question": "稀釋奶油霜飾最適當的原料是", "options": ["沙拉油", "水", "蛋", "稀糖漿"], "answer": 4, "note": "", "explanation": "奶油霜飾太稠時，用稀糖漿稀釋，可保持甜度與光滑。加水、沙拉油或蛋都不適合。", "image": ""}, {"id": "02-52", "section": "02", "sectionName": "原料之選用", "no": 52, "question": "一般油炸用油發煙點應在？", "options": ["150～160℃", "160～170℃", "170～180℃", "200℃以上"], "answer": 4, "note": "", "explanation": "油炸用油發煙點要高，一般應在 200℃以上，才能在 180～190℃的炸溫下安全使用。", "image": ""}, {"id": "02-53", "section": "02", "sectionName": "原料之選用", "no": 53, "question": "為使小西餅達到鬆脆與擴展的目的，配方內可多使用？", "options": ["細砂糖", "糖粉", "糖漿", "麥芽糖"], "answer": 1, "note": "", "explanation": "細砂糖顆粒粗、不易溶解，烤焙時在餅體中形成擴展與酥脆質地；糖粉、糖漿容易溶解，使餅乾較不擴展。", "image": ""}, {"id": "02-54", "section": "02", "sectionName": "原料之選用", "no": 54, "question": "製作水果蛋糕應選用？", "options": ["新鮮水果", "罐頭水果", "蜜餞水果", "脫水水果"], "answer": 3, "note": "", "explanation": "水果蛋糕使用蜜餞水果（糖漬果乾），含糖量高、不易出水，不會影響麵糊；新鮮與罐頭水果水分太多。", "image": ""}, {"id": "02-55", "section": "02", "sectionName": "原料之選用", "no": 55, "question": "一般西點派皮或蛋糕用的奶酥底，配方內油脂應用？", "options": ["無水奶油或精製豬油", "瑪琪琳", "含水奶油", "沙拉油"], "answer": 1, "note": "", "explanation": "派皮或奶酥底需要酥、脆，所以用無水奶油或精製豬油（固態、不含水的油脂）；含水油脂易使麵糰出筋、變硬。", "image": ""}, {"id": "02-56", "section": "02", "sectionName": "原料之選用", "no": 56, "question": "做蘋果派餡的膠凍原料，通常採用？", "options": ["玉米澱粉", "動物膠", "洋菜粉", "甘藷粉"], "answer": 1, "note": "", "explanation": "蘋果派餡常用玉米澱粉作膠凍原料，加熱後透明、具黏稠度，成本低。", "image": ""}, {"id": "02-57", "section": "02", "sectionName": "原料之選用", "no": 57, "question": "食品工廠用的油炸用油最好選用？", "options": ["沙拉油", "氫化油", "黃豆油", "奶油"], "answer": 2, "note": "", "explanation": "食品工廠油炸通常使用氫化油（炸油），耐高溫、安定性好；沙拉油、奶油的發煙點與安定性較差。", "image": ""}, {"id": "02-58", "section": "02", "sectionName": "原料之選用", "no": 58, "question": "麵包可使用的防腐劑為？", "options": ["丙酸鈣", "去水醋酸", "硼酸", "苯甲酸"], "answer": 1, "note": "", "explanation": "麵包可用的防腐劑為丙酸鈣，專門抑制麵包黴菌。蛋糕可用丙酸鈉。", "image": ""}, {"id": "02-59", "section": "02", "sectionName": "原料之選用", "no": 59, "question": "蛋糕可使用的防腐劑為？", "options": ["苯甲酸", "丙酸鈉", "對羥苯甲酸丁酯", "異抗壞血酸"], "answer": 2, "note": "", "explanation": "蛋糕（及部分糕餅）可使用的防腐劑為丙酸鈉。苯甲酸、對羥苯甲酸丁酯不可用在蛋糕；異抗壞血酸是抗氧化劑。", "image": ""}, {"id": "02-60", "section": "02", "sectionName": "原料之選用", "no": 60, "question": "新鮮酵母貯存的最佳溫度為？", "options": ["-10～0℃", "2～10℃", "11～20℃", "21～27℃"], "answer": 2, "note": "", "explanation": "新鮮酵母需冷藏，最佳貯存溫度約 2～10℃（一般 4℃左右），溫度太高會失活。", "image": ""}, {"id": "02-61", "section": "02", "sectionName": "原料之選用", "no": 61, "question": "製作麩皮或裸麥麵包，其主要原料的麵粉為何？", "options": ["高筋麵粉", "洗筋粉", "粉心粉", "低筋麵粉"], "answer": 1, "note": "", "explanation": "麩皮與裸麥麵包本身麵筋少，需使用高筋麵粉補強筋度，才能得到足夠的體積。", "image": ""}, {"id": "02-62", "section": "02", "sectionName": "原料之選用", "no": 62, "question": "下列那一種油脂其烤酥性最大？", "options": ["純奶油", "人造奶油", "豬油", "雪白油"], "answer": 3, "note": "", "explanation": "豬油的可塑性與烤酥性（shortening power）最好，常用於製作酥脆的點心。", "image": ""}, {"id": "02-63", "section": "02", "sectionName": "原料之選用", "no": 63, "question": "製作天使蛋糕時塔塔粉與鹽的用量總和為何？", "options": ["0.1％", "1％", "5％", "10％"], "answer": 2, "note": "", "explanation": "天使蛋糕中塔塔粉與鹽的用量總和約 1％（塔塔粉約 0.5～0.6％、鹽約 0.5％）。", "image": ""}, {"id": "02-64", "section": "02", "sectionName": "原料之選用", "no": 64, "question": "下列那一種糖的甜度最高？", "options": ["果糖", "轉化糖漿", "砂糖", "葡萄糖"], "answer": 1, "note": "", "explanation": "果糖是常見糖類中甜度最高的，約為蔗糖的 1.7 倍。", "image": ""}, {"id": "02-65", "section": "02", "sectionName": "原料之選用", "no": 65, "question": "製做丹麥麵包或鬆餅，其裹入用油脂應採用？", "options": ["豬油", "雪白奶油", "白油（烤酥油）", "瑪琪琳"], "answer": 4, "note": "", "explanation": "丹麥麵包與鬆餅需要能擀、可延展的固態油脂，所以裹入油脂用瑪琪琳（人造奶油），可塑性高、熔點適中。", "image": ""}, {"id": "02-66", "section": "02", "sectionName": "原料之選用", "no": 66, "question": "麵粉如因貯存太久筋性受損，在做麵包時可酌量在配方內？", "options": ["增加鹽的用量", "減少糖的用量", "使用脫脂奶粉", "增加乳化劑"], "answer": 3, "note": "", "explanation": "麵粉筋性受損時，麵糰發酵時氣體保留性差，可添加脫脂奶粉增加蛋白質，補強麵糰的結構。", "image": ""}, {"id": "02-67", "section": "02", "sectionName": "原料之選用", "no": 67, "question": "製作高成分奶油海綿蛋糕為降低麵粉的筋性，配方內部分麵粉最好用？", "options": ["全脂奶粉", "太白粉", "小麥澱粉", "乳清粉 代替"], "answer": 3, "note": "", "explanation": "小麥澱粉不含麵筋，用來取代部分麵粉可降低整體筋性，使海綿蛋糕更鬆軟。", "image": ""}, {"id": "02-68", "section": "02", "sectionName": "原料之選用", "no": 68, "question": "乳化油在下列那一項產品較不合適添加？", "options": ["戚風蛋糕", "麵包", "海綿蛋糕", "奶油霜飾"], "answer": 1, "note": "", "explanation": "乳化油（蛋糕油）會使泡沫更安定、組織更細，戚風蛋糕本來靠蛋白打發，加乳化油會使蛋白不穩定，較不合適。", "image": ""}, {"id": "02-69", "section": "02", "sectionName": "原料之選用", "no": 69, "question": "蛋糕所用的發粉應為？", "options": ["快性發粉", "次快性發粉", "雙重反應發粉", "慢性發粉"], "answer": 3, "note": "", "explanation": "蛋糕要膨脹均勻，使用雙重反應發粉：室溫下先釋出部分氣體，進爐加熱後再釋出剩餘氣體。", "image": ""}, {"id": "02-70", "section": "02", "sectionName": "原料之選用", "no": 70, "question": "欲增加小西餅鬆酥的性質可酌量增加？", "options": ["水", "油", "糖", "高筋麵粉"], "answer": 2, "note": "", "explanation": "油脂能隔絕麵粉顆粒、阻止出筋，使小西餅更鬆酥；糖增加脆度，水與高筋麵粉則使組織變硬。", "image": ""}, {"id": "02-71", "section": "02", "sectionName": "原料之選用", "no": 71, "question": "依 CNS 所謂全麥麵包，其全麥麵粉的用量應為？", "options": ["20％", "30％", "40％", "50％ 以上"], "answer": 1, "note": "", "explanation": "依 CNS 規定，全麥麵包中全麥麵粉用量需在 20％以上。", "image": ""}, {"id": "02-72", "section": "02", "sectionName": "原料之選用", "no": 72, "question": "使用蒸發奶水代替鮮奶時，應照鮮奶用量？", "options": ["等量使用", "1/3 蒸發奶水加 2/3 水", "2/3 蒸發奶水加 1/3 水", "1/2 蒸發奶水加 1/2 水"], "answer": 4, "note": "", "explanation": "鮮奶約含 12％固形物，蒸發奶水固形物約 26％，約為鮮奶的兩倍，所以 1/2 蒸發奶水加 1/2 水即可替代鮮奶。", "image": ""}, {"id": "02-73", "section": "02", "sectionName": "原料之選用", "no": 73, "question": "欲生產良好的烘焙產品下列條件何者不是？", "options": ["好的原料", "純熟的技術", "好的設備", "好的裝潢"], "answer": 4, "note": "", "explanation": "好的烘焙產品需要好的原料、純熟的技術和好的設備；店面裝潢與產品品質本身無直接關係。", "image": ""}, {"id": "02-74", "section": "02", "sectionName": "原料之選用", "no": 74, "question": "夾心餅乾之夾心用油脂，通常須要數個月之保存、流通因此宜使用？", "options": ["花生油", "沙拉油", "葵花油", "椰子油"], "answer": 4, "note": "", "explanation": "夾心餅乾的內餡要久放不酸敗，需使用安定性高的飽和脂肪，椰子油（飽和脂肪酸多）最適合。", "image": ""}, {"id": "02-75", "section": "02", "sectionName": "原料之選用", "no": 75, "question": "烘焙用油脂的融點愈高，其口溶性？", "options": ["愈好", "愈差", "無關", "差不多"], "answer": 2, "note": "", "explanation": "油脂熔點越高，在口中越不易融化，口溶性越差。", "image": ""}, {"id": "02-76", "section": "02", "sectionName": "原料之選用", "no": 76, "question": "食品衛生管理法規定烘焙油脂中合成抗氧化劑的總量不得超過", "options": ["50ppm", "200ppm", "400ppm", "0.1％"], "answer": 2, "note": "", "explanation": "依食品衛生法規，烘焙油脂中合成抗氧化劑的總量不得超過 200 ppm。", "image": ""}, {"id": "02-77", "section": "02", "sectionName": "原料之選用", "no": 77, "question": "麵粉之蛋白質組成成分中缺乏？", "options": ["丙苯胺酸", "離胺酸", "麩胺酸", "半胱胺酸 因此必須添加奶粉"], "answer": 2, "note": "", "explanation": "麵粉蛋白質缺乏離胺酸（必需胺基酸），所以要添加富含離胺酸的奶粉來補充。", "image": ""}, {"id": "02-78", "section": "02", "sectionName": "原料之選用", "no": 78, "question": "不是派餡用來做膠凍原料有？", "options": ["玉米澱粉", "動物膠", "雞蛋", "果膠"], "answer": 4, "note": "", "explanation": "派餡的膠凍原料有玉米澱粉、動物膠、果膠等；雞蛋是凝固蛋白質，而非膠凍原料。", "image": ""}, {"id": "02-79", "section": "02", "sectionName": "原料之選用", "no": 79, "question": "製作蛋糕道納司所使用之膨脹劑是？", "options": ["酵母", "發粉(B.P)", "油脂", "小蘇打(B.S)"], "answer": 2, "note": "", "explanation": "蛋糕道納司（蛋糕油炸甜圈餅）是用發粉當膨大劑，不使用酵母。", "image": ""}, {"id": "02-80", "section": "02", "sectionName": "原料之選用", "no": 80, "question": "製作蛋白霜飾所需要之主原料是", "options": ["蛋黃", "全蛋", "蛋白和糖", "蛋黃和糖"], "answer": 3, "note": "", "explanation": "蛋白霜飾以蛋白與糖打發而成，主原料是蛋白和糖。", "image": ""}, {"id": "02-81", "section": "02", "sectionName": "原料之選用", "no": 81, "question": "一個中型雞蛋去殼後約重？", "options": ["50 公克", "70 公克", "80 公克", "100 公克"], "answer": 1, "note": "", "explanation": "中型雞蛋去殼後約重 50 公克（連殼約 55～60 公克）。", "image": ""}, {"id": "02-82", "section": "02", "sectionName": "原料之選用", "no": 82, "question": "麵粉中的蛋白質每增加 1％，則吸水量約增加？", "options": ["2％", "4％", "6％", "不變"], "answer": 1, "note": "", "explanation": "麵粉蛋白質每增加 1％，吸水量約增加 1.5～2％；題庫以 2％為準。", "image": ""}, {"id": "02-83", "section": "02", "sectionName": "原料之選用", "no": 83, "question": "製作轉化糖漿使用何種糖原料？", "options": ["葡萄糖", "砂糖", "麥芽糖", "乳糖"], "answer": 2, "note": "", "explanation": "轉化糖漿是以砂糖（蔗糖）加水、加酸加熱，水解成葡萄糖與果糖而成。", "image": ""}, {"id": "02-84", "section": "02", "sectionName": "原料之選用", "no": 84, "question": "烘焙用乾酪(Cheese)原料，其主要的組成成分為？", "options": ["灰粉", "澱粉", "蛋白質", "醣"], "answer": 3, "note": "", "explanation": "乾酪（起司）是以牛奶的酪蛋白為主凝固製成，主要成分是蛋白質。", "image": ""}, {"id": "02-85", "section": "02", "sectionName": "原料之選用", "no": 85, "question": "烘焙產品使用何者糖，在其烤焙時較易產生梅納反應？", "options": ["果糖", "砂糖", "麥芽糖", "乳糖"], "answer": 1, "note": "", "explanation": "果糖是還原糖，且反應性比葡萄糖、麥芽糖更高，烤焙時最容易產生梅納反應（褐變）。砂糖是非還原糖，需先水解。", "image": ""}, {"id": "02-86", "section": "02", "sectionName": "原料之選用", "no": 86, "question": "下列何種油脂含有反式脂肪酸？", "options": ["麻油", "花生油", "牛油", "完全氫化植物油"], "answer": 3, "note": "", "explanation": "牛油為天然含有少量反式脂肪酸的動物油脂；完全氫化植物油反而不含反式脂肪酸（部分氫化才會產生）。", "image": ""}, {"id": "02-87", "section": "02", "sectionName": "原料之選用", "no": 87, "question": "下列材料中何者不屬於膨脹劑？", "options": ["發粉", "阿摩尼亞", "可可粉", "小蘇打粉"], "answer": 3, "note": "", "explanation": "發粉、阿摩尼亞、小蘇打是膨脹劑，可可粉是風味與色素原料，不屬於膨脹劑。", "image": ""}, {"id": "02-88", "section": "02", "sectionName": "原料之選用", "no": 88, "question": "下列何種小麥適合製作海綿蛋糕？", "options": ["硬紅春麥", "硬紅冬麥", "軟質小麥", "杜蘭小麥"], "answer": 3, "note": "", "explanation": "軟質小麥蛋白質低、筋性弱，磨成低筋麵粉，適合做海綿蛋糕。", "image": ""}, {"id": "02-89", "section": "02", "sectionName": "原料之選用", "no": 89, "question": "下列何種性質不是為小麥分類的依據？", "options": ["蛋白質", "吸水量", "麵筋品質", "破損澱粉"], "answer": 4, "note": "", "explanation": "小麥分類的依據包括蛋白質含量、吸水量、麵筋品質；破損澱粉不是分類依據。", "image": ""}, {"id": "02-90", "section": "02", "sectionName": "原料之選用", "no": 90, "question": "小麥胚乳的主要色素為？", "options": ["葉綠素", "葉紅素", "葉黃素", "胡蘿蔔素"], "answer": 4, "note": "", "explanation": "小麥胚乳的色素為胡蘿蔔素類，麵粉未漂白時呈淡黃色。（題庫答案為胡蘿蔔素）", "image": ""}, {"id": "02-91", "section": "02", "sectionName": "原料之選用", "no": 91, "question": "胚乳約佔整個小麥穀粒的？", "options": ["75%", "83%", "92%", "100%"], "answer": 2, "note": "", "explanation": "小麥穀粒中胚乳約佔 83％、麩皮約 14％、胚芽約 2.5％。", "image": ""}, {"id": "02-92", "section": "02", "sectionName": "原料之選用", "no": 92, "question": "下列何者為小麥製粉主要的目的？", "options": ["熟成", "漂白", "使麩皮、胚芽與胚乳部分分離", "增加彈性"], "answer": 3, "note": "", "explanation": "製粉的主要目的是把麩皮、胚芽與胚乳分離，取得麵粉。", "image": ""}, {"id": "02-93", "section": "02", "sectionName": "原料之選用", "no": 93, "question": "小麥胚芽中富含油脂，其主要之脂肪酸為？", "options": ["油酸", "亞麻仁油酸", "次亞麻仁油酸", "花生四烯酸"], "answer": 2, "note": "", "explanation": "小麥胚芽油中含大量亞麻仁油酸（亞麻油酸），為不飽和脂肪酸，所以胚芽容易酸敗。（題庫答案）", "image": ""}, {"id": "02-94", "section": "02", "sectionName": "原料之選用", "no": 94, "question": "小麥製粉時，與其出粉率成正比者為？", "options": ["水分含量", "灰分含量", "蛋白質含量", "醣含量"], "answer": 2, "note": "", "explanation": "出粉率越高，混入的麩皮與胚芽越多，灰分含量越高，所以灰分與出粉率成正比。", "image": ""}, {"id": "02-95", "section": "02", "sectionName": "原料之選用", "no": 95, "question": "麵粉中添加維生素 C 作為改良劑之主要效用為？", "options": ["熟成作用", "漂白作用", "熟成及漂白作用", "殺菌作用"], "answer": 1, "note": "", "explanation": "麵粉中加維生素 C 為氧化型熟成劑，用於改良麵筋，提升麵糰的氣體保留，不是用來漂白。", "image": ""}, {"id": "02-96", "section": "02", "sectionName": "原料之選用", "no": 96, "question": "蛋糕用麵粉一般由何種麥所磨製？", "options": ["硬紅春麥", "硬紅冬麥", "琥珀色硬質小麥", "軟質冬麥"], "answer": 4, "note": "", "explanation": "蛋糕用麵粉（低筋）由軟質冬麥磨製。", "image": ""}, {"id": "02-97", "section": "02", "sectionName": "原料之選用", "no": 97, "question": "食品用水溶於油（W／O)之乳化劑，其親水親油平衡值（HLB：Hydrophilic - Lipophilic Balance value）之範圍介於？", "options": ["3.5～6", "8～18", "20～25", "26～30"], "answer": 1, "note": "", "explanation": "W／O（油包水）的乳化劑親油性強，HLB 值低，約 3.5～6。", "image": ""}, {"id": "02-98", "section": "02", "sectionName": "原料之選用", "no": 98, "question": "食品用油溶於水（O/W）之乳化劑，其親水親油平衡值（HLB：Hydrophilic - Lipophilic Balance value）之範圍介於？", "options": ["3.5～6", "8～18", "20～25", "26～30"], "answer": 2, "note": "", "explanation": "O／W（水包油）的乳化劑親水性強，HLB 值較高，約 8～18。", "image": ""}, {"id": "02-99", "section": "02", "sectionName": "原料之選用", "no": 99, "question": "製作海綿蛋糕添加乳化起泡劑目的為？", "options": ["使麵糊的比重上升", "增加麵糊的安定性", "於攪拌時拌入較少的空氣", "使蛋糕體積變小"], "answer": 2, "note": "", "explanation": "海綿蛋糕添加乳化起泡劑（蛋糕油），可增加麵糊的安定性，使泡沫不易消失，縮短攪拌時間。", "image": ""}, {"id": "02-100", "section": "02", "sectionName": "原料之選用", "no": 100, "question": "製作轉化糖漿，以下列何者為原料，加水溶解再加入稀酸、加熱使之轉化的液體糖？", "options": ["乳糖", "砂糖", "麥芽糖", "蜂蜜"], "answer": 2, "note": "", "explanation": "轉化糖漿是由砂糖加水溶解後，加稀酸加熱使其轉化（水解）成葡萄糖與果糖而成。", "image": ""}, {"id": "02-101", "section": "02", "sectionName": "原料之選用", "no": 101, "question": "製作轉化糖漿時，以下列何種酸水解得到之品質最佳？", "options": ["鹽酸", "硫酸", "磷酸", "酒石酸"], "answer": 4, "note": "", "explanation": "製作轉化糖漿常用酒石酸，得到的品質最佳；鹽酸、硫酸、磷酸會產生異味或影響品質。", "image": ""}, {"id": "02-102", "section": "02", "sectionName": "原料之選用", "no": 102, "question": "雞蛋蛋白的脂肪含量為？", "options": ["0％", "10％", "20％", "30％"], "answer": 1, "note": "", "explanation": "蛋白幾乎全是水與蛋白質，脂肪含量為 0％。", "image": ""}, {"id": "02-103", "section": "02", "sectionName": "原料之選用", "no": 103, "question": "使用脫脂奶粉代替奶水時，脫脂奶粉對水混合的比例應為？", "options": ["1：99", "10：90", "20：80", "30：70"], "answer": 2, "note": "", "explanation": "脫脂奶粉：水＝ 10：90，混合後可代替奶水（鮮奶）。", "image": ""}, {"id": "02-104", "section": "02", "sectionName": "原料之選用", "no": 104, "question": "裝飾用鮮奶油加入牛奶攪拌時，牛奶溫度必須保持在多少以下，以避免油水分離？", "options": ["0℃", "10℃", "20℃", "30℃"], "answer": 2, "note": "", "explanation": "鮮奶油溫度高容易油水分離，加入牛奶時須保持在 10℃以下。", "image": ""}, {"id": "02-105", "section": "02", "sectionName": "原料之選用", "no": 105, "question": "發粉的定義是由小蘇打及酸性鹽混合攪拌而成的一種膨大劑，所產生的二氧化碳量不能低於發粉重量的？", "options": ["4％", "8％", "12 ％", "16％"], "answer": 3, "note": "", "explanation": "依規定，發粉釋放的二氧化碳量不能低於發粉重量的 12％。", "image": ""}, {"id": "02-106", "section": "02", "sectionName": "原料之選用", "no": 106, "question": "在常溫時不釋出氣體，須於烤焙時才釋出二氧化碳氣體，為？", "options": ["快性反應發粉", "慢性反應發粉", "雙重反應發粉", "多重反應發粉"], "answer": 2, "note": "", "explanation": "慢性反應發粉在常溫下不釋出氣體，要等烤焙加熱時才釋出二氧化碳。（題庫答案為慢性反應發粉）", "image": ""}, {"id": "02-107", "section": "02", "sectionName": "原料之選用", "no": 107, "question": "製作蛋糕時，為有效地控制釋出均勻且有規則的氣體，常使用", "options": ["快性反應發粉", "慢性反應發粉", "雙重反應發粉", "銨粉"], "answer": 3, "note": "", "explanation": "雙重反應發粉先在室溫釋出一部分氣體，進爐再釋出其餘，氣體釋放均勻且有規則，適合蛋糕。", "image": ""}, {"id": "02-108", "section": "02", "sectionName": "原料之選用", "no": 108, "question": "椰子粉的脂肪含量約為？", "options": ["30％", "40％", "50％", "60％"], "answer": 4, "note": "", "explanation": "椰子粉脂肪含量高，約 60％。", "image": ""}, {"id": "02-109", "section": "02", "sectionName": "原料之選用", "no": 109, "question": "製作棉花糖時，加入下列何種具有打發起泡特性之膠凍原料？", "options": ["洋菜", "果膠", "阿拉伯膠", "動物膠"], "answer": 4, "note": "", "explanation": "動物膠（吉利丁）具有打發起泡性，所以棉花糖中使用它。", "image": ""}, {"id": "02-110", "section": "02", "sectionName": "原料之選用", "no": 110, "question": "下列何種膠凍原料需添加適當比例的糖與酸，才能形成膠體？", "options": ["洋菜", "果膠", "阿拉伯膠", "動物膠"], "answer": 2, "note": "", "explanation": "果膠需要加入適當比例的糖與酸，才能形成膠體（如果醬）。", "image": ""}, {"id": "02-111", "section": "02", "sectionName": "原料之選用", "no": 111, "question": "小麥之橫斷面呈粉質狀者為何？", "options": ["高筋麵粉", "中筋麵粉", "粉心麵粉", "低筋麵粉"], "answer": 4, "note": "", "explanation": "小麥橫斷面呈粉質狀（不透明、鬆散）者，蛋白質低，磨成低筋麵粉。", "image": ""}, {"id": "02-112", "section": "02", "sectionName": "原料之選用", "no": 112, "question": "小麥之橫斷面呈玻璃質狀者為何？", "options": ["高筋麵粉", "中筋麵粉", "粉心麵粉", "低筋麵粉"], "answer": 1, "note": "", "explanation": "小麥橫斷面呈玻璃質狀（透明、堅硬）者，蛋白質高，磨成高筋麵粉。", "image": ""}, {"id": "02-113", "section": "02", "sectionName": "原料之選用", "no": 113, "question": "麵粉蛋白質是屬於部分不完全蛋白質，因為其胺基酸內缺少了一種必需胺基酸為？", "options": ["甲硫胺酸（methioine）", "胱胺酸（cystine）", "半胱胺酸（cysteine）", "離胺酸（lysine）"], "answer": 4, "note": "", "explanation": "麵粉蛋白質缺少離胺酸這個必需胺基酸，屬於部分不完全蛋白質。", "image": ""}, {"id": "02-114", "section": "02", "sectionName": "原料之選用", "no": 114, "question": "下列何種胺基酸內含有硫氫根（- SH )，並具有還原特性，以影響麵糰之性質？", "options": ["麩胺酸（glutamic acid）", "甘胺酸（glycine）", "半胱胺酸（cysteine）", "離胺酸（lysine）"], "answer": 3, "note": "", "explanation": "半胱胺酸含有硫氫根（-SH），具有還原性，會影響麵糰的性質與筋性。", "image": ""}, {"id": "02-115", "section": "02", "sectionName": "原料之選用", "no": 115, "question": "小麥胚芽中含有下列何種物質，其含有硫氫根（-SH )，會減少麵筋彈性，使麵糰發粘？", "options": ["維生素 E", "礦物質", "油脂", "麩胱甘肽"], "answer": 4, "note": "", "explanation": "麩胱甘肽含 -SH 基，會切斷麵筋中的雙硫鍵，使麵糰變軟、發黏，彈性下降。", "image": ""}, {"id": "02-116", "section": "02", "sectionName": "原料之選用", "no": 116, "question": "可以得到麵粉之吸水量，攪拌時間及攪拌耐力之儀器設備為？", "options": ["麵粉酵素活性測定儀(Amylograph)", "連續溫度黏度測定儀(Viscosgraph)", "麵糰拉力特性測定儀(Extensograph)", "麵糰攪拌特性測定儀(Farinograph)"], "answer": 4, "note": "", "explanation": "Farinograph（麵糰攪拌特性測定儀）可得知麵粉吸水量、攪拌時間與攪拌耐力。", "image": ""}, {"id": "02-117", "section": "02", "sectionName": "原料之選用", "no": 117, "question": "測定低筋粉或軟麥麵粉中膠性粘度之儀器設備為？", "options": ["麵粉沉降係數測定儀(Falling Number)", "連續溫度黏度測定儀(Viscosgraph)", "麵糰拉力特性測定儀(Extensograph)", "麵糰攪拌特性測定儀(Farinograph)"], "answer": 2, "note": "", "explanation": "Viscosgraph（連續溫度黏度測定儀）用於測定低筋粉或軟麥麵粉中膠性（澱粉）黏度。", "image": ""}, {"id": "02-118", "section": "02", "sectionName": "原料之選用", "no": 118, "question": "測定麵筋之伸張力及伸張阻力等品質之儀器設備為？", "options": ["麵粉酵素活性測定儀(Amylograph)", "連續溫度黏度測定儀(Viscosgraph)", "麵糰拉力特性測定儀(Extensograph)", "麵糰攪拌特性測定儀(Farinograph)"], "answer": 3, "note": "", "explanation": "Extensograph（麵糰拉力特性測定儀）測定麵筋的伸張力與伸張阻力。", "image": ""}, {"id": "02-119", "section": "02", "sectionName": "原料之選用", "no": 119, "question": "測定麵粉中之液化酵素的儀器設備為？", "options": ["麵粉酵素活性測定儀(Amylograph)", "連續溫度黏度測定儀(Viscosgraph)", "麵糰拉力特性測定儀(Extensograph)", "麵糰攪拌特性測定儀(Farinograph)"], "answer": 1, "note": "", "explanation": "Amylograph（麵粉酵素活性測定儀）測定麵粉中液化酵素（α-澱粉酶）的活性。", "image": ""}, {"id": "02-120", "section": "02", "sectionName": "原料之選用", "no": 120, "question": "D.E.值（葡萄糖當量）30～50 之澱粉糖漿，其組成成分為？", "options": ["蔗糖", "果糖", "葡萄糖", "糊精、麥芽糖及葡萄糖之混合物"], "answer": 4, "note": "", "explanation": "D.E.值 30～50 的澱粉糖漿是不完全水解的產物，含糊精、麥芽糖與葡萄糖的混合物。", "image": ""}, {"id": "02-121", "section": "02", "sectionName": "原料之選用", "no": 121, "question": "以澱粉為原料經完全水解 D.E.值（葡萄糖當量）為 100 之糖漿產品，其組成成分為？", "options": ["蔗糖", "果糖", "葡萄糖", "澱粉及葡萄糖之混合物"], "answer": 3, "note": "", "explanation": "澱粉完全水解，D.E.值為 100，產物是葡萄糖。", "image": ""}, {"id": "02-122", "section": "02", "sectionName": "原料之選用", "no": 122, "question": "下列何種糖吸濕性最小？", "options": ["砂糖", "果糖", "蜂蜜", "轉化糖"], "answer": 1, "note": "", "explanation": "砂糖（蔗糖）吸濕性最小；果糖、蜂蜜、轉化糖吸濕性強，容易返潮。", "image": ""}, {"id": "02-123", "section": "02", "sectionName": "原料之選用", "no": 123, "question": "有關糖對麵包品質之影響，下列何者有誤？", "options": ["可防止麵包變硬", "是一種柔性材料", "烤焙時著色快", "增加風味"], "answer": 1, "note": "", "explanation": "糖能保持水分，使麵包較柔軟，但並不能「防止變硬」，題庫視為有誤。糖是柔性材料，烤焙時著色快並增加風味。", "image": ""}, {"id": "02-124", "section": "02", "sectionName": "原料之選用", "no": 124, "question": "下列何種糖，酵母發酵產生二氧化碳及酒精之速率最慢？", "options": ["砂糖", "果糖", "葡萄糖", "麥芽糖"], "answer": 4, "note": "", "explanation": "麥芽糖需先被酵母水解成葡萄糖後才能發酵，所以速率最慢。", "image": ""}, {"id": "02-125", "section": "02", "sectionName": "原料之選用", "no": 125, "question": "新鮮雞蛋其 pH 值約為？", "options": ["5.2", "6.5", "7.6", "9.0"], "answer": 3, "note": "", "explanation": "新鮮雞蛋 pH 值約 7.6（蛋白）；貯存後 pH 值升至約 9.0。", "image": ""}, {"id": "02-126", "section": "02", "sectionName": "原料之選用", "no": 126, "question": "雞蛋內含有下列何種酵素，可以殺死多種微生物，增長貯存時間？", "options": ["蛋白質分解酵素", "脂肪分解酵素", "澱粉分解酵素", "溶菌酵素"], "answer": 4, "note": "", "explanation": "雞蛋含有溶菌酵素，能分解細菌細胞壁，延長蛋的貯存時間。", "image": ""}, {"id": "02-127", "section": "02", "sectionName": "原料之選用", "no": 127, "question": "製造乾燥蛋白粉時，為避免於乾燥時產生變色反應，必須去除蛋白內之？", "options": ["葡萄糖", "脂肪", "蛋白質", "礦物質"], "answer": 1, "note": "", "explanation": "蛋白中的葡萄糖會與蛋白質發生梅納反應（褐變），所以製乾燥蛋白粉前要先去除葡萄糖。", "image": ""}, {"id": "02-128", "section": "02", "sectionName": "原料之選用", "no": 128, "question": "蛋經貯藏後蛋白會釋出下列何種氣體，使其 pH 值升高？", "options": ["氫氣", "氮氣", "組織胺", "二氧化碳"], "answer": 4, "note": "", "explanation": "蛋貯存後蛋白釋出二氧化碳，使 pH 值升高。", "image": ""}, {"id": "02-129", "section": "02", "sectionName": "原料之選用", "no": 129, "question": "有關碳酸氫鈉，下列敘述何者錯誤？", "options": ["是一種化學膨大劑", "亦稱小蘇打", "其化學分子式為 NaHCO3", "是一種酸性鹽"], "answer": 4, "note": "", "explanation": "碳酸氫鈉（小蘇打，NaHCO₃）是鹼性鹽，不是酸性鹽；它是化學膨大劑。", "image": ""}, {"id": "02-130", "section": "02", "sectionName": "原料之選用", "no": 130, "question": "有關發粉，下列敘述何者錯誤？", "options": ["以碳酸鈉為主原料", "由各種不同的酸性鹽混合而成", "加澱粉或麵粉為填充劑", "俗稱為泡打粉或發泡粉"], "answer": 1, "note": "", "explanation": "發粉以碳酸氫鈉（小蘇打）為主原料，不是碳酸鈉；其他敘述正確。", "image": ""}, {"id": "02-131", "section": "02", "sectionName": "原料之選用", "no": 131, "question": "下列何者為慢性發粉之主要成分？", "options": ["酸性焦磷酸鹽", "酸性磷酸鈣", "碳酸氫鈉", "碳酸鈉"], "answer": 1, "note": "", "explanation": "慢性發粉的主要成分是酸性焦磷酸鹽（SAPP），在較高溫度時才反應釋出氣體。", "image": ""}, {"id": "02-132", "section": "02", "sectionName": "原料之選用", "no": 132, "question": "小西餅在烘焙過程中，下列何者不是扮演膨脹的因素？", "options": ["碳酸氫銨", "碳酸氫鈉", "酵母", "水"], "answer": 3, "note": "", "explanation": "小西餅膨脹靠碳酸氫銨、碳酸氫鈉與水蒸氣；酵母不是小西餅的膨脹因素。", "image": ""}, {"id": "02-133", "section": "02", "sectionName": "原料之選用", "no": 133, "question": "下列何者製作時需要添加酵母發酵？", "options": ["貓舌小西餅", "瑪琍餅乾", "蘇打餅乾", "椰子餅乾"], "answer": 3, "note": "", "explanation": "蘇打餅乾要添加酵母進行發酵，貓舌餅、瑪琍、椰子餅乾則不需要。", "image": ""}, {"id": "02-134", "section": "02", "sectionName": "原料之選用", "no": 134, "question": "油炸用食用油之總極性化合物（total polar compounds）含量達百分之多少以上時，不得再予使用，應全部更換新油", "options": ["25", "30", "40", "45"], "answer": 1, "note": "", "explanation": "油炸油的極性化合物總量達 25％時，不得再使用，必須全部更換新油。", "image": ""}, {"id": "02-135", "section": "02", "sectionName": "原料之選用", "no": 135, "question": "製作食用豆漿，那一個不是正常步驟？", "options": ["水中浸泡約 3 至 8 個小時", "將黃豆磨碎", "用紗布分離豆渣", "生豆漿不必再加熱"], "answer": 4, "note": "", "explanation": "豆漿製作要先浸泡、磨碎、過濾去渣，生豆漿含有抗胰蛋白酶等有害成分，必須加熱煮沸才可食用。", "image": ""}, {"id": "02-136", "section": "02", "sectionName": "原料之選用", "no": 136, "question": "全豆豆漿含有的成份中那一項是錯的？", "options": ["蛋白質", "油脂", "乳糖", "鈣"], "answer": 3, "note": "", "explanation": "豆漿不含乳糖（乳糖是牛奶特有的糖）。", "image": ""}, {"id": "02-137", "section": "02", "sectionName": "原料之選用", "no": 137, "question": "豆漿的鈣含量和牛奶比較，是", "options": ["低", "高", "一樣", "無法比較"], "answer": 1, "note": "", "explanation": "豆漿的鈣含量比牛奶低。", "image": ""}, {"id": "02-138", "section": "02", "sectionName": "原料之選用", "no": 138, "question": "乳糖不耐症的人喝那種飲料不會產生副作用？", "options": ["全脂牛奶", "豆漿", "脫脂牛奶", "巧克力牛奶"], "answer": 2, "note": "", "explanation": "乳糖不耐症者無法分解乳糖，豆漿不含乳糖，不會產生不良反應。", "image": ""}, {"id": "02-139", "section": "02", "sectionName": "原料之選用", "no": 139, "question": "市售椰奶包裝及脂肪含量那一項是錯的？", "options": ["鋁箔紙盒裝，脂肪含量比較低", "罐裝，脂肪含量比較低", "罐裝，脂肪含量比較高", "包裝不一樣脂肪含量都一樣"], "answer": 2, "note": "", "explanation": "罐裝椰奶含較多椰肉，脂肪含量比鋁箔紙盒裝高，所以「罐裝脂肪含量比較低」是錯的。", "image": ""}, {"id": "02-140", "section": "02", "sectionName": "原料之選用", "no": 140, "question": "下列對椰奶或椰漿(Coconut Milk) 及椰子鮮奶油(Coconut Cream)敘述何者為非：", "options": ["椰奶，水和椰肉的比例約在 1：1，如牛乳一樣的液狀", "椰子鮮奶油，水和椰肉的比例約在 1：4，脂肪含量較高、質地濃稠似鮮奶油", "椰奶在開封前是常溫保存", "椰漿，水和椰肉的比例約在 1：4"], "answer": 4, "note": "", "explanation": "椰漿（椰奶）水與椰肉約 1：1；椰子鮮奶油才是約 1：4，所以說椰漿 1：4 是錯誤的。", "image": ""}, {"id": "02-141", "section": "02", "sectionName": "原料之選用", "no": 141, "question": "素食分類中，那一種不含奶蛋類？", "options": ["奶蛋素", "全素或純素", "植物五辛素", "蛋素"], "answer": 2, "note": "", "explanation": "全素（純素）完全不含奶、蛋、蜂蜜等動物性食品。", "image": ""}, {"id": "02-142", "section": "02", "sectionName": "原料之選用", "no": 142, "question": "下列對鷹嘴豆(Chickpea)敘述何者為非？", "options": ["蛋白質含量高達 28％以上", "用罐頭鷹嘴豆水加糖可以打成的蛋白霜", "對雞蛋敏感及吃全素的人可以代替「蛋白質」", "鷹嘴豆水可以同比例代替雞蛋蛋白"], "answer": 4, "note": "", "explanation": "鷹嘴豆汁（aquafaba）可打發代替蛋白，但鷹嘴豆水本身蛋白質含量低，不能以相同比例完全代替雞蛋蛋白，題庫視為不正確。", "image": ""}, {"id": "02-143", "section": "02", "sectionName": "原料之選用", "no": 143, "question": "對全素(Vegan)敘述何者為非？", "options": ["英國的《經濟學人》報導中全球大趨勢指出 2019 年是全素之年", "這類素食者的飲食跟植物五辛素很像但不吃蛋、奶", "這類素食者不只不食用動物食品，也不使用動物製品", "這類素食者可以食用蜂蜜"], "answer": 4, "note": "", "explanation": "全素者不食用動物來源食品，包括蜂蜜；所以「全素者可以食用蜂蜜」為非。", "image": ""}, {"id": "02-144", "section": "02", "sectionName": "原料之選用", "no": 144, "question": "椰漿敘述何者為非？", "options": ["包括椰子水和椰肉", "南洋料理中常用在煮濃湯時取代牛奶", "椰漿所含碳水化合物超過 20%", "全素業者常用來代替乳製品"], "answer": 3, "note": "", "explanation": "椰漿碳水化合物含量約 6％左右，並未超過 20％。", "image": ""}, {"id": "02-145", "section": "02", "sectionName": "原料之選用", "no": 145, "question": "烘焙產品標示為全素產品，下列那一項原料不應該加入？", "options": ["豆漿粉", "大豆蛋白", "乳清蛋白", "小麥蛋白"], "answer": 3, "note": "", "explanation": "乳清蛋白來自牛奶，屬動物性成分，全素產品不可加入。", "image": ""}, {"id": "02-146", "section": "02", "sectionName": "原料之選用", "no": 146, "question": "製作全素麵包不可加入牛奶，可使用下列那一項原料代替？", "options": ["蛋黃", "蛋白", "鮮奶油", "豆漿"], "answer": 4, "note": "", "explanation": "全素麵包用豆漿代替牛奶，蛋黃、蛋白、鮮奶油都是動物性原料。", "image": ""}, {"id": "02-147", "section": "02", "sectionName": "原料之選用", "no": 147, "question": "製作全素巧克力產品，下列那一項原料不可加入？", "options": ["可可粉", "白巧克力", "可可脂", "可可膏"], "answer": 2, "note": "", "explanation": "白巧克力含有奶粉與乳製品，全素產品不能使用。", "image": ""}, {"id": "02-148", "section": "02", "sectionName": "原料之選用", "no": 148, "question": "攪拌全素麵包下列那一項原料不可取代牛奶？", "options": ["燕麥奶", "豆漿", "黑豆奶", "優格"], "answer": 4, "note": "", "explanation": "優格是由牛奶發酵而成，屬乳製品，不可用於全素；燕麥奶、豆漿、黑豆奶都是植物性。", "image": ""}, {"id": "02-149", "section": "02", "sectionName": "原料之選用", "no": 149, "question": "全素烘焙產品下列那一項原料不可使用？", "options": ["椰子油", "發酵奶油", "橄欖油", "葡萄籽油"], "answer": 2, "note": "", "explanation": "發酵奶油是乳製品，全素不可使用；椰子油、橄欖油、葡萄籽油為植物油。", "image": ""}, {"id": "02-150", "section": "02", "sectionName": "原料之選用", "no": 150, "question": "製作全素產品下列那一項原料可以取代奶粉？", "options": ["米穀粉", "豆漿粉", "玉米粉", "蓬萊米粉"], "answer": 2, "note": "", "explanation": "豆漿粉為植物性，可代替奶粉；米穀粉、玉米粉、蓬萊米粉都沒有奶粉的性質。", "image": ""}, {"id": "02-151", "section": "02", "sectionName": "原料之選用", "no": 151, "question": "製作全素義大利蛋白霜可用那一項原料取代蛋白打發？", "options": ["乳清蛋白", "義大利蛋白霜粉", "鷹嘴豆汁", "豆漿"], "answer": 3, "note": "", "explanation": "鷹嘴豆汁（aquafaba）可打發起泡，用來取代蛋白製作全素蛋白霜。", "image": ""}, {"id": "02-152", "section": "02", "sectionName": "原料之選用", "no": 152, "question": "製作全素布丁餡不可用那一項原料取代牛奶？", "options": ["豆漿粉", "鮮奶油", "豆漿", "燕麥奶"], "answer": 2, "note": "", "explanation": "鮮奶油是動物性乳製品，全素布丁餡不可用來代替牛奶。", "image": ""}, {"id": "02-153", "section": "02", "sectionName": "原料之選用", "no": 153, "question": "全素的烘焙產品不可含有動物性成分，下列那一項原料不可使用？", "options": ["杏桃果膠", "果凍粉", "動物膠", "果膠粉"], "answer": 3, "note": "", "explanation": "動物膠（吉利丁）由動物骨皮製成，全素不可使用；果凍粉、果膠粉、杏桃果膠則為植物性。", "image": ""}, {"id": "02-154", "section": "02", "sectionName": "原料之選用", "no": 154, "question": "製作全素調味餅乾下列那一項原料不可使用？", "options": ["胡椒鹽", "薑黃粉", "辣椒粉", "乳酪粉"], "answer": 4, "note": "", "explanation": "乳酪粉是乳製品，全素調味餅乾不可使用。", "image": ""}, {"id": "02-155", "section": "02", "sectionName": "原料之選用", "no": 155, "question": "製作全素餅乾不可使用下列那一項原料？", "options": ["奶粉", "豆漿粉", "椰漿", "鷹嘴豆汁"], "answer": 1, "note": "", "explanation": "奶粉為乳製品，全素餅乾不可使用。", "image": ""}, {"id": "02-156", "section": "02", "sectionName": "原料之選用", "no": 156, "question": "優格中含有下列那一項原料全素者不可使用？", "options": ["果膠", "動物膠", "檸檬酸", "洋菜"], "answer": 2, "note": "", "explanation": "優格中含動物膠時，全素者不可食用。", "image": ""}, {"id": "02-157", "section": "02", "sectionName": "原料之選用", "no": 157, "question": "製作全素的慕斯蛋糕，不可使用下列那一項原料？", "options": ["動物膠", "可可脂", "寒天粉", "巧克力"], "answer": 1, "note": "", "explanation": "動物膠是動物性原料，全素慕斯蛋糕不可使用，可改用寒天粉等。", "image": ""}, {"id": "02-158", "section": "02", "sectionName": "原料之選用", "no": 158, "question": "果凍中含有下列那一項凝膠原料，全素者不可食用？", "options": ["果凍粉", "果膠", "寒天粉", "動物膠"], "answer": 4, "note": "", "explanation": "動物膠是由動物組織萃取，全素者不可食用；果凍粉、果膠、寒天粉為植物性。", "image": ""}, {"id": "02-159", "section": "02", "sectionName": "原料之選用", "no": 159, "question": "製作鳳梨酥中下列那一項原料，不可用為製作全素之烘焙產品", "options": ["奶油", "冬瓜", "鳳梨", "砂"], "answer": 1, "note": "", "explanation": "奶油是乳製品，全素的鳳梨酥要改用植物油脂；冬瓜、鳳梨、砂糖是植物性。（注意：砂糖在部分全素標準中涉及骨炭精製，但題庫僅以奶油為答案。）", "image": ""}, {"id": "03-1", "section": "03", "sectionName": "產品製作", "no": 1, "question": "西點用亮光糖漿製作原料，下列何者為非？", "options": ["洋菜、水、糖", "桔子果醬、水", "杏桃果膠、水", "糖、水"], "answer": 4, "note": "", "explanation": "亮光糖漿的原料有洋菜（或果膠）、水、糖，或桔子（杏桃）果醬加水等，用來刷在西點表面增加光澤與保濕。只有糖和水不能形成亮光膠質，所以④不是。", "image": ""}, {"id": "03-2", "section": "03", "sectionName": "產品製作", "no": 2, "question": "烤焙時若遇到產品不滿一盤時，可做以下之處理方式才不致於烤焙不均？", "options": ["白紙打濕置於空盤處", "報紙打濕置於空盤處", "將多餘麵糊倒掉不用", "空盤處墊錫箔紙"], "answer": 1, "note": "", "explanation": "烤盤沒有放滿時，空盤處會因熱量集中而使產品烤焦、烤焙不均，可在空盤處放打濕的白紙，吸收熱量並保持平衡；報紙有油墨不衛生，錫箔紙會反射熱。", "image": ""}, {"id": "03-3", "section": "03", "sectionName": "產品製作", "no": 3, "question": "擠製小西餅於烤盤上時如習慣以右手操作者可選擇下列那一項較順手？", "options": ["〔圖形選項一，請對照原 PDF〕", "〔圖形選項二，請對照原 PDF〕", "〔圖形選項三，請對照原 PDF〕", "〔圖形選項四，請對照原 PDF〕"], "answer": 1, "note": "本題選項為圖片，請對照原 PDF 第 10 頁", "explanation": "本題選項為圖片，題庫答案為①。以右手擠製時，通常由左上往右、由上到下依序擠，較為順手。請對照原 PDF 第 10 頁的圖。", "image": ""}, {"id": "03-4", "section": "03", "sectionName": "產品製作", "no": 4, "question": "派皮自模型中取出易破碎原因為？", "options": ["鬆弛時間不夠", "配方中油脂含量太少", "派皮過熱自盤中取出", "烤焙不足"], "answer": 3, "note": "", "explanation": "派皮剛烤好時酥脆易碎，若過熱就從模型取出容易破碎，應稍涼後再取出。", "image": ""}, {"id": "03-5", "section": "03", "sectionName": "產品製作", "no": 5, "question": "製作蒸烤布丁時牛奶與雞蛋拌勻溫度宜控制在？", "options": ["100℃±5℃", "80℃±5℃", "60℃±5℃", "30℃±5℃ ，可縮短烤焙時間"], "answer": 3, "note": "", "explanation": "蒸烤布丁時，牛奶與蛋液混合的溫度控制在約 60℃，可縮短烤焙時間，且蛋不會先凝固。", "image": ""}, {"id": "03-6", "section": "03", "sectionName": "產品製作", "no": 6, "question": "蒸烤布丁烤盤內的水宜選用？", "options": ["冷水", "溫水", "開水", "冰水 ，可縮短烤焙時間又不影響其組織"], "answer": 2, "note": "", "explanation": "蒸烤布丁烤盤內加溫水（不要冷水或沸水），可縮短烤焙時間，又不會讓布丁受熱過急而產生氣孔。", "image": ""}, {"id": "03-7", "section": "03", "sectionName": "產品製作", "no": 7, "question": "製作鬆餅摺疊次數以下列何者為佳？", "options": ["3 折法×1 次", "3 折法×2 次", "3 折法×4 次", "3 折法×6 次"], "answer": 3, "note": "", "explanation": "鬆餅需要多次摺疊才能形成層次，題庫採 3 折法×4 次。次數太少層次不足，過多則油與麵糰混在一起。", "image": ""}, {"id": "03-8", "section": "03", "sectionName": "產品製作", "no": 8, "question": "良好的鬆餅製作環境室溫宜控制在？", "options": ["5℃±5℃", "20℃±5℃", "35℃±5℃", "45℃±5℃"], "answer": 2, "note": "", "explanation": "鬆餅製作環境以 20℃±5℃為佳。太高油脂會融化，太低油脂太硬難擀。", "image": ""}, {"id": "03-9", "section": "03", "sectionName": "產品製作", "no": 9, "question": "要烤出一個組織細緻的蒸烤布丁，烤爐溫度宜選用？", "options": ["100℃", "150℃", "200℃", "250℃"], "answer": 2, "note": "", "explanation": "蒸烤布丁用低溫（約 150℃）慢慢烤，組織才會細緻、少氣孔；高溫會出現孔洞。", "image": ""}, {"id": "03-10", "section": "03", "sectionName": "產品製作", "no": 10, "question": "製作大量手工丹麥小西餅，粉與糖油拌勻時應留意？", "options": ["分次攪拌", "一次攪拌完成", "糖油不需打發即可與粉拌勻", "麵粉不經過篩即可與糖油拌勻 ，方不致麵糰乾硬而不易成型"], "answer": 1, "note": "", "explanation": "大量製作時，粉類要分次加入糖油中拌勻，避免攪拌過度出筋，使麵糰乾硬而不易成型。", "image": ""}, {"id": "03-11", "section": "03", "sectionName": "產品製作", "no": 11, "question": "經攪拌後之蛋白糖以手指勾起成山峰狀，倒置而不彎曲，此階段稱為？", "options": ["起泡狀", "濕性發泡", "乾性發泡", "棉花狀"], "answer": 3, "note": "", "explanation": "蛋白打到以手指勾起呈尖挺的山峰狀，倒置也不彎曲，稱為乾性發泡。", "image": ""}, {"id": "03-12", "section": "03", "sectionName": "產品製作", "no": 12, "question": "製作乳沫類蛋糕，麵糊攪拌之拌打器宜選用？", "options": ["鈎狀", "漿狀", "網狀（球狀）", "螺旋狀"], "answer": 3, "note": "", "explanation": "乳沫類蛋糕要打入大量空氣，使用網狀（球狀）拌打器最有效率。", "image": ""}, {"id": "03-13", "section": "03", "sectionName": "產品製作", "no": 13, "question": "麵糊類蛋糕之配方中油脂含量 60％以下者，其麵糊攪拌不宜用？", "options": ["糖油拌和法", "麵粉油脂拌和法", "直接拌和法", "兩步拌和法"], "answer": 2, "note": "", "explanation": "麵糊類蛋糕油脂在 60％以下時（輕奶油蛋糕），不宜使用麵粉油脂拌合法；該法適用於油脂高的重奶油蛋糕。", "image": ""}, {"id": "03-14", "section": "03", "sectionName": "產品製作", "no": 14, "question": "為使水果蛋糕風味香醇可口，配方中之水果蜜餞，使用前通常浸泡？", "options": ["酒", "清水", "糖水", "食醋"], "answer": 1, "note": "", "explanation": "水果蜜餞用酒（如蘭姆酒）浸泡，可使風味香醇，也能軟化果乾。", "image": ""}, {"id": "03-15", "section": "03", "sectionName": "產品製作", "no": 15, "question": "下列何種蛋糕在製作時，不得沾上任何油脂？", "options": ["大理石蛋糕", "蜂蜜蛋糕", "魔鬼蛋糕", "天使蛋糕"], "answer": 4, "note": "", "explanation": "天使蛋糕靠蛋白泡沫膨脹，蛋白遇到油脂就會消泡，所以烤盤與器具都不能沾到任何油脂。", "image": ""}, {"id": "03-16", "section": "03", "sectionName": "產品製作", "no": 16, "question": "理想的戚風蛋糕麵糊比重約在？", "options": ["0.35", "0.45", "0.65", "0.85"], "answer": 2, "note": "", "explanation": "理想的戚風蛋糕麵糊比重約 0.45。", "image": ""}, {"id": "03-17", "section": "03", "sectionName": "產品製作", "no": 17, "question": "蛋白打發時，為增加其潔白度，可加入適量的？", "options": ["沙拉油", "味素", "檸檬汁", "食鹽"], "answer": 3, "note": "", "explanation": "蛋白打發時加入少量檸檬汁（酸），可使蛋白更潔白、泡沫更安定。", "image": ""}, {"id": "03-18", "section": "03", "sectionName": "產品製作", "no": 18, "question": "烘烤小型或薄層體積之蛋糕，爐溫宜控制為", "options": ["上小／下大", "上大／下小", "上大／下大", "上小／下小"], "answer": 2, "note": "", "explanation": "小型或薄層蛋糕烤焙時間短，要用「上火大、下火小」，使表面快速上色而不致底部焦掉。", "image": ""}, {"id": "03-19", "section": "03", "sectionName": "產品製作", "no": 19, "question": "為改善海綿蛋糕組織之韌性，在製作時可加入適量", "options": ["蛋黃", "蛋白", "麵粉", "食鹽"], "answer": 1, "note": "", "explanation": "蛋黃含卵磷脂與油脂，加入海綿蛋糕可增加韌性、使組織更細緻柔軟。", "image": ""}, {"id": "03-20", "section": "03", "sectionName": "產品製作", "no": 20, "question": "在打發鮮奶油若需要添加細砂糖時，在下列那一種階段下加入較為適宜？", "options": ["攪拌開始時", "鮮奶油即將凝固時", "鮮奶油體膨脹兩倍時", "攪拌終了前"], "answer": 1, "note": "", "explanation": "鮮奶油打發時，細砂糖在攪拌開始時加入，使糖易溶解並讓泡沫穩定。", "image": ""}, {"id": "03-21", "section": "03", "sectionName": "產品製作", "no": 21, "question": "製作甜麵包時，配方中蛋量和水量加起來為 62％，如今已知使用 3 公斤麵粉，蛋量為 240g，應添加多少水？", "options": ["1,520g", "1,620g", "1,720g", "1,820g"], "answer": 2, "note": "", "explanation": "麵粉 3,000 g，蛋與水共 62％＝ 1,860 g，減去蛋量 240 g，水為 1,860 － 240 ＝ 1,620 g。", "image": ""}, {"id": "03-22", "section": "03", "sectionName": "產品製作", "no": 22, "question": "欲控制攪拌後麵糰溫度，以直接法製作時與下列那項因素無關？", "options": ["室溫", "粉溫（或材料溫度）", "機器攪拌所產生的摩擦溫度", "中種麵糰溫度"], "answer": 4, "note": "", "explanation": "直接法的麵糰溫度受室溫、粉溫（材料溫度）與攪拌摩擦溫度影響；中種麵糰溫度屬中種法，與直接法無關。", "image": ""}, {"id": "03-23", "section": "03", "sectionName": "產品製作", "no": 23, "question": "製作麵包有時要翻麵(punching)，下列那一項與翻麵的好處無關？", "options": ["使麵糰內部溫度均勻", "更換空氣，促進酵母發酵", "縮短攪拌時間", "促進麵筋擴展，增加麵筋氣體保留性"], "answer": 3, "note": "", "explanation": "翻麵能均勻溫度、更換空氣促進發酵、增加麵筋氣體保留性，但不能縮短攪拌時間。", "image": ""}, {"id": "03-24", "section": "03", "sectionName": "產品製作", "no": 24, "question": "使用中種法製作麵包，在正常情況下，攪拌後中種麵糰溫度／主麵糰溫度，以下列何者最適宜？", "options": ["5/28", "35/35", "23～25/27～29", "32/10 ℃"], "answer": 3, "note": "", "explanation": "中種法的中種麵糰溫度約 23～25℃，主麵糰溫度約 27～29℃。", "image": ""}, {"id": "03-25", "section": "03", "sectionName": "產品製作", "no": 25, "question": "欲使麵包烤焙後高度一定，後發酵時間常需和麵包烤焙彈性(oven spring)配合，當烤焙彈性大的麵包，入爐時間應", "options": ["提早", "延後", "不變", "隨便"], "answer": 1, "note": "", "explanation": "烤焙彈性（爐內膨脹）大的麵包，後發酵可以較短，入爐時間應提早，否則烤出來會太大。", "image": ""}, {"id": "03-26", "section": "03", "sectionName": "產品製作", "no": 26, "question": "製作麵包有直接法和中種法，各有其優點和缺點，下列那一項不是中種法的優點？", "options": ["省人力，省設備", "味道較好", "體積較大", "產品較柔軟"], "answer": 1, "note": "", "explanation": "中種法的優點是體積大、組織柔軟、風味好，缺點是費人力、設備；所以「省人力省設備」不是優點。", "image": ""}, {"id": "03-27", "section": "03", "sectionName": "產品製作", "no": 27, "question": "製作硬式麵包，一般使用的後發酵條件，溫度、濕度以下列那一項較適宜？", "options": ["42℃、90％", "38℃、85％", "35℃、75％", "10℃、60％"], "answer": 3, "note": "", "explanation": "硬式麵包後發酵溫度約 35℃、濕度約 75％，低溫低濕，使表皮不致太軟。", "image": ""}, {"id": "03-28", "section": "03", "sectionName": "產品製作", "no": 28, "question": "使用分割滾圓機分割麵糰，假如機器分割麵糰每分鐘 30 粒每個 50g，現有 60 公斤麵糰多少時間可分割完？", "options": ["20 分", "30 分", "40 分", "50 分"], "answer": 3, "note": "", "explanation": "60 公斤＝ 60,000 g，÷ 50 g ＝ 1,200 粒，每分鐘 30 粒，1,200 ÷ 30 ＝ 40 分鐘。", "image": ""}, {"id": "03-29", "section": "03", "sectionName": "產品製作", "no": 29, "question": "在沒有空調的室內做麵包時，中間發酵時間，很容易受氣候影響，若要控制中間發酵的溫度和濕度，下列那一項最適當？", "options": ["35℃、85％", "20℃、85％", "28℃、75～80％", "38℃、85％"], "answer": 3, "note": "", "explanation": "中間發酵的適當條件約 28℃、濕度 75～80％，溫度太高易過度發酵，濕度太高表面容易黏手。", "image": ""}, {"id": "03-30", "section": "03", "sectionName": "產品製作", "no": 30, "question": "製作麵包在發酵過程中，麵糰的酸鹼度（pH 值）會？", "options": ["上升", "下降", "不變", "有時高、有時低"], "answer": 2, "note": "", "explanation": "發酵過程產生有機酸與二氧化碳，麵糰的 pH 值會下降。", "image": ""}, {"id": "03-31", "section": "03", "sectionName": "產品製作", "no": 31, "question": "下列何者不是在製作麵包發酵後產物？", "options": ["二氧化碳(CO2)", "氨(NH3)", "熱", "酒精"], "answer": 2, "note": "", "explanation": "麵包發酵的產物有二氧化碳、酒精與熱，不會產生氨。", "image": ""}, {"id": "03-32", "section": "03", "sectionName": "產品製作", "no": 32, "question": "使用不同烤爐來烤焙麵包，下列何者敘述不正確？", "options": ["使用熱風爐，烤焙土司，顏色會較均勻", "使用瓦斯爐，爐溫加熱上升較慢", "使用隧道爐，可連續生產，產量較大", "使用蒸汽爐，烤焙硬式麵包表皮較脆"], "answer": 2, "note": "", "explanation": "瓦斯爐升溫快、熱源直接，爐溫上升並不慢，所以②敘述不正確。熱風爐受熱均勻、烤吐司顏色較均勻；隧道爐可連續生產；蒸氣爐烤硬式麵包表皮較脆，這些都正確。", "image": ""}, {"id": "03-33", "section": "03", "sectionName": "產品製作", "no": 33, "question": "下列何者不是造成小西餅膨大之原因？", "options": ["蘇打粉", "發粉", "砂糖", "攪拌時拌入油脂之空氣"], "answer": 3, "note": "", "explanation": "小西餅膨大靠蘇打粉、發粉與攪拌時拌入的空氣；砂糖不是膨大原因。", "image": ""}, {"id": "03-34", "section": "03", "sectionName": "產品製作", "no": 34, "question": "麵包製作採烘焙百分比，其配方總和為 250％，若使用麵粉 25 公斤，在不考慮損耗之狀況下，可產出麵糰？", "options": ["100 公斤", "75 公斤", "62.5 公斤", "50 公斤"], "answer": 3, "note": "", "explanation": "配方總和 250％，麵粉為 100％；麵粉 25 公斤 ×（250 ÷ 100）＝ 62.5 公斤麵糰。", "image": ""}, {"id": "03-35", "section": "03", "sectionName": "產品製作", "no": 35, "question": "以中種法製作蘇打餅乾，中種麵糰之攪拌應攪拌至？", "options": ["捲起階段", "麵筋擴展階段", "麵筋完成階段", "麵筋斷裂階段"], "answer": 1, "note": "", "explanation": "中種法蘇打餅乾的中種麵糰只需攪拌到捲起階段即可。", "image": ""}, {"id": "03-36", "section": "03", "sectionName": "產品製作", "no": 36, "question": "瑪琍餅乾，其麵糰應攪拌至？", "options": ["捲起階段", "擴展階段", "完成階段", "斷裂階段"], "answer": 3, "note": "", "explanation": "瑪琍餅乾的麵糰要攪拌到完成階段，使麵筋適度形成，利於壓延。", "image": ""}, {"id": "03-37", "section": "03", "sectionName": "產品製作", "no": 37, "question": "奶油小西餅若以機器成型，每次擠出 7 個，每個麵糰重 10 公克，機器轉速(r.p.m)為 50 次/分，現有麵糰 35 公斤，需幾分鐘擠完？", "options": ["10 分鐘", "20 分鐘", "40 分鐘", "50 分鐘"], "answer": 1, "note": "", "explanation": "每次擠 7 個 × 50 次/分＝ 350 個/分；35,000 g ÷ 10 g ＝ 3,500 個；3,500 ÷ 350 ＝ 10 分鐘。", "image": ""}, {"id": "03-38", "section": "03", "sectionName": "產品製作", "no": 38, "question": "線切小西餅，若以機器成型，每次可切出 7 個，機器轉速為 40 次/分，現有麵糰 28 公斤，共花了 20 分鐘切完，則每個麵糰重為？", "options": ["5 公克", "7 公克", "8 公克", "10 公克"], "answer": 1, "note": "", "explanation": "20 分鐘 × 40 次/分 × 7 個＝ 5,600 個；28,000 g ÷ 5,600 ＝ 5 g。", "image": ""}, {"id": "03-39", "section": "03", "sectionName": "產品製作", "no": 39, "question": "烤焙麵包時使用那一種的能源品質最好？", "options": ["瓦斯", "電", "柴油", "重油"], "answer": 1, "note": "", "explanation": "瓦斯是烤焙麵包品質最好的能源：升溫快、溫度好控制、成本合理。", "image": ""}, {"id": "03-40", "section": "03", "sectionName": "產品製作", "no": 40, "question": "製作奶油空心餅若麵糊較硬，則其殼較？", "options": ["厚", "薄", "軟", "不影響"], "answer": 1, "note": "", "explanation": "泡芙麵糊較硬，膨脹受到限制，外殼會比較厚。", "image": ""}, {"id": "03-41", "section": "03", "sectionName": "產品製作", "no": 41, "question": "鬆餅（如眼鏡酥），其膨大的主要原因是？", "options": ["酵母產生的二氧化碳", "發粉分解產生的二氧化碳", "水經加熱形成水蒸氣", "攪拌時拌入的空氣經加熱膨脹"], "answer": 3, "note": "", "explanation": "鬆餅（如眼鏡酥）靠麵糰與油脂交疊的層次，烤焙時水分變成水蒸氣，將層次撐開而膨大。", "image": ""}, {"id": "03-42", "section": "03", "sectionName": "產品製作", "no": 42, "question": "一般麵包類製品中最基本且用量最多的一種材料為？", "options": ["糖", "油脂", "水", "麵粉"], "answer": 4, "note": "", "explanation": "麵粉是麵包類製品中最基本且用量最多的材料（烘焙百分比為 100％）。", "image": ""}, {"id": "03-43", "section": "03", "sectionName": "產品製作", "no": 43, "question": "奶油空心餅，蛋的最低用量為麵粉的？", "options": ["70％", "80％", "90％", "100％"], "answer": 4, "note": "", "explanation": "奶油空心餅蛋量最低約為麵粉的 100％，蛋少則膨脹不足，成品硬而小。", "image": ""}, {"id": "03-44", "section": "03", "sectionName": "產品製作", "no": 44, "question": "戚風類蛋糕其膨大的最主要因素是？", "options": ["蛋白中攪拌入空氣", "塔塔粉", "蛋黃麵糊部分的攪拌", "水"], "answer": 1, "note": "", "explanation": "戚風蛋糕膨大的最主要因素，是蛋白打發時攪入的空氣。", "image": ""}, {"id": "03-45", "section": "03", "sectionName": "產品製作", "no": 45, "question": "土司麵包（白麵包）配方，鹽的用量約為麵粉的", "options": ["0％", "2％", "4％", "6％"], "answer": 2, "note": "", "explanation": "土司麵包的鹽用量約為麵粉的 2％。", "image": ""}, {"id": "03-46", "section": "03", "sectionName": "產品製作", "no": 46, "question": "重奶油蛋糕油脂的最低使用量為？", "options": ["30％", "40％", "50％", "60％"], "answer": 4, "note": "", "explanation": "重奶油蛋糕的油脂用量要在 60％以上（相對於麵粉）。", "image": ""}, {"id": "03-47", "section": "03", "sectionName": "產品製作", "no": 47, "question": "以中種法製作蘇打餅乾時，中種麵糰發酵時的相對濕度應維持在", "options": ["58％±2％", "68％±2％", "78％±2％", "88％±2％"], "answer": 3, "note": "", "explanation": "中種麵糰發酵時，相對濕度以約 78％±2％為宜。", "image": ""}, {"id": "03-48", "section": "03", "sectionName": "產品製作", "no": 48, "question": "標準土司麵包配方內水的用量應為", "options": ["45～50％", "51～55％", "60～64％", "66～70％"], "answer": 3, "note": "", "explanation": "標準土司麵包配方的水量約 60～64％。", "image": ""}, {"id": "03-49", "section": "03", "sectionName": "產品製作", "no": 49, "question": "一般餐包的油脂用量為？", "options": ["4～6％", "8～14％", "15～20％", "25～30％"], "answer": 2, "note": "", "explanation": "一般餐包的油脂用量約 8～14％。", "image": ""}, {"id": "03-50", "section": "03", "sectionName": "產品製作", "no": 50, "question": "依 CNS 之標準，葡萄乾麵包應含葡萄乾量不少於麵粉的", "options": ["20％", "30％", "40％", "50％"], "answer": 1, "note": "", "explanation": "依 CNS 標準，葡萄乾麵包的葡萄乾量不得少於麵粉的 20％。", "image": ""}, {"id": "03-51", "section": "03", "sectionName": "產品製作", "no": 51, "question": "奶油海綿蛋糕中奶油用量最多可用", "options": ["10～20％", "21～30％", "31～39％", "40～50％"], "answer": 4, "note": "", "explanation": "奶油海綿蛋糕的奶油用量最多可用到 40～50％。", "image": ""}, {"id": "03-52", "section": "03", "sectionName": "產品製作", "no": 52, "question": "乳沫類蛋糕其麵糊的打發性主要是來自配方中的？", "options": ["油脂", "蛋", "發粉", "麵粉"], "answer": 2, "note": "", "explanation": "乳沫類蛋糕的麵糊靠蛋打發，所以打發性主要來自蛋。", "image": ""}, {"id": "03-53", "section": "03", "sectionName": "產品製作", "no": 53, "question": "可可粉加入蛋糕配方內時須注意調整其吸水量，今製作魔鬼蛋糕，為增加可口風味，配方中增加 3％的可可粉，則配方中的吸水應該？", "options": ["減少 3％", "增加 3％", "減少 4.5％", "增加 4.5％"], "answer": 4, "note": "", "explanation": "可可粉會吸水，每增加 1％可可粉，要增加 1.5％的水；3％可可粉要增加 4.5％的水。", "image": ""}, {"id": "03-54", "section": "03", "sectionName": "產品製作", "no": 54, "question": "麵粉含水量比標準減少 1％時，則麵包麵糰攪拌時配方內水的用量可隨著增加", "options": ["0", "2", "4", "6 ％"], "answer": 2, "note": "", "explanation": "麵粉含水量比標準少 1％，配方內的水用量可增加約 2％，以維持麵糰軟硬度。", "image": ""}, {"id": "03-55", "section": "03", "sectionName": "產品製作", "no": 55, "question": "煮製奶油空心餅（泡芙）何者為正確？", "options": ["麵粉、油脂、水同時置於鍋中煮沸", "油脂煮沸即加水、麵粉拌勻", "油脂與水煮沸並不斷地攪拌加入麵粉，繼續攪拌加熱至麵粉完全糊化", "水、油脂煮沸即離火，加入麵粉拌勻"], "answer": 3, "note": "", "explanation": "泡芙的作法：油脂與水煮沸並攪拌，加入麵粉繼續攪拌加熱，使麵粉完全糊化，再離火加蛋。", "image": ""}, {"id": "03-56", "section": "03", "sectionName": "產品製作", "no": 56, "question": "小西餅的烤焙原則為何？", "options": ["高溫短時間", "高溫長時間", "低溫短時間", "低溫長時間"], "answer": 1, "note": "", "explanation": "小西餅體積小、水分少，原則是高溫短時間烤焙，才能保持顏色與酥脆。", "image": ""}, {"id": "03-57", "section": "03", "sectionName": "產品製作", "no": 57, "question": "炸油炸甜圈餅（道納司，doughnuts）的油溫以？", "options": ["140～150℃", "180～190℃", "210～220℃", "230～240℃ 為佳"], "answer": 2, "note": "", "explanation": "炸甜甜圈的油溫以 180～190℃為佳。太低會吃油、太高外焦內生。", "image": ""}, {"id": "03-58", "section": "03", "sectionName": "產品製作", "no": 58, "question": "奶油空心餅成型後應該？", "options": ["馬上進爐烘烤", "鬆弛 10 分鐘後進爐", "鬆弛 15 分鐘後進爐", "鬆弛 30 分鐘後進爐"], "answer": 1, "note": "", "explanation": "泡芙麵糊成型後應馬上進爐，否則表面會結皮、影響膨脹。", "image": ""}, {"id": "03-59", "section": "03", "sectionName": "產品製作", "no": 59, "question": "製作麵包時麵粉筋性較弱，應採用何種攪拌速度？", "options": ["快速", "中速", "慢速", "先用快速再改慢速"], "answer": 2, "note": "", "explanation": "麵粉筋性較弱的麵糰，不能用太快速攪拌，應採用中速攪拌，以免傷害麵筋。", "image": ""}, {"id": "03-60", "section": "03", "sectionName": "產品製作", "no": 60, "question": "裹入油脂為麵糰的 1/4，即表示油脂量為麵糰的？", "options": ["20％", "25％", "30％", "35％"], "answer": 2, "note": "", "explanation": "裹入油脂為麵糰的 1/4，即 25％。", "image": ""}, {"id": "03-61", "section": "03", "sectionName": "產品製作", "no": 61, "question": "重奶油蛋糕如欲組織細膩可以採用？", "options": ["直接法攪拌", "糖油拌合法", "麵粉油脂拌合法", "兩步拌合法"], "answer": 3, "note": "", "explanation": "重奶油蛋糕要使組織細膩，用麵粉油脂拌合法：先把油脂與麵粉拌勻，再加糖蛋，這種方法組織最細緻。", "image": ""}, {"id": "03-62", "section": "03", "sectionName": "產品製作", "no": 62, "question": "麵糰分割重量 600 公克，烤好麵包重量為 540 公克，其烤焙損耗是", "options": ["5％", "6％", "10％", "15％"], "answer": 3, "note": "", "explanation": "損耗＝（600 － 540）÷ 600 ＝ 10％。", "image": ""}, {"id": "03-63", "section": "03", "sectionName": "產品製作", "no": 63, "question": "整形後的丹麥麵包或甜麵包麵糰，如需冷藏，冰箱溫度應為何？", "options": ["-5～0℃", "0～7℃", "11～15℃", "16～20℃"], "answer": 2, "note": "", "explanation": "整形後需冷藏的麵糰，冰箱溫度約 0～7℃，避免凍壞或發酵。", "image": ""}, {"id": "03-64", "section": "03", "sectionName": "產品製作", "no": 64, "question": "烤焙法國麵包烤爐內必須有蒸氣設備，蒸氣的壓力為？", "options": ["壓力大，量小", "祇要有蒸氣產生就好", "壓力低，量大", "壓力大，量大"], "answer": 3, "note": "", "explanation": "法國麵包烤爐的蒸氣宜「壓力低、量大」，使表皮薄脆有光澤。", "image": ""}, {"id": "03-65", "section": "03", "sectionName": "產品製作", "no": 65, "question": "海綿蛋糕攪拌有冷攪拌法和熱攪拌法，熱攪拌法是先將蛋加溫至？", "options": ["25℃以下", "25～30℃", "35～43℃", "50℃以上"], "answer": 3, "note": "", "explanation": "熱拌法是把蛋與糖隔水加溫至約 35～43℃，再攪拌打發。", "image": ""}, {"id": "03-66", "section": "03", "sectionName": "產品製作", "no": 66, "question": "海綿蛋糕配方中各項材料百分比加起來得 180％，已知麵糊總量為 9 公斤，其麵粉的用量應為", "options": ["3.5 公斤", "4 公斤", "4.5 公斤", "5 公斤"], "answer": 4, "note": "", "explanation": "麵糊總量 9 公斤，配方總和 180％，麵粉＝ 9  "產品製作", "no": 75, "question": "麵包麵糰的中間發酵時間約為？", "options": ["25～30 分鐘", "8～15 分鐘", "3～5 分鐘", "0 分鐘 即可"], "answer": 2, "note": "", "explanation": "麵包麵糰的中間發酵時間約 8～15 分鐘。", "image": ""}, {"id": "03-76", "section": "03", "sectionName": "產品製作", "no": 76, "question": "奶油空心餅進爐後，在爐內麵糊出油是因為？", "options": ["配方中麵粉用量太多", "加蛋時麵糊太冷無法乳化均勻", "加蛋時麵糊溫度太高", "配方中蛋的用量太多"], "answer": 2, "note": "", "explanation": "泡芙麵糊加蛋時如果太冷，無法乳化均勻，進爐後在爐內容易出油。", "image": ""}, {"id": "03-77", "section": "03", "sectionName": "產品製作", "no": 77, "question": "烤焙用具（塑膠製品除外）貯放前最好之處理方式？", "options": ["用抹布擦淨", "洗淨烤乾", "洗淨用抹布擦乾", "洗後自然涼乾"], "answer": 2, "note": "", "explanation": "烤焙用具（塑膠除外）洗淨後要烤乾，避免生鏽、滋生細菌。", "image": ""}, {"id": "03-78", "section": "03", "sectionName": "產品製作", "no": 78, "question": "奶油空心餅產品內壁呈青色，底部會有很多黑色小孔是配方中使用過多的？", "options": ["蛋", "麵粉", "碳酸氫銨", "油脂"], "answer": 3, "note": "", "explanation": "泡芙內壁呈青色，底部有黑色小孔，是使用過多碳酸氫銨（阿摩尼亞）造成。", "image": ""}, {"id": "03-79", "section": "03", "sectionName": "產品製作", "no": 79, "question": "奶油空心餅成品底部凹陷大，是因為在製作時？", "options": ["技術好", "烤盤油擦太多", "底火太弱", "上火太強"], "answer": 2, "note": "", "explanation": "烤盤油擦太多，泡芙底部容易凹陷。", "image": ""}, {"id": "03-80", "section": "03", "sectionName": "產品製作", "no": 80, "question": "為使奶油空心餅在烤焙後表皮品質及膨大性良好，在進烤爐前可噴？", "options": ["油", "膨脹劑", "蛋白", "水 於麵糊表面"], "answer": 4, "note": "", "explanation": "進爐前在泡芙表面噴水，可保持表面濕潤、延緩結皮，使膨大性與表皮品質良好。", "image": ""}, {"id": "03-81", "section": "03", "sectionName": "產品製作", "no": 81, "question": "奶油空心餅成品內部缺乏空囊是因為？", "options": ["麵糊太乾", "配方內油的用量太少", "使用化學膨脹劑", "麵糊糊化程度良好"], "answer": 1, "note": "", "explanation": "泡芙麵糊太乾，膨脹受限，成品內部缺乏空囊。", "image": ""}, {"id": "03-82", "section": "03", "sectionName": "產品製作", "no": 82, "question": "酵母油炸甜圈餅（道納司，doughnuts）的麵糰應攪拌至？", "options": ["拾起階段", "捲起階段", "麵筋擴展階段", "麵筋斷裂階段"], "answer": 3, "note": "", "explanation": "酵母甜甜圈的麵糰要攪拌到麵筋擴展階段。", "image": ""}, {"id": "03-83", "section": "03", "sectionName": "產品製作", "no": 83, "question": "派皮整型時，使用防黏之麵粉應使用", "options": ["低筋麵粉", "中筋麵粉",
